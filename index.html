<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05070a">

<title>AprilTag iPad V6</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#05070a;
    color:white;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    system-ui,
    sans-serif;
}

body{
    min-height:100svh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom);
}

h1{
    font-size:22px;
    margin:12px 0 4px;
}

.version{
    color:#8f98a5;
    font-size:13px;
    margin-bottom:12px;
}

.viewer{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    border-radius:20px;
    background:#000;
    border:1px solid #ffffff22;
}

video,
#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

video{
    object-fit:contain;
    background:#000;
}

#overlay{
    z-index:1;
    pointer-events:none;
}

.message{
    position:absolute;
    z-index:2;
    left:12px;
    right:12px;
    bottom:12px;
    padding:14px;
    background:#000c;
    border-radius:14px;
    border:1px solid #ffffff22;
    backdrop-filter:blur(12px);
}

.status{
    font-size:17px;
    font-weight:700;
}

.detail{
    margin-top:5px;
    font-size:13px;
    color:#b6bec8;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    min-height:52px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
}

.start{
    background:white;
    color:#05070a;
}

.stop{
    background:#20252d;
    color:white;
    border:1px solid #ffffff22;
}

.hidden{
    display:none;
}

.info{
    margin-top:14px;
    padding:12px;
    border-radius:14px;
    background:#11161d;
    font-size:13px;
    line-height:1.55;
    color:#b8c0cb;
}

.ok{
    color:#70e59b;
}

.warning{
    color:#ffd36b;
}

.error{
    color:#ff7777;
}

</style>
</head>


<body>

<main class="app">

<h1>AprilTag iPad</h1>

<div class="version">
V6.0 — AprilTag 36h11 WASM
</div>


<div
    id="viewer"
    class="viewer">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

    <div class="message">

        <div
            id="status"
            class="status">
            Moteur non chargé
        </div>

        <div
            id="detail"
            class="detail">
            Touchez « Démarrer caméra ».
        </div>

    </div>

</div>


<div class="buttons">

<button
    id="start"
    class="start">
    Démarrer caméra
</button>

<button
    id="stop"
    class="stop hidden">
    Arrêter
</button>

</div>


<div
    id="diagnostic"
    class="info">

    V6 prête.<br>
    Le moteur AprilTag sera chargé au démarrage.

</div>

</main>


<canvas
    id="analysis"
    style="display:none">
</canvas>


<script>

const video =
document.getElementById("camera");

const viewer =
document.getElementById("viewer");

const overlay =
document.getElementById("overlay");

const overlayCtx =
overlay.getContext("2d");

const analysis =
document.getElementById("analysis");

const analysisCtx =
analysis.getContext(
    "2d",
    {
        willReadFrequently:true
    }
);

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const detail =
document.getElementById("detail");

const diagnostic =
document.getElementById("diagnostic");


let stream = null;

let detector = null;

let animationId = null;

let grayBuffer = null;

let lastDetectionTime = 0;


/* =====================================================
   AFFICHAGE
===================================================== */

function setMessage(
    title,
    text,
    type=""
){

    status.textContent =
    title;

    detail.textContent =
    text;

    status.className =
    "status " + type;

}


/* =====================================================
   CHARGEMENT APRILTAG WASM
===================================================== */

async function loadAprilTag(){

    if(detector){
        return detector;
    }


    setMessage(
        "Chargement AprilTag…",
        "Initialisation du moteur WASM.",
        "warning"
    );


    diagnostic.innerHTML =
    "Téléchargement du moteur AprilTag 36h11…";


    return new Promise(
    function(resolve,reject){


        const base =
        "https://arenaxr.github.io/apriltag-js-standalone/";


        window.AprilTagWasmModule = {

            locateFile:function(path){

                return base + path;

            }

        };


        const script =
        document.createElement("script");


        script.src =
        base +
        "apriltag_wasm.js";


        script.onload =
        function(){


            try{


                function getModulePromise(){

                    const wasm =
                    window.AprilTagWasm;


                    if(
                        typeof wasm ===
                        "function"
                    ){

                        return wasm(
                            window.AprilTagWasmModule
                        );

                    }


                    if(
                        wasm &&
                        typeof wasm.then ===
                        "function"
                    ){

                        return wasm;

                    }


                    return null;

                }


                function initialise(
                    Module
                ){

                    try{


                        const init =
                        Module.cwrap(
                            "atagjs_init",
                            "number",
                            []
                        );


                        const options =
                        Module.cwrap(
                            "atagjs_set_detector_options",
                            "number",
                            [
                                "number",
                                "number",
                                "number",
                                "number",
                                "number",
                                "number",
                                "number"
                            ]
                        );


                        const setImage =
                        Module.cwrap(
                            "atagjs_set_img_buffer",
                            "number",
                            [
                                "number",
                                "number",
                                "number"
                            ]
                        );


                        const detect =
                        Module.cwrap(
                            "atagjs_detect",
                            "number",
                            []
                        );


                        init();


                        /*
                        quad decimate = 2
                        sharpen = 0
                        threads = 1
                        */

                        options(
                            2.0,
                            0,
                            1,
                            1,
                            0,
                            0,
                            0
                        );


                        detector = {

                            detect:
                            function(
                                gray,
                                width,
                                height
                            ){

                                const buffer =
                                setImage(
                                    width,
                                    height,
                                    width
                                );


                                Module
                                .HEAPU8
                                .set(
                                    gray,
                                    buffer
                                );


                                const ptr =
                                detect();


                                const length =
                                Module.getValue(
                                    ptr,
                                    "i32"
                                );


                                if(
                                    length === 0
                                ){

                                    return [];

                                }


                                const stringPtr =
                                Module.getValue(
                                    ptr + 4,
                                    "i32"
                                );


                                const bytes =
                                new Uint8Array(

                                    Module
                                    .HEAP8
                                    .buffer,

                                    stringPtr,

                                    length
                                );


                                let json = "";


                                for(
                                    let i=0;
                                    i<length;
                                    i++
                                ){

                                    json +=
                                    String.fromCharCode(
                                        bytes[i]
                                    );

                                }


                                return JSON.parse(
                                    json
                                );

                            }

                        };


                        diagnostic.innerHTML =

                        "<span class='ok'>" +
                        "MOTEUR APRILTAG : PRÊT" +
                        "</span>" +

                        "<br>" +

                        "Famille : tag36h11" +

                        "<br>" +

                        "WebAssembly : chargé";


                        resolve(
                            detector
                        );


                    }

                    catch(error){

                        reject(
                            error
                        );

                    }

                }


                const promise =
                getModulePromise();


                if(promise){

                    promise
                    .then(initialise)
                    .catch(reject);

                }

                else{

                    setTimeout(
                    function(){

                        const delayed =
                        getModulePromise();


                        if(delayed){

                            delayed
                            .then(initialise)
                            .catch(reject);

                        }

                        else{

                            reject(
                                new Error(
                                    "Module WASM introuvable."
                                )
                            );

                        }

                    },
                    200
                    );

                }

            }

            catch(error){

                reject(
                    error
                );

            }

        };


        script.onerror =
        function(){

            reject(
                new Error(
                    "Impossible de télécharger apriltag_wasm.js"
                )
            );

        };


        document.head.appendChild(
            script
        );

    });

}


/* =====================================================
   CAMÉRA
===================================================== */

async function startCamera(){

    startButton.disabled =
    true;


    try{


        if(
            !window.isSecureContext
        ){

            throw new Error(
                "Cette page doit être ouverte en HTTPS."
            );

        }


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "API caméra non disponible."
            );

        }


        await loadAprilTag();


        setMessage(
            "Ouverture caméra…",
            "Activation de la caméra arrière.",
            "warning"
        );


        stream =
        await navigator
        .mediaDevices
        .getUserMedia({

            audio:false,

            video:{

                facingMode:{
                    ideal:"environment"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }

            }

        });


        video.srcObject =
        stream;


        await video.play();


        await waitForVideo();


        configureCanvas();


        startButton
        .classList
        .add(
            "hidden"
        );


        stopButton
        .classList
        .remove(
            "hidden"
        );


        setMessage(
            "Recherche AprilTag…",
            "Présentez un tag36h11 devant la caméra.",
            "warning"
        );


        animationId =
        requestAnimationFrame(
            scanFrame
        );

    }

    catch(error){


        console.error(
            error
        );


        setMessage(
            "Erreur",
            error.message,
            "error"
        );


        diagnostic.innerHTML =

        "<span class='error'>" +
        "ERREUR : " +
        error.message +
        "</span>";


        startButton.disabled =
        false;

    }

}


/* =====================================================
   ATTENTE MÉTADONNÉES VIDÉO
===================================================== */

function waitForVideo(){

    return new Promise(
    function(resolve){


        if(
            video.videoWidth > 0
        ){

            resolve();

            return;

        }


        video.addEventListener(
            "loadedmetadata",
            resolve,
            {
                once:true
            }
        );

    });

}


/* =====================================================
   DIMENSIONS
===================================================== */

function configureCanvas(){

    const width =
    video.videoWidth;

    const height =
    video.videoHeight;


    viewer.style.aspectRatio =
    width + "/" + height;


    /*
    Résolution limitée volontairement
    pour préserver les performances iPad.
    */

    const maximum =
    800;


    const factor =
    Math.min(
        1,
        maximum /
        Math.max(
            width,
            height
        )
    );


    analysis.width =
    Math.round(
        width * factor
    );


    analysis.height =
    Math.round(
        height * factor
    );


    overlay.width =
    analysis.width;


    overlay.height =
    analysis.height;


    grayBuffer =
    new Uint8Array(
        analysis.width *
        analysis.height
    );


    diagnostic.innerHTML =

    "<span class='ok'>" +
    "MOTEUR APRILTAG : PRÊT" +
    "</span>" +

    "<br>" +

    "Famille : tag36h11" +

    "<br>" +

    "Caméra : " +
    width +
    " × " +
    height +

    "<br>" +

    "Analyse : " +
    analysis.width +
    " × " +
    analysis.height;

}


/* =====================================================
   CONVERSION GRIS
===================================================== */

function imageToGray(
    imageData
){

    const data =
    imageData.data;


    let destinationIndex =
    0;


    for(
        let sourceIndex=0;
        sourceIndex<data.length;
        sourceIndex+=4
    ){

        const r =
        data[sourceIndex];

        const g =
        data[sourceIndex+1];

        const b =
        data[sourceIndex+2];


        grayBuffer[
            destinationIndex
        ] =
        (
            r +
            g +
            b
        ) / 3;


        destinationIndex++;

    }

}


/* =====================================================
   BOUCLE DE DÉTECTION
===================================================== */

function scanFrame(
    timestamp
){

    animationId =
    requestAnimationFrame(
        scanFrame
    );


    if(
        !stream ||
        !detector ||
        video.readyState < 2
    ){

        return;

    }


    /*
    environ 10 analyses par seconde
    */

    if(
        timestamp -
        lastDetectionTime <
        100
    ){

        return;

    }


    lastDetectionTime =
    timestamp;


    try{


        analysisCtx
        .drawImage(

            video,

            0,
            0,

            analysis.width,
            analysis.height

        );


        const imageData =
        analysisCtx
        .getImageData(

            0,
            0,

            analysis.width,
            analysis.height

        );


        imageToGray(
            imageData
        );


        const markers =
        detector.detect(

            grayBuffer,

            analysis.width,

            analysis.height

        );


        drawMarkers(
            markers
        );


        if(
            markers &&
            markers.length > 0
        ){


            const ids =
            markers
            .map(
                marker =>
                marker.id
            )
            .join(", ");


            setMessage(
                "TAG DÉTECTÉ ✓",
                "ID : " + ids,
                "ok"
            );


            diagnostic.innerHTML =

            "<span class='ok'>" +
            "APRILTAG DÉTECTÉ" +
            "</span>" +

            "<br>" +

            "Famille : tag36h11" +

            "<br>" +

            "ID : " +
            ids +

            "<br>" +

            "Nombre : " +
            markers.length;

        }

        else{


            setMessage(
                "Recherche AprilTag…",
                "Aucun tag36h11 détecté.",
                "warning"
            );

        }

    }

    catch(error){


        console.error(
            error
        );


        setMessage(
            "Erreur détection",
            error.message,
            "error"
        );


        diagnostic.innerHTML =

        "<span class='error'>" +
        "ERREUR DÉTECTION : " +
        error.message +
        "</span>";

    }

}


/* =====================================================
   DESSIN DES TAGS
===================================================== */

function drawMarkers(
    markers
){

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if(
        !markers ||
        markers.length === 0
    ){

        return;

    }


    markers.forEach(
    function(marker){


        const corners =
        marker.corners;


        if(
            !corners ||
            corners.length < 4
        ){

            return;

        }


        /*
        contour
        */

        overlayCtx
        .beginPath();


        overlayCtx
        .moveTo(
            corners[0].x,
            corners[0].y
        );


        for(
            let i=1;
            i<4;
            i++
        ){

            overlayCtx
            .lineTo(
                corners[i].x,
                corners[i].y
            );

        }


        overlayCtx
        .closePath();


        overlayCtx
        .lineWidth =
        5;


        overlayCtx
        .strokeStyle =
        "#39ff74";


        overlayCtx
        .stroke();


        /*
        centre
        */

        const centerX =
        (
            corners[0].x +
            corners[1].x +
            corners[2].x +
            corners[3].x
        ) / 4;


        const centerY =
        (
            corners[0].y +
            corners[1].y +
            corners[2].y +
            corners[3].y
        ) / 4;


        overlayCtx
        .beginPath();


        overlayCtx
        .arc(
            centerX,
            centerY,
            7,
            0,
            Math.PI*2
        );


        overlayCtx
        .fillStyle =
        "#ff3b30";


        overlayCtx
        .fill();


        /*
        ID
        */

        overlayCtx.font =
        "bold 24px -apple-system";


        const label =
        "ID " +
        marker.id;


        const metrics =
        overlayCtx
        .measureText(
            label
        );


        overlayCtx
        .fillStyle =
        "rgba(0,0,0,.75)";


        overlayCtx
        .fillRect(

            centerX -
            metrics.width/2 -
            6,

            centerY -
            20,

            metrics.width +
            12,

            30

        );


        overlayCtx
        .fillStyle =
        "#39ff74";


        overlayCtx
        .textAlign =
        "center";


        overlayCtx
        .fillText(

            label,

            centerX,

            centerY + 4

        );

    });

}


/* =====================================================
   ARRÊT
===================================================== */

function stopCamera(){

    if(
        animationId
    ){

        cancelAnimationFrame(
            animationId
        );

        animationId =
        null;

    }


    if(
        stream
    ){

        stream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );

    }


    stream =
    null;


    video.srcObject =
    null;


    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    startButton.disabled =
    false;


    startButton
    .classList
    .remove(
        "hidden"
    );


    stopButton
    .classList
    .add(
        "hidden"
    );


    setMessage(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );

}


/* =====================================================
   BOUTONS
===================================================== */

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
