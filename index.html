<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05070a">

<title>AprilTag iPad V5.1</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#05070a;
    color:white;
    font-family:-apple-system,BlinkMacSystemFont,
    "SF Pro Display",system-ui,sans-serif;
}

body{
    min-height:100svh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom);
}

h1{
    font-size:22px;
    margin:12px 0 4px;
}

.version{
    color:#8f98a5;
    font-size:13px;
    margin-bottom:12px;
}

.viewer{
    position:relative;
    width:100%;
    aspect-ratio:3/4;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    border:1px solid #ffffff22;
}

video,
#overlay{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

video{
    object-fit:contain;
    background:#000;
}

#overlay{
    z-index:1;
    pointer-events:none;
}

.message{
    position:absolute;
    z-index:2;

    left:12px;
    right:12px;
    bottom:12px;

    padding:14px;

    background:#000c;

    border-radius:14px;
    border:1px solid #ffffff22;

    backdrop-filter:blur(12px);
}

.status{
    font-size:17px;
    font-weight:700;
}

.detail{
    margin-top:5px;
    font-size:13px;
    color:#b6bec8;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    min-height:52px;
    border:0;
    border-radius:14px;
    font-size:16px;
    font-weight:700;
}

.start{
    background:white;
    color:#05070a;
}

.stop{
    background:#20252d;
    color:white;
    border:1px solid #ffffff22;
}

.hidden{
    display:none;
}

.info{
    margin-top:14px;
    padding:12px;
    border-radius:14px;
    background:#11161d;
    font-size:13px;
    line-height:1.55;
    color:#b8c0cb;
}

.ok{
    color:#70e59b;
}

.error{
    color:#ff7777;
}

.warning{
    color:#ffd36b;
}

.tag{
    color:#70e59b;
}

</style>
</head>

<body>

<main class="app">

<h1>AprilTag iPad</h1>

<div class="version">
V5.1 — Détection tag36h11
</div>

<div
    id="viewer"
    class="viewer">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

    <div class="message">

        <div
            id="status"
            class="status">
            Caméra non démarrée
        </div>

        <div
            id="detail"
            class="detail">
            Touchez « Démarrer caméra ».
        </div>

    </div>

</div>

<div class="buttons">

<button
    id="start"
    class="start">
    Démarrer caméra
</button>

<button
    id="stop"
    class="stop hidden">
    Arrêter
</button>

</div>

<div
    id="diagnostic"
    class="info">
    Chargement du moteur AprilTag…
</div>

</main>


<!--
Moteur AprilTag tag36h11 compilé avec Emscripten
-->
<script
src="https://raw.githubusercontent.com/dividuum/apriltags-emscripten/master/html/apriltag.js">
</script>


<script>

const video =
document.getElementById("camera");

const viewer =
document.getElementById("viewer");

const overlay =
document.getElementById("overlay");

const overlayCtx =
overlay.getContext("2d");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const detail =
document.getElementById("detail");

const diagnostic =
document.getElementById("diagnostic");


let stream = null;

let detector = null;

let detectionRunning = false;

let detectorReady = false;

let detectorTimer = null;

let detectedFrames = 0;

let totalFrames = 0;


/* =============================================
   MESSAGE
============================================= */

function message(title,text,type=""){

    status.textContent = title;

    detail.textContent = text;

    status.className =
        "status " + type;
}


/* =============================================
   CRÉATION DU DÉTECTEUR APRILTAG
============================================= */

function createAprilTagDetector(){

    if(
        typeof Module === "undefined" ||
        typeof Runtime === "undefined" ||
        !Module.cwrap
    ){

        detectorReady = false;

        diagnostic.innerHTML =
        "<span class='error'>" +
        "MOTEUR APRILTAG : NON CHARGÉ" +
        "</span><br>" +
        "La caméra peut fonctionner mais pas la détection.";

        return null;
    }


    const detections = [];


    const detect =
    Module.cwrap(
        "detect",
        "number",
        [
            "number",
            "number",
            "number",
            "number"
        ]
    );


    const detectedCallback =
    Runtime.addFunction(

        function(

            id,

            x1,y1,
            x2,y2,
            x3,y3,
            x4,y4,

            m00,m01,m02,
            m10,m11,m12,
            m20,m21,m22

        ){

            detections.push({

                id:id,

                corners:[

                    {x:x1,y:y1},
                    {x:x2,y:y2},
                    {x:x3,y:y3},
                    {x:x4,y:y4}

                ],

                matrix:[
                    m00,m01,m02,
                    m10,m11,m12,
                    m20,m21,m22
                ]

            });

        }

    );


    detectorReady = true;


    return function(canvas){

        const ctx =
        canvas.getContext(
            "2d",
            {
                willReadFrequently:true
            }
        );


        const imageData =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        );


        const byteCount =
        imageData.data.length;


        const buffer =
        Module._malloc(byteCount);


        Module.HEAPU8.set(
            imageData.data,
            buffer
        );


        detections.length = 0;


        detect(

            detectedCallback,

            canvas.width,

            canvas.height,

            buffer

        );


        Module._free(buffer);


        return detections.slice();

    };

}


/* =============================================
   CANVAS DE DÉTECTION
============================================= */

const detectionCanvas =
document.createElement("canvas");

const detectionCtx =
detectionCanvas.getContext(
    "2d",
    {
        willReadFrequently:true
    }
);


/* =============================================
   INITIALISATION MOTEUR
============================================= */

function initialiseDetector(){

    try{

        detector =
        createAprilTagDetector();


        if(detector){

            diagnostic.innerHTML =
            "<span class='ok'>" +
            "MOTEUR APRILTAG : PRÊT" +
            "</span><br>" +
            "Famille : tag36h11";

        }

    }

    catch(error){

        console.error(error);

        diagnostic.innerHTML =
        "<span class='error'>" +
        "ERREUR MOTEUR APRILTAG" +
        "</span><br>" +
        error.message;

    }

}


/*
Le vieux module Emscripten est généralement
initialisé immédiatement.

On vérifie cependant après un petit délai.
*/

setTimeout(
    initialiseDetector,
    600
);


/* =============================================
   DÉMARRAGE CAMÉRA
============================================= */

async function startCamera(){

    startButton.disabled = true;

    message(
        "Demande caméra…",
        "Ouverture de la caméra arrière.",
        "warning"
    );


    try{

        if(!window.isSecureContext){

            throw new Error(
                "La page doit être ouverte en HTTPS."
            );

        }


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "API caméra indisponible."
            );

        }


        try{

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        exact:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                }

            });

        }

        catch(error){

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"environment"
                    }

                }

            });

        }


        video.srcObject =
        stream;


        await video.play();


        /*
        Attendre que Safari connaisse vraiment
        la taille du flux vidéo.
        */

        await new Promise(resolve=>{

            if(video.videoWidth){

                resolve();

                return;

            }

            video.addEventListener(
                "loadedmetadata",
                resolve,
                {
                    once:true
                }
            );

        });


        configureViewer();


        startButton.classList.add(
            "hidden"
        );

        stopButton.classList.remove(
            "hidden"
        );


        detectionRunning = true;

        totalFrames = 0;

        detectedFrames = 0;


        message(
            "Recherche AprilTag…",
            "Présentez un tag36h11 devant la caméra.",
            "warning"
        );


        if(!detector){

            initialiseDetector();

        }


        detectorTimer =
        setInterval(
            processFrame,
            180
        );

    }

    catch(error){

        console.error(error);


        message(
            "Échec caméra",
            error.name +
            " — " +
            error.message,
            "error"
        );


        startButton.disabled = false;

    }

}


/* =============================================
   CONFIGURATION AFFICHAGE
============================================= */

function configureViewer(){

    const vw =
    video.videoWidth;

    const vh =
    video.videoHeight;


    if(!vw || !vh){
        return;
    }


    /*
    On adapte le cadre au vrai format caméra.
    Ainsi le contour AprilTag reste aligné.
    */

    viewer.style.aspectRatio =
    vw + "/" + vh;


    overlay.width =
    vw;

    overlay.height =
    vh;


    /*
    Détection limitée à environ 640 px
    pour préserver les performances iPad.
    */

    const maxDimension = 640;

    const factor =
    Math.min(
        1,
        maxDimension /
        Math.max(vw,vh)
    );


    detectionCanvas.width =
    Math.round(
        vw * factor
    );

    detectionCanvas.height =
    Math.round(
        vh * factor
    );

}


/* =============================================
   ANALYSE D'UNE IMAGE
============================================= */

function processFrame(){

    if(
        !detectionRunning ||
        !detector ||
        video.readyState < 2
    ){
        return;
    }


    try{

        totalFrames++;


        detectionCtx.drawImage(

            video,

            0,
            0,

            detectionCanvas.width,
            detectionCanvas.height

        );


        const tags =
        detector(
            detectionCanvas
        );


        drawDetections(tags);


        if(tags.length > 0){

            detectedFrames++;


            const ids =
            tags
            .map(tag=>tag.id)
            .join(", ");


            message(

                "TAG DÉTECTÉ ✓",

                tags.length +
                " tag(s) — ID : " +
                ids,

                "ok"

            );


            diagnostic.innerHTML =

            "<span class='ok'>" +
            "APRILTAG DÉTECTÉ" +
            "</span>" +

            "<br>" +

            "Famille : tag36h11" +

            "<br>" +

            "ID : " +
            ids +

            "<br>" +

            "Analyse : " +
            detectionCanvas.width +
            " × " +
            detectionCanvas.height +

            "<br>" +

            "Détections : " +
            detectedFrames;

        }

        else{

            message(

                "Recherche AprilTag…",

                "Aucun tag36h11 détecté.",

                "warning"

            );


            diagnostic.innerHTML =

            "<span class='ok'>" +
            "MOTEUR APRILTAG : ACTIF" +
            "</span>" +

            "<br>" +

            "Famille : tag36h11" +

            "<br>" +

            "Analyse : " +
            detectionCanvas.width +
            " × " +
            detectionCanvas.height +

            "<br>" +

            "Images analysées : " +
            totalFrames;

        }

    }

    catch(error){

        console.error(
            "Erreur détection :",
            error
        );


        diagnostic.innerHTML =

        "<span class='error'>" +
        "ERREUR DÉTECTION" +
        "</span><br>" +

        error.message;


        detectionRunning = false;

    }

}


/* =============================================
   DESSIN DES TAGS
============================================= */

function drawDetections(tags){

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if(!tags || !tags.length){

        return;

    }


    const scaleX =
    overlay.width /
    detectionCanvas.width;


    const scaleY =
    overlay.height /
    detectionCanvas.height;


    tags.forEach(tag=>{

        const points =
        tag.corners.map(p=>({

            x:p.x * scaleX,

            y:p.y * scaleY

        }));


        /* contour */

        overlayCtx.beginPath();

        overlayCtx.moveTo(
            points[0].x,
            points[0].y
        );


        for(let i=1;i<4;i++){

            overlayCtx.lineTo(
                points[i].x,
                points[i].y
            );

        }


        overlayCtx.closePath();


        overlayCtx.lineWidth = 7;

        overlayCtx.strokeStyle =
        "#39ff74";

        overlayCtx.stroke();


        /* centre */

        const cx =
        (
            points[0].x +
            points[1].x +
            points[2].x +
            points[3].x
        ) / 4;


        const cy =
        (
            points[0].y +
            points[1].y +
            points[2].y +
            points[3].y
        ) / 4;


        overlayCtx.beginPath();

        overlayCtx.arc(
            cx,
            cy,
            9,
            0,
            Math.PI * 2
        );

        overlayCtx.fillStyle =
        "#ff3b30";

        overlayCtx.fill();


        /* ID */

        overlayCtx.font =
        "bold 34px -apple-system";

        overlayCtx.lineWidth = 7;

        overlayCtx.strokeStyle =
        "#000";

        overlayCtx.strokeText(

            "ID " + tag.id,

            points[0].x,

            Math.max(
                40,
                points[0].y - 15
            )

        );


        overlayCtx.fillStyle =
        "#39ff74";

        overlayCtx.fillText(

            "ID " + tag.id,

            points[0].x,

            Math.max(
                40,
                points[0].y - 15
            )

        );

    });

}


/* =============================================
   ARRÊT
============================================= */

function stopCamera(){

    detectionRunning =
    false;


    if(detectorTimer){

        clearInterval(
            detectorTimer
        );

        detectorTimer =
        null;

    }


    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if(stream){

        stream
        .getTracks()
        .forEach(
            track=>track.stop()
        );

    }


    stream = null;

    video.srcObject =
    null;


    startButton.disabled =
    false;

    startButton.classList.remove(
        "hidden"
    );

    stopButton.classList.add(
        "hidden"
    );


    message(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );

}


/* =============================================
   BOUTONS
============================================= */

startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    stopCamera
);


/* =============================================
   FERMETURE SAFARI
============================================= */

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
