<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05070a">
<title>AprilTag iPad V6.2</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #05070a;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
}

body { min-height: 100svh; }

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
}

h1 {
    font-size: 22px;
    margin: 12px 0 4px;
}

.version {
    color: #8f98a5;
    font-size: 13px;
    margin-bottom: 12px;
}

.viewer {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 20px;
    background: #000;
    border: 1px solid #ffffff22;
}

video, #overlay {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

video {
    object-fit: contain;
    background: black;
}

#overlay {
    z-index: 1;
    pointer-events: none;
}

.message {
    position: absolute;
    z-index: 2;
    left: 12px;
    right: 12px;
    bottom: 12px;
    padding: 14px;
    background: #000c;
    border-radius: 14px;
    border: 1px solid #ffffff22;
    backdrop-filter: blur(12px);
}

.status {
    font-size: 17px;
    font-weight: 700;
}

.detail {
    margin-top: 5px;
    font-size: 13px;
    color: #b6bec8;
    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    flex: 1;
    min-height: 52px;
    border: 0;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
}

.start {
    background: white;
    color: #05070a;
}

.stop {
    background: #20252d;
    color: white;
    border: 1px solid #ffffff22;
}

.hidden { display: none; }

.info {
    margin-top: 14px;
    padding: 12px;
    border-radius: 14px;
    background: #11161d;
    font-size: 13px;
    line-height: 1.55;
    color: #b8c0cb;
    overflow-wrap: anywhere;
}

.pose-grid {
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.pose-box {
    padding: 10px;
    border-radius: 12px;
    background: #0b1016;
    border: 1px solid #ffffff14;
    text-align: center;
}

.pose-label {
    font-size: 11px;
    color: #8f98a5;
}

.pose-value {
    margin-top: 3px;
    font-size: 17px;
    font-weight: 750;
}

.ok { color: #70e59b; }
.warning { color: #ffd36b; }
.error { color: #ff7777; }
</style>
</head>

<body>
<main class="app">

    <h1>AprilTag iPad</h1>

    <div class="version">
        V6.2 — tag36h11 — pose 3D multi-tags
    </div>

    <div id="viewer" class="viewer">

        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>

        <canvas id="overlay"></canvas>

        <div class="message">
            <div id="status" class="status">Prêt</div>
            <div id="detail" class="detail">
                Touchez « Démarrer caméra ».
            </div>
        </div>
    </div>

    <div class="buttons">

        <button
            id="start"
            class="start"
        >
            Démarrer caméra
        </button>

        <button
            id="stop"
            class="stop hidden"
        >
            Arrêter
        </button>
    </div>

    <div id="diagnostic" class="info">
        V6.2 prête.<br>
        Détection + estimation de pose 3D AprilTag.
    </div>

    <div class="pose-grid">
        <div class="pose-box">
            <div class="pose-label">X cube</div>
            <div id="poseX" class="pose-value">—</div>
        </div>
        <div class="pose-box">
            <div class="pose-label">Y cube</div>
            <div id="poseY" class="pose-value">—</div>
        </div>
        <div class="pose-box">
            <div class="pose-label">Z / distance</div>
            <div id="poseZ" class="pose-value">—</div>
        </div>
    </div>

</main>

<canvas
    id="analysis"
    style="display:none"
></canvas>

<script>
"use strict";

/* ============================================================
   CONFIGURATION V6.2

   IMPORTANT :
   Valeurs provisoires à confirmer physiquement.
   - Tag : 40 mm
   - Cube : 50 mm
   - HFOV caméra : 65°
============================================================ */

const TAG_SIZE_M = 0.040;
const CUBE_EDGE_M = 0.050;
const CAMERA_HFOV_DEG = 65;

/*
  Les IDs du cube sont supposés avoir tous la même taille.
  tag36h11 possède 587 IDs (0 à 586).
*/
const MAX_TAG_ID_TO_CONFIGURE = 586;

/* Lissage du centre du cube */
const CENTER_SMOOTHING_ALPHA = 0.25;


/* ============================================================
   ÉLÉMENTS
============================================================ */

const video =
    document.getElementById("camera");

const viewer =
    document.getElementById("viewer");

const overlay =
    document.getElementById("overlay");

const overlayCtx =
    overlay.getContext("2d");

const analysis =
    document.getElementById("analysis");

const analysisCtx =
    analysis.getContext(
        "2d",
        {
            willReadFrequently: true
        }
    );

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const status =
    document.getElementById("status");

const detail =
    document.getElementById("detail");

const diagnostic =
    document.getElementById("diagnostic");

const poseX =
    document.getElementById("poseX");

const poseY =
    document.getElementById("poseY");

const poseZ =
    document.getElementById("poseZ");


/* ============================================================
   VARIABLES
============================================================ */

let stream = null;
let detector = null;
let animationId = null;
let grayBuffer = null;
let lastDetectionTime = 0;
let detectionRunning = false;

let cameraModel = null;

let smoothedCubeCenter = null;
let previousCubeCenter = null;
let stabilityMm = null;


/* ============================================================
   OUTILS UI
============================================================ */

function setMessage(
    title,
    text,
    type = ""
) {
    status.textContent = title;
    detail.textContent = text;
    status.className = "status " + type;
}


function errorText(error) {

    if (error === undefined) {
        return "Erreur JavaScript : valeur undefined";
    }

    if (error === null) {
        return "Erreur JavaScript : valeur null";
    }

    if (typeof error === "string") {
        return error;
    }

    if (error.message) {
        return error.message;
    }

    try {
        return JSON.stringify(error);
    }
    catch (_) {
        return String(error);
    }
}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   PETITS OUTILS 3D
============================================================ */

function vecAdd(a, b) {
    return [
        a[0] + b[0],
        a[1] + b[1],
        a[2] + b[2]
    ];
}


function vecSub(a, b) {
    return [
        a[0] - b[0],
        a[1] - b[1],
        a[2] - b[2]
    ];
}


function vecScale(v, s) {
    return [
        v[0] * s,
        v[1] * s,
        v[2] * s
    ];
}


function vecLength(v) {
    return Math.hypot(
        v[0],
        v[1],
        v[2]
    );
}


function vecNormalize(v) {

    const length =
        vecLength(v);

    if (!Number.isFinite(length) || length < 1e-9) {
        return [0, 0, 1];
    }

    return vecScale(
        v,
        1 / length
    );
}


function lerpVec(a, b, alpha) {

    return [
        a[0] + (b[0] - a[0]) * alpha,
        a[1] + (b[1] - a[1]) * alpha,
        a[2] + (b[2] - a[2]) * alpha
    ];
}


function project3D(point) {

    if (
        !cameraModel ||
        !point ||
        !Number.isFinite(point[2]) ||
        point[2] <= 0.0001
    ) {
        return null;
    }

    return {
        x:
            cameraModel.fx *
            point[0] /
            point[2] +
            cameraModel.cx,

        y:
            cameraModel.fy *
            point[1] /
            point[2] +
            cameraModel.cy
    };
}


/*
  Le JSON du moteur WASM indique R en "column major".
  R[0], R[1], R[2] sont donc traités ici
  comme les axes locaux X, Y, Z du tag exprimés
  dans le repère caméra.
*/
function poseAxes(marker) {

    if (
        !marker ||
        !marker.pose ||
        !Array.isArray(marker.pose.R) ||
        marker.pose.R.length < 3
    ) {
        return null;
    }

    return {
        x: vecNormalize(marker.pose.R[0]),
        y: vecNormalize(marker.pose.R[1]),
        z: vecNormalize(marker.pose.R[2])
    };
}


/* ============================================================
   CHARGEMENT APRILTAG WASM
============================================================ */

async function loadAprilTag() {

    if (detector) {
        return detector;
    }

    setMessage(
        "Chargement AprilTag…",
        "Initialisation du moteur tag36h11.",
        "warning"
    );

    diagnostic.innerHTML =
        "Téléchargement du moteur AprilTag…";

    return new Promise(
        function(resolve, reject) {

            const base =
                "https://arenaxr.github.io/apriltag-js-standalone/";

            window.AprilTagWasmModule = {

                locateFile:
                function(path) {
                    return base + path;
                }
            };

            const script =
                document.createElement(
                    "script"
                );

            script.src =
                base +
                "apriltag_wasm.js";

            script.onload =
            function() {

                try {

                    function getModulePromise() {

                        const wasm =
                            window.AprilTagWasm;

                        if (
                            typeof wasm ===
                            "function"
                        ) {
                            return wasm(
                                window.AprilTagWasmModule
                            );
                        }

                        if (
                            wasm &&
                            typeof wasm.then ===
                            "function"
                        ) {
                            return wasm;
                        }

                        return null;
                    }


                    function initialise(Module) {

                        try {

                            if (!Module) {
                                throw new Error(
                                    "Module WebAssembly vide."
                                );
                            }

                            if (
                                typeof Module.cwrap !==
                                "function"
                            ) {
                                throw new Error(
                                    "Module.cwrap indisponible."
                                );
                            }

                            const init =
                                Module.cwrap(
                                    "atagjs_init",
                                    "number",
                                    []
                                );

                            const options =
                                Module.cwrap(
                                    "atagjs_set_detector_options",
                                    "number",
                                    [
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number"
                                    ]
                                );

                            const setImage =
                                Module.cwrap(
                                    "atagjs_set_img_buffer",
                                    "number",
                                    [
                                        "number",
                                        "number",
                                        "number"
                                    ]
                                );

                            const setPoseInfo =
                                Module.cwrap(
                                    "atagjs_set_pose_info",
                                    "number",
                                    [
                                        "number",
                                        "number",
                                        "number",
                                        "number"
                                    ]
                                );

                            const setTagSize =
                                Module.cwrap(
                                    "atagjs_set_tag_size",
                                    "number",
                                    [
                                        "number",
                                        "number"
                                    ]
                                );

                            const detectWasm =
                                Module.cwrap(
                                    "atagjs_detect",
                                    "number",
                                    []
                                );

                            const initResult =
                                init();

                            if (initResult !== 0) {
                                throw new Error(
                                    "Échec initialisation moteur AprilTag."
                                );
                            }

                            /*
                              quad_decimate
                              quad_sigma
                              nthreads
                              refine_edges
                              max_detections
                              return_pose = 1
                              return_solutions = 0
                            */
                            options(
                                1.5,
                                0,
                                1,
                                1,
                                0,
                                1,
                                0
                            );

                            /*
                              Tous les IDs du cube sont supposés
                              avoir le même tag physique de 40 mm.
                            */
                            for (
                                let id = 0;
                                id <= MAX_TAG_ID_TO_CONFIGURE;
                                id++
                            ) {
                                setTagSize(
                                    id,
                                    TAG_SIZE_M
                                );
                            }

                            detector = {

                                setCameraInfo(
                                    fx,
                                    fy,
                                    cx,
                                    cy
                                ) {
                                    const result =
                                        setPoseInfo(
                                            fx,
                                            fy,
                                            cx,
                                            cy
                                        );

                                    if (result !== 0) {
                                        throw new Error(
                                            "Impossible de configurer les paramètres caméra."
                                        );
                                    }
                                },

                                async detect(
                                    gray,
                                    width,
                                    height
                                ) {

                                    const buffer =
                                        setImage(
                                            width,
                                            height,
                                            width
                                        );

                                    if (
                                        !Number.isFinite(buffer) ||
                                        buffer <= 0
                                    ) {
                                        throw new Error(
                                            "Impossible de créer le buffer image WASM."
                                        );
                                    }

                                    Module.HEAPU8.set(
                                        gray,
                                        buffer
                                    );

                                    const ptr =
                                        detectWasm();

                                    if (
                                        !Number.isFinite(ptr) ||
                                        ptr <= 0
                                    ) {
                                        return [];
                                    }

                                    const length =
                                        Module.getValue(
                                            ptr,
                                            "i32"
                                        );

                                    if (
                                        !Number.isFinite(length)
                                    ) {
                                        throw new Error(
                                            "Longueur de résultat AprilTag invalide."
                                        );
                                    }

                                    if (length <= 0) {
                                        return [];
                                    }

                                    const stringPtr =
                                        Module.getValue(
                                            ptr + 4,
                                            "i32"
                                        );

                                    if (
                                        !Number.isFinite(stringPtr) ||
                                        stringPtr <= 0
                                    ) {
                                        throw new Error(
                                            "Adresse du résultat AprilTag invalide."
                                        );
                                    }

                                    const bytes =
                                        new Uint8Array(
                                            Module.HEAPU8.buffer,
                                            stringPtr,
                                            length
                                        );

                                    let json = "";

                                    if (
                                        typeof TextDecoder !==
                                        "undefined"
                                    ) {
                                        json =
                                            new TextDecoder(
                                                "utf-8"
                                            )
                                            .decode(
                                                bytes
                                            );
                                    }
                                    else {

                                        for (
                                            let i = 0;
                                            i < length;
                                            i++
                                        ) {
                                            json +=
                                                String.fromCharCode(
                                                    bytes[i]
                                                );
                                        }
                                    }

                                    if (!json) {
                                        return [];
                                    }

                                    const result =
                                        JSON.parse(
                                            json
                                        );

                                    if (
                                        !Array.isArray(result)
                                    ) {
                                        throw new Error(
                                            "Le détecteur n'a pas renvoyé un tableau."
                                        );
                                    }

                                    return result;
                                }
                            };

                            diagnostic.innerHTML =
                                "<span class='ok'>" +
                                "MOTEUR APRILTAG : PRÊT" +
                                "</span>" +
                                "<br>" +
                                "Famille : tag36h11" +
                                "<br>" +
                                "Pose 3D : activée" +
                                "<br>" +
                                "Tag : " +
                                (TAG_SIZE_M * 1000).toFixed(1) +
                                " mm";

                            resolve(
                                detector
                            );
                        }

                        catch(error) {
                            reject(error);
                        }
                    }


                    const promise =
                        getModulePromise();

                    if (promise) {

                        Promise.resolve(
                            promise
                        )
                        .then(
                            initialise
                        )
                        .catch(
                            reject
                        );
                    }
                    else {

                        setTimeout(
                            function() {

                                const delayed =
                                    getModulePromise();

                                if (delayed) {

                                    Promise.resolve(
                                        delayed
                                    )
                                    .then(
                                        initialise
                                    )
                                    .catch(
                                        reject
                                    );
                                }
                                else {

                                    reject(
                                        new Error(
                                            "Module WASM AprilTag introuvable."
                                        )
                                    );
                                }

                            },
                            300
                        );
                    }
                }

                catch(error) {
                    reject(error);
                }
            };

            script.onerror =
            function() {

                reject(
                    new Error(
                        "Impossible de télécharger apriltag_wasm.js"
                    )
                );
            };

            document.head.appendChild(
                script
            );
        }
    );
}


/* ============================================================
   CAMÉRA
============================================================ */

async function startCamera() {

    startButton.disabled =
        true;

    try {

        if (
            !window.isSecureContext
        ) {
            throw new Error(
                "Cette page doit être ouverte en HTTPS."
            );
        }

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {
            throw new Error(
                "API caméra non disponible."
            );
        }

        await loadAprilTag();

        setMessage(
            "Ouverture caméra…",
            "Activation de la caméra arrière.",
            "warning"
        );

        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }
                }
            });

        video.srcObject =
            stream;

        await video.play();

        await waitForVideo();

        configureCanvas();

        startButton
            .classList
            .add(
                "hidden"
            );

        stopButton
            .classList
            .remove(
                "hidden"
            );

        setMessage(
            "Recherche AprilTag…",
            "Présentez le cube devant la caméra.",
            "warning"
        );

        animationId =
            requestAnimationFrame(
                scanFrame
            );
    }

    catch(error) {

        const message =
            errorText(error);

        console.error(error);

        setMessage(
            "Erreur",
            message,
            "error"
        );

        diagnostic.innerHTML =
            "<span class='error'>" +
            "ERREUR : " +
            escapeHtml(message) +
            "</span>";

        startButton.disabled =
            false;
    }
}


/* ============================================================
   ATTENTE VIDÉO
============================================================ */

function waitForVideo() {

    return new Promise(
        function(resolve) {

            if (
                video.videoWidth > 0 &&
                video.videoHeight > 0
            ) {
                resolve();
                return;
            }

            video.addEventListener(
                "loadedmetadata",
                resolve,
                {
                    once: true
                }
            );
        }
    );
}


/* ============================================================
   CANVAS + MODÈLE CAMÉRA
============================================================ */

function configureCanvas() {

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;

    viewer.style.aspectRatio =
        width + "/" + height;

    /*
      Résolution d'analyse limitée
      pour préserver Safari/iPad.
    */
    const maximum =
        800;

    const factor =
        Math.min(
            1,
            maximum /
            Math.max(
                width,
                height
            )
        );

    analysis.width =
        Math.round(
            width * factor
        );

    analysis.height =
        Math.round(
            height * factor
        );

    overlay.width =
        analysis.width;

    overlay.height =
        analysis.height;

    grayBuffer =
        new Uint8Array(
            analysis.width *
            analysis.height
        );

    /*
      Intrinsèques PROVISOIRES :
      Safari ne nous donne pas ici la calibration native complète.
      On convertit un HFOV approximatif en focale pixels.
    */
    const hfovRad =
        CAMERA_HFOV_DEG *
        Math.PI /
        180;

    const fx =
        (analysis.width / 2) /
        Math.tan(
            hfovRad / 2
        );

    /*
      Pixels carrés : fy ≈ fx.
    */
    const fy =
        fx;

    const cx =
        analysis.width / 2;

    const cy =
        analysis.height / 2;

    cameraModel = {
        fx,
        fy,
        cx,
        cy
    };

    detector.setCameraInfo(
        fx,
        fy,
        cx,
        cy
    );

    diagnostic.innerHTML =
        "<span class='ok'>" +
        "CAMÉRA + APRILTAG + POSE : PRÊTS" +
        "</span>" +
        "<br>" +
        "Famille : tag36h11" +
        "<br>" +
        "Caméra : " +
        width +
        " × " +
        height +
        "<br>" +
        "Analyse : " +
        analysis.width +
        " × " +
        analysis.height +
        "<br>" +
        "Tag : " +
        (TAG_SIZE_M * 1000).toFixed(1) +
        " mm • Cube : " +
        (CUBE_EDGE_M * 1000).toFixed(1) +
        " mm" +
        "<br>" +
        "HFOV provisoire : " +
        CAMERA_HFOV_DEG +
        "°";

    smoothedCubeCenter =
        null;

    previousCubeCenter =
        null;

    stabilityMm =
        null;
}


/* ============================================================
   CONVERSION NIVEAUX DE GRIS
============================================================ */

function imageToGray(
    imageData
) {

    const data =
        imageData.data;

    let destinationIndex =
        0;

    for (
        let sourceIndex = 0;
        sourceIndex < data.length;
        sourceIndex += 4
    ) {

        const r =
            data[sourceIndex];

        const g =
            data[sourceIndex + 1];

        const b =
            data[sourceIndex + 2];

        grayBuffer[
            destinationIndex
        ] =
            Math.round(
                0.299 * r +
                0.587 * g +
                0.114 * b
            );

        destinationIndex++;
    }
}


/* ============================================================
   CALCUL CENTRE CUBE MULTI-TAGS

   Pour chaque face détectée :
   centre_cube ≈ centre_tag +/− normale_tag × demi-arête.

   On choisit le signe qui place le centre du cube
   légèrement PLUS LOIN de la caméra que la face visible.
============================================================ */

function estimateCubeCenter(
    markers
) {

    const candidates = [];

    for (const marker of markers) {

        if (
            !marker.pose ||
            !Array.isArray(marker.pose.t) ||
            marker.pose.t.length < 3
        ) {
            continue;
        }

        const t = [
            Number(marker.pose.t[0]),
            Number(marker.pose.t[1]),
            Number(marker.pose.t[2])
        ];

        if (
            !t.every(
                Number.isFinite
            )
        ) {
            continue;
        }

        const axes =
            poseAxes(marker);

        if (!axes) {
            continue;
        }

        const half =
            CUBE_EDGE_M / 2;

        const candidateA =
            vecAdd(
                t,
                vecScale(
                    axes.z,
                    half
                )
            );

        const candidateB =
            vecSub(
                t,
                vecScale(
                    axes.z,
                    half
                )
            );

        /*
          La face visible est devant le centre géométrique :
          le centre du cube doit normalement avoir un Z
          supérieur à celui de la face.
        */
        const cubePoint =
            candidateA[2] >= candidateB[2]
                ? candidateA
                : candidateB;

        const error =
            marker.pose &&
            Number.isFinite(
                Number(marker.pose.e)
            )
                ? Math.max(
                    Number(marker.pose.e),
                    1e-7
                )
                : 1e-4;

        /*
          Poids inverse de l'erreur.
          On plafonne pour éviter qu'une mesure prenne
          un poids démesuré.
        */
        const weight =
            Math.min(
                100000,
                1 / error
            );

        candidates.push({
            marker,
            point: cubePoint,
            weight
        });
    }

    if (candidates.length === 0) {
        return null;
    }

    let sumWeight = 0;
    let sum = [0, 0, 0];

    for (const candidate of candidates) {

        sum =
            vecAdd(
                sum,
                vecScale(
                    candidate.point,
                    candidate.weight
                )
            );

        sumWeight +=
            candidate.weight;
    }

    const center =
        vecScale(
            sum,
            1 / sumWeight
        );

    return {
        center,
        candidates
    };
}


/* ============================================================
   LISSAGE + STABILITÉ
============================================================ */

function updateSmoothedCenter(
    rawCenter
) {

    if (!rawCenter) {
        return null;
    }

    if (!smoothedCubeCenter) {

        smoothedCubeCenter =
            [...rawCenter];

        previousCubeCenter =
            [...rawCenter];

        stabilityMm =
            0;

        return smoothedCubeCenter;
    }

    const before =
        [...smoothedCubeCenter];

    smoothedCubeCenter =
        lerpVec(
            smoothedCubeCenter,
            rawCenter,
            CENTER_SMOOTHING_ALPHA
        );

    stabilityMm =
        vecLength(
            vecSub(
                smoothedCubeCenter,
                before
            )
        ) * 1000;

    previousCubeCenter =
        before;

    return smoothedCubeCenter;
}


function stabilityLabel() {

    if (
        stabilityMm === null ||
        !Number.isFinite(stabilityMm)
    ) {
        return "—";
    }

    if (stabilityMm < 1.5) {
        return "très stable";
    }

    if (stabilityMm < 4) {
        return "stable";
    }

    if (stabilityMm < 8) {
        return "moyen";
    }

    return "instable";
}


/* ============================================================
   DÉTECTION
============================================================ */

async function scanFrame(
    timestamp
) {

    animationId =
        requestAnimationFrame(
            scanFrame
        );

    if (
        !stream ||
        !detector ||
        video.readyState < 2
    ) {
        return;
    }

    if (detectionRunning) {
        return;
    }

    /*
      Environ 8 analyses / seconde.
    */
    if (
        timestamp -
        lastDetectionTime <
        125
    ) {
        return;
    }

    lastDetectionTime =
        timestamp;

    detectionRunning =
        true;

    try {

        analysisCtx.drawImage(
            video,
            0,
            0,
            analysis.width,
            analysis.height
        );

        const imageData =
            analysisCtx.getImageData(
                0,
                0,
                analysis.width,
                analysis.height
            );

        imageToGray(
            imageData
        );

        const markers =
            await detector.detect(
                grayBuffer,
                analysis.width,
                analysis.height
            );

        const cubeEstimate =
            estimateCubeCenter(
                markers
            );

        let cubeCenter = null;

        if (cubeEstimate) {

            cubeCenter =
                updateSmoothedCenter(
                    cubeEstimate.center
                );
        }

        drawScene(
            markers,
            cubeEstimate,
            cubeCenter
        );

        if (
            markers &&
            markers.length > 0
        ) {

            const ids =
                markers
                    .map(
                        marker =>
                            marker.id
                    )
                    .join(", ");

            const poseCount =
                markers.filter(
                    marker =>
                        marker.pose &&
                        marker.pose.t
                ).length;

            setMessage(
                "POSE 3D ACTIVE ✓",
                "ID : " +
                ids +
                " • poses : " +
                poseCount +
                "/" +
                markers.length,
                "ok"
            );

            if (cubeCenter) {

                const xMm =
                    cubeCenter[0] * 1000;

                const yMm =
                    cubeCenter[1] * 1000;

                const zMm =
                    cubeCenter[2] * 1000;

                poseX.textContent =
                    xMm.toFixed(1) +
                    " mm";

                poseY.textContent =
                    yMm.toFixed(1) +
                    " mm";

                poseZ.textContent =
                    zMm.toFixed(1) +
                    " mm";

                diagnostic.innerHTML =
                    "<span class='ok'>" +
                    "CENTRE CUBE ESTIMÉ" +
                    "</span>" +
                    "<br>" +
                    "Tags visibles : " +
                    markers.length +
                    " • ID : " +
                    ids +
                    "<br>" +
                    "X : " +
                    xMm.toFixed(1) +
                    " mm" +
                    " • Y : " +
                    yMm.toFixed(1) +
                    " mm" +
                    " • Z : " +
                    zMm.toFixed(1) +
                    " mm" +
                    "<br>" +
                    "Variation : " +
                    (
                        stabilityMm !== null
                            ? stabilityMm.toFixed(2)
                            : "—"
                    ) +
                    " mm/frame" +
                    " • " +
                    stabilityLabel() +
                    "<br>" +
                    "<span class='warning'>" +
                    "Calibration métrique encore provisoire (HFOV " +
                    CAMERA_HFOV_DEG +
                    "°)." +
                    "</span>";
            }
        }
        else {

            drawScene(
                [],
                null,
                null
            );

            poseX.textContent = "—";
            poseY.textContent = "—";
            poseZ.textContent = "—";

            setMessage(
                "Recherche AprilTag…",
                "Aucun tag36h11 détecté.",
                "warning"
            );
        }
    }

    catch(error) {

        const message =
            errorText(error);

        console.error(
            "Erreur détection :",
            error
        );

        setMessage(
            "Erreur détection",
            message,
            "error"
        );

        diagnostic.innerHTML =
            "<span class='error'>" +
            "ERREUR DÉTECTION" +
            "</span>" +
            "<br>" +
            escapeHtml(
                message
            );
    }

    finally {

        detectionRunning =
            false;
    }
}


/* ============================================================
   DESSIN
============================================================ */

function drawScene(
    markers,
    cubeEstimate,
    cubeCenter
) {

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    if (
        !markers ||
        markers.length === 0
    ) {
        return;
    }

    markers.forEach(
        function(marker) {

            drawMarker(
                marker
            );

            drawTagAxes(
                marker
            );
        }
    );

    if (
        cubeEstimate &&
        cubeEstimate.candidates
    ) {

        for (
            const candidate
            of cubeEstimate.candidates
        ) {

            const p =
                project3D(
                    candidate.point
                );

            if (p) {

                overlayCtx.beginPath();

                overlayCtx.arc(
                    p.x,
                    p.y,
                    5,
                    0,
                    Math.PI * 2
                );

                overlayCtx.fillStyle =
                    "#ffd60a";

                overlayCtx.fill();
            }
        }
    }

    if (cubeCenter) {

        const center2D =
            project3D(
                cubeCenter
            );

        if (center2D) {

            drawCross(
                center2D.x,
                center2D.y,
                14,
                "#ff2d55",
                5
            );

            overlayCtx.font =
                "bold 18px -apple-system";

            overlayCtx.textAlign =
                "center";

            overlayCtx.fillStyle =
                "rgba(0,0,0,.82)";

            overlayCtx.fillRect(
                center2D.x - 66,
                center2D.y + 17,
                132,
                28
            );

            overlayCtx.fillStyle =
                "#ff5b79";

            overlayCtx.fillText(
                "CENTRE CUBE",
                center2D.x,
                center2D.y + 38
            );
        }
    }
}


function drawMarker(
    marker
) {

    const corners =
        marker.corners;

    if (
        !corners ||
        corners.length < 4
    ) {
        return;
    }

    /* CONTOUR */
    overlayCtx.beginPath();

    overlayCtx.moveTo(
        corners[0].x,
        corners[0].y
    );

    for (
        let i = 1;
        i < 4;
        i++
    ) {
        overlayCtx.lineTo(
            corners[i].x,
            corners[i].y
        );
    }

    overlayCtx.closePath();

    overlayCtx.lineWidth =
        5;

    overlayCtx.strokeStyle =
        "#39ff74";

    overlayCtx.stroke();

    /* COINS NUMÉROTÉS */
    corners.forEach(
        function(point, index) {

            overlayCtx.beginPath();

            overlayCtx.arc(
                point.x,
                point.y,
                6,
                0,
                Math.PI * 2
            );

            overlayCtx.fillStyle =
                "#00c8ff";

            overlayCtx.fill();

            overlayCtx.font =
                "bold 13px -apple-system";

            overlayCtx.textAlign =
                "center";

            overlayCtx.fillStyle =
                "white";

            overlayCtx.fillText(
                String(index),
                point.x,
                point.y - 10
            );
        }
    );

    /* CENTRE */
    let centerX;
    let centerY;

    if (
        marker.center &&
        Number.isFinite(
            marker.center.x
        ) &&
        Number.isFinite(
            marker.center.y
        )
    ) {
        centerX =
            marker.center.x;

        centerY =
            marker.center.y;
    }
    else {

        centerX =
            (
                corners[0].x +
                corners[1].x +
                corners[2].x +
                corners[3].x
            ) / 4;

        centerY =
            (
                corners[0].y +
                corners[1].y +
                corners[2].y +
                corners[3].y
            ) / 4;
    }

    overlayCtx.beginPath();

    overlayCtx.arc(
        centerX,
        centerY,
        8,
        0,
        Math.PI * 2
    );

    overlayCtx.fillStyle =
        "#ff3b30";

    overlayCtx.fill();

    /* ID */
    const label =
        "ID " +
        marker.id;

    overlayCtx.font =
        "bold 24px -apple-system";

    const metrics =
        overlayCtx.measureText(
            label
        );

    overlayCtx.fillStyle =
        "rgba(0,0,0,.78)";

    overlayCtx.fillRect(
        centerX -
        metrics.width / 2 -
        8,
        centerY - 44,
        metrics.width + 16,
        34
    );

    overlayCtx.fillStyle =
        "#39ff74";

    overlayCtx.textAlign =
        "center";

    overlayCtx.fillText(
        label,
        centerX,
        centerY - 18
    );
}


function drawTagAxes(
    marker
) {

    if (
        !marker.pose ||
        !Array.isArray(marker.pose.t)
    ) {
        return;
    }

    const axes =
        poseAxes(marker);

    if (!axes) {
        return;
    }

    const origin3D = [
        Number(marker.pose.t[0]),
        Number(marker.pose.t[1]),
        Number(marker.pose.t[2])
    ];

    if (
        !origin3D.every(
            Number.isFinite
        )
    ) {
        return;
    }

    /*
      Axe physique de 20 mm.
    */
    const axisLength =
        0.020;

    const origin2D =
        project3D(
            origin3D
        );

    if (!origin2D) {
        return;
    }

    const endpoints = [
        {
            axis: "X",
            color: "#ff453a",
            point:
                vecAdd(
                    origin3D,
                    vecScale(
                        axes.x,
                        axisLength
                    )
                )
        },
        {
            axis: "Y",
            color: "#32d74b",
            point:
                vecAdd(
                    origin3D,
                    vecScale(
                        axes.y,
                        axisLength
                    )
                )
        },
        {
            axis: "Z",
            color: "#0a84ff",
            point:
                vecAdd(
                    origin3D,
                    vecScale(
                        axes.z,
                        axisLength
                    )
                )
        }
    ];

    for (
        const item
        of endpoints
    ) {

        const p =
            project3D(
                item.point
            );

        if (!p) {
            continue;
        }

        overlayCtx.beginPath();

        overlayCtx.moveTo(
            origin2D.x,
            origin2D.y
        );

        overlayCtx.lineTo(
            p.x,
            p.y
        );

        overlayCtx.lineWidth =
            4;

        overlayCtx.strokeStyle =
            item.color;

        overlayCtx.stroke();

        overlayCtx.font =
            "bold 16px -apple-system";

        overlayCtx.fillStyle =
            item.color;

        overlayCtx.textAlign =
            "center";

        overlayCtx.fillText(
            item.axis,
            p.x,
            p.y - 4
        );
    }
}


function drawCross(
    x,
    y,
    size,
    color,
    width
) {

    overlayCtx.beginPath();

    overlayCtx.moveTo(
        x - size,
        y
    );

    overlayCtx.lineTo(
        x + size,
        y
    );

    overlayCtx.moveTo(
        x,
        y - size
    );

    overlayCtx.lineTo(
        x,
        y + size
    );

    overlayCtx.lineWidth =
        width;

    overlayCtx.strokeStyle =
        color;

    overlayCtx.stroke();
}


/* ============================================================
   ARRÊT
============================================================ */

function stopCamera() {

    if (animationId) {

        cancelAnimationFrame(
            animationId
        );

        animationId =
            null;
    }

    if (stream) {

        stream
            .getTracks()
            .forEach(
                function(track) {
                    track.stop();
                }
            );
    }

    stream =
        null;

    video.srcObject =
        null;

    detectionRunning =
        false;

    smoothedCubeCenter =
        null;

    previousCubeCenter =
        null;

    stabilityMm =
        null;

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );

    poseX.textContent = "—";
    poseY.textContent = "—";
    poseZ.textContent = "—";

    startButton.disabled =
        false;

    startButton
        .classList
        .remove(
            "hidden"
        );

    stopButton
        .classList
        .add(
            "hidden"
        );

    setMessage(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );
}


/* ============================================================
   BOUTONS
============================================================ */

startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    stopCamera
);

window.addEventListener(
    "pagehide",
    stopCamera
);
</script>
