        squares += d * d;
        spreadDeg = Math.max(spreadDeg, rotationAngleDeg(sample, mean));
    }

    const spreadMm = Math.sqrt(squares / samples.length);

    return {
        mean,
        spreadMm,
        spreadDeg,
        score: spreadMm / AUTO_MAX_SPREAD_MM + spreadDeg / AUTO_MAX_SPREAD_DEG
    };
}

function resetStability() {
    relBuffer = [];
    bufferKey = "";
    stability = null;
    bestWindow = null;
    stableCount = 0;
    sinceBest = 0;
}

function lockPosition(stats, auto) {
    recorded = {
        ref: stats.ref,
        members: stats.members,
        rels: stats.means,
        spreadMm: stats.spreadMm,
        spreadDeg: stats.spreadDeg,
        auto
    };
    resetStability();
}

/* Appelée à chaque analyse d'image. */
function updateStability() {
    if (recorded) return;

    if (!liveSet) {
        resetStability();
        return;
    }

    /* La fenêtre ne mélange pas des ensembles de cubes différents. */
    const others = [...liveSet.rels.keys()];
    const key = [liveSet.ref, ...others].map(c => c.number).join(",");
    if (key !== bufferKey) {
        resetStability();
        bufferKey = key;
    }

    relBuffer.push(liveSet);
    if (relBuffer.length > AUTO_WINDOW) relBuffer.shift();
    if (relBuffer.length < AUTO_WINDOW) {
        stability = null;
        return;
    }

    /* Statistiques de chaque cube ; la dispersion retenue est celle du moins stable. */
    const means = new Map();
    let spreadMm = 0, spreadDeg = 0, score = 0;
    for (const cube of others) {
        const st = windowStats(relBuffer.map(sample => sample.rels.get(cube)));
        if (!st) {
            stability = null;
            return;
        }
        means.set(cube, st.mean);
        spreadMm = Math.max(spreadMm, st.spreadMm);
        spreadDeg = Math.max(spreadDeg, st.spreadDeg);
        score = Math.max(score, st.score);
    }

    const stats = { ref: liveSet.ref, members: [liveSet.ref, ...others], means, spreadMm, spreadDeg, score };
    stability = stats;

    const stable = spreadMm <= AUTO_MAX_SPREAD_MM && spreadDeg <= AUTO_MAX_SPREAD_DEG;

    if (!stable) {
        bestWindow = null;
        stableCount = 0;
        sinceBest = 0;
        if (score > 4) autoArmed = true;     // les cubes ont bougé : on réarme
        return;
    }

    if (!autoEnabled || !autoArmed) return;

    /* Stable : on attend encore un peu pour retenir la meilleure fenêtre. */
    stableCount++;
    if (!bestWindow || stats.score < bestWindow.score) {
        bestWindow = stats;
        sinceBest = 0;
    }
    else {
        sinceBest++;
    }

    if (sinceBest >= AUTO_PATIENCE || stableCount >= AUTO_MAX_WAIT) {
        lockPosition(bestWindow, true);
    }
}

function toggleAuto() {
    autoEnabled = !autoEnabled;
    autoArmed = true;
    bestWindow = null;
    stableCount = 0;
    sinceBest = 0;
    updateButtonsAndGrid();
}


/* ============================================================
   ENREGISTREMENT DE LA POSITION
============================================================ */

function toggleRecord() {
    if (recorded) {
        recorded = null;
        autoArmed = false;       // pas de nouvelle validation tant que rien n'a bougé
        resetStability();
        if (!stream) setMessage("Position libérée", "Démarrez la caméra pour un nouvel enregistrement.");
    }
    else if (stability) {
        /* Moyenne des dernières mesures, plus fiable qu'une seule image. */
        lockPosition(stability, false);
    }
    else if (liveSet) {
        recorded = {
            ref: liveSet.ref,
            members: [liveSet.ref, ...liveSet.rels.keys()],
            rels: liveSet.rels,
            spreadMm: null,
            spreadDeg: null,
            auto: false
        };
        resetStability();
    }
    updateButtonsAndGrid();
}

function updateButtonsAndGrid() {
    const set = recorded || liveSet;
    const first = set ? [...set.rels.keys()][0] : null;
    const shown = first ? set.rels.get(first) : null;

    if (shown) {
        gridCaption.textContent =
            "Cube " + first.number + " par rapport au cube " + set.ref.number +
            (set.rels.size > 1 ? " — les autres cubes sont détaillés plus bas" : "");
        const euler = eulerDegrees(shown);
        relEls.x.textContent = (shown.t[0] * 1000).toFixed(2) + " mm";
        relEls.y.textContent = (shown.t[1] * 1000).toFixed(2) + " mm";
        relEls.z.textContent = (shown.t[2] * 1000).toFixed(2) + " mm";
        relEls.roll.textContent = euler.roll.toFixed(2) + "°";
        relEls.pitch.textContent = euler.pitch.toFixed(2) + "°";
        relEls.yaw.textContent = euler.yaw.toFixed(2) + "°";
    }
    else {
        gridCaption.textContent = "Position relative : il faut au moins 2 cubes suivis";
        for (const key in relEls) relEls[key].textContent = "—";
    }

    recordButton.textContent = recorded ? "Libérer la position" : "Enregistrer la position";
    recordButton.className = recorded ? "record locked" : "record";
    recordButton.disabled = !recorded && !liveSet;

    autoButton.textContent = "Validation auto : " + (autoEnabled ? "oui" : "non");
    autoButton.className = autoEnabled ? "auto on" : "auto";

    exportAllButton.disabled = !recorded || recorded.members.some(cube => !cube.template.mesh);
}


/* ============================================================
   DÉTECTION
============================================================ */

async function scanFrame(timestamp) {
    animationId = requestAnimationFrame(scanFrame);

    if (!stream || !detector || video.readyState < 2) return;
    if (detectionRunning) return;
    if (timestamp - lastDetectionTime < DETECTION_INTERVAL_MS) return;

    lastDetectionTime = timestamp;
    detectionRunning = true;

    try {
        analysisCtx.drawImage(video, 0, 0, analysis.width, analysis.height);
        const imageData = analysisCtx.getImageData(0, 0, analysis.width, analysis.height);
        imageToGray(imageData);

        const markers = (await detector.detect(grayBuffer, analysis.width, analysis.height)) || [];
        const now = performance.now();

        updateCubes(markers, now);
        liveSet = computeLiveSet();
        updateStability();

        drawScene(markers);
        updateButtonsAndGrid();
        updateStatus(markers);
    }
    catch (error) {
        const message = errorText(error);
        console.error("Erreur détection :", error);
        setMessage("Erreur détection", message, "error");
        diagnostic.innerHTML =
            "<span class='error'>ERREUR DÉTECTION</span><br>" + escapeHtml(message);
    }
    finally {
        detectionRunning = false;
    }
}


/* ============================================================
   ÉTAT AFFICHÉ
============================================================ */

function cubeStateText(cube) {
    if (cube.frame && !cube.held) return "suivi";
    if (cube.frame && cube.held) return "pose maintenue";
    if (cube.visibleIds.length === 1 && !cube.tagRot[cube.visibleIds[0]]) {
        return "1 seul tag : montrez une fois les 2 tags ensemble";
    }
    if (cube.visibleIds.length > 1) return "pose incomplète";
    return "hors champ";
}

function updateStatus(markers) {
    const tracked = cubes.filter(cube => cube.frame);

    if (recorded) {
        const ref = recorded.ref;
        setMessage(
            recorded.auto ? "Position validée automatiquement" : "Position enregistrée",
            ref.frame
                ? recorded.members.length + " STL fixés par rapport au cube " + ref.number + ". Vous pouvez exporter."
                : "Présentez le cube " + ref.number + " pour revoir les STL. Vous pouvez exporter.",
            "ok"
        );
    }
    else if (tracked.length >= 2) {
        setMessage(
            tracked.length + " cubes suivis",
            !autoEnabled
                ? "Touchez « Enregistrer la position » quand le placement est bon."
                : !autoArmed
                    ? "Validation auto en pause : déplacez un cube pour la relancer."
                    : bestWindow
                        ? "Position stable, validation en cours…"
                        : "Gardez les cubes immobiles pour la validation automatique.",
            "ok"
        );
    }
    else if (tracked.length === 1) {
        setMessage("1 cube suivi", "Il faut au moins 2 cubes dans l'image.", "warning");
    }
    else if (markers.length > 0) {
        setMessage(
            "Pose incomplète",
            "ID visibles : " + markers.map(m => m.id).join(", "),
            "warning"
        );
    }
    else {
        setMessage("Recherche AprilTag…", "Aucun tag36h11 détecté.", "warning");
    }

    const lines = [];

    for (const template of templates) {
        const f = template.faces;
        lines.push(
            "Cubes " + [f.xPlus, f.yPlus, f.zPlus].filter(id => id !== undefined).join(" / ") +
            (template.dots ? " + points" : "") +
            " • STL : " + escapeHtml(template.stlName) + " — " + escapeHtml(template.stlState)
        );
    }

    for (const cube of cubes) {
        let line =
            "<span style='color:" + cubeColor(cube) + ";font-weight:650'>Cube " + cube.number + "</span> : " +
            cubeStateText(cube);

        if (cube.visibleIds.length) line += " • tags : " + cube.visibleIds.join(", ");
        if (cube.center) line += " • distance : " + (cube.center[2] * 1000).toFixed(0) + " mm";
        if (cube.stabilityMm !== null && cube.estimate) line += " • " + stabilityLabel(cube.stabilityMm);
        if (cube.fit) {
            line +=
                "<br>&nbsp;&nbsp;Ajustement : " + cube.fit.rms.toFixed(2) + " px" +
                " • coins de tags : " + cube.fit.nTagPoints +
                (cube.dots ? " • points lus : " + cube.fit.dots.length + " / 9" : "");
        }
        else if (cube.frame && cube.dots) {
            line += "<br>&nbsp;&nbsp;Points : non lus (face à points hors de vue ?)";
        }
        lines.push(line);
    }

    const set = recorded || liveSet;
    if (set) {
        for (const [cube, rel] of set.rels) {
            lines.push(
                (recorded ? "<span class='ok'>Enregistré</span>" : "En direct") +
                " — cube " + cube.number + " / cube " + set.ref.number +
                " : distance entre centres " + (vecLength(rel.t) * 1000).toFixed(2) + " mm"
            );
        }
    }

    if (recorded && recorded.spreadMm !== null) {
        lines.push(
            "Dispersion à l'enregistrement : " +
            recorded.spreadMm.toFixed(3) + " mm • " + recorded.spreadDeg.toFixed(3) + "°" +
            " (moyenne de " + AUTO_WINDOW + " mesures)"
        );
    }

    if (!recorded && liveSet) {
        lines.push(
            stability
                ? "Stabilité actuelle : " +
                  stability.spreadMm.toFixed(3) + " mm • " + stability.spreadDeg.toFixed(3) + "°" +
                  " (seuils : " + AUTO_MAX_SPREAD_MM + " mm • " + AUTO_MAX_SPREAD_DEG + "°)"
                : "Stabilité : mesure en cours (" + relBuffer.length + " / " + AUTO_WINDOW + ")"
        );
    }

    const others = markers
        .map(m => Number(m.id))
        .filter(id => !templateByTagId.has(id));
    if (others.length) lines.push("Autres tags ignorés : " + others.join(", "));

    lines.push(
        "<span class='warning'>Calibration métrique encore provisoire (HFOV " +
        CAMERA_HFOV_DEG + "°, tag " + (TAG_SIZE_M * 1000).toFixed(0) + " mm).</span>"
    );

    diagnostic.innerHTML = lines.join("<br>");
}


/* ============================================================
   DESSIN
============================================================ */

const UI_FONT = "-apple-system, BlinkMacSystemFont, system-ui, sans-serif";
const AXIS_COLORS = { X: "#ff8787", Y: "#8ce99a", Z: "#74c0fc" };

function cubeColor(cube, alpha = 1) {
    return "rgba(" + cube.color.join(", ") + ", " + alpha + ")";
}

function clearOverlay() {
    overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
    overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
}

function roundRectPath(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

/* Petite étiquette arrondie, centrée sur (x, y). */
function drawPill(text, x, y, color, size = 12) {
    const ctx = overlayCtx;
    ctx.save();
    ctx.font = "600 " + size + "px " + UI_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const h = size + 9;
    const w = ctx.measureText(text).width + size + 4;

    roundRectPath(ctx, x - w / 2, y - h / 2, w, h, h / 2);
    ctx.fillStyle = "rgba(10, 10, 12, .62)";
    ctx.fill();
    ctx.lineWidth = 1;
    ctx.strokeStyle = "rgba(255, 255, 255, .14)";
    ctx.stroke();

    ctx.fillStyle = color;
    ctx.fillText(text, x, y + 0.5);
    ctx.restore();
}

function drawScene(markers) {
    clearOverlay();
    overlayCtx.setTransform(overlayScale, 0, 0, overlayScale, 0, 0);

    for (const marker of markers) drawMarker(marker);

    /* Un STL par cube : en direct, ou fixé par rapport au cube de référence après enregistrement. */
    if (recorded) {
        const ref = recorded.ref;
        if (ref.frame) {
            for (const cube of recorded.members) {
                drawSTL(cube, cube === ref ? ref.frame : frameFromRelative(ref.frame, recorded.rels.get(cube)));
            }
        }
        for (const cube of cubes) {
            if (!recorded.members.includes(cube) && cube.frame) drawSTL(cube, cube.frame);
        }
    }
    else {
        for (const cube of cubes) {
            if (cube.frame) drawSTL(cube, cube.frame);
        }
    }

    for (const cube of cubes) {
        if (cube.frame) {
            const top = drawCubeAxes(cube.frame, cube.edgeM * AXIS_LENGTH_RATIO);
            if (top) {
                drawPill(
                    "Cube " + cube.number + (cube.held ? " · maintenu" : ""),
                    top.x,
                    top.y - 24,
                    cubeColor(cube)
                );
            }
        }
        /* Points de la face à points effectivement mesurés. */
        if (cube.fit && cube.fit.dots.length) {
            overlayCtx.save();
            overlayCtx.lineWidth = 1.2;
            overlayCtx.strokeStyle = cubeColor(cube);
            for (const d of cube.fit.dots) {
                overlayCtx.beginPath();
                overlayCtx.arc(d.u, d.v, 3.5, 0, Math.PI * 2);
                overlayCtx.stroke();
            }
            overlayCtx.restore();
        }
        if (!cube.frame && cube.center) {
            /* Une seule face visible : centre estimé, sans orientation. */
            const c = project3D(cube.center);
            if (c) {
                overlayCtx.beginPath();
                overlayCtx.arc(c.x, c.y, 7, 0, Math.PI * 2);
                overlayCtx.lineWidth = 1.5;
                overlayCtx.setLineDash([3, 3]);
                overlayCtx.strokeStyle = cubeColor(cube);
                overlayCtx.stroke();
                overlayCtx.setLineDash([]);
            }
        }
    }
}

/* Repère X / Y / Z du cube. Renvoie le point le plus haut du dessin. */
function drawCubeAxes(frame, length) {
    const origin2D = project3D(frame.origin);
    if (!origin2D) return null;

    let top = origin2D;

    const ctx = overlayCtx;
    const axes = [["X", frame.x], ["Y", frame.y], ["Z", frame.z]];

    ctx.save();
    ctx.lineCap = "round";
    ctx.font = "700 11px " + UI_FONT;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    for (const [name, vector] of axes) {
        const tip = project3D(vecAdd(frame.origin, vecScale(vector, length)));
        if (!tip) continue;
        if (tip.y < top.y) top = tip;

        ctx.beginPath();
        ctx.moveTo(origin2D.x, origin2D.y);
        ctx.lineTo(tip.x, tip.y);
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = AXIS_COLORS[name];
        ctx.stroke();

        /* Lettre placée juste au-delà de la pointe. */
        const dx = tip.x - origin2D.x;
        const dy = tip.y - origin2D.y;
        const d = Math.hypot(dx, dy) || 1;
        ctx.fillStyle = AXIS_COLORS[name];
        ctx.fillText(name, tip.x + dx / d * 9, tip.y + dy / d * 9);
    }

    ctx.beginPath();
    ctx.arc(origin2D.x, origin2D.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.restore();

    return top;
}

/* Tag détecté : quatre équerres aux coins et le numéro au centre. */
function drawMarker(marker) {
    const c = marker.corners;
    if (!c || c.length < 4) return;

    const cube = marker._cube || null;
    const color = cube ? cubeColor(cube) : "rgba(255, 255, 255, .7)";
    const ctx = overlayCtx;

    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = color;

    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
    ctx.closePath();
    ctx.globalAlpha = 0.3;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.globalAlpha = 1;
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        const p = c[i];
        const a = c[(i + 1) % 4];
        const b = c[(i + 3) % 4];
        ctx.moveTo(p.x + (a.x - p.x) * 0.2, p.y + (a.y - p.y) * 0.2);
        ctx.lineTo(p.x, p.y);
        ctx.lineTo(p.x + (b.x - p.x) * 0.2, p.y + (b.y - p.y) * 0.2);
    }
    ctx.stroke();
    ctx.restore();

    const centerX = (c[0].x + c[1].x + c[2].x + c[3].x) / 4;
    const centerY = (c[0].y + c[1].y + c[2].y + c[3].y) / 4;
    drawPill(String(marker.id), centerX, centerY, color, 11);
}


/* ============================================================
   ARRÊT
   La position enregistrée est conservée : l'export reste possible.
============================================================ */

function stopCamera() {
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }

    if (stream) {
        stream.getTracks().forEach(function(track) { track.stop(); });
    }

    stream = null;
    video.srcObject = null;
    detectionRunning = false;
    liveSet = null;
    resetStability();
    cubes = [];

    clearOverlay();

    startButton.disabled = false;
    startButton.classList.remove("hidden");
    stopButton.classList.add("hidden");

    updateButtonsAndGrid();

    setMessage(
        "Caméra arrêtée",
        recorded
            ? "Position enregistrée conservée : l'export reste possible."
            : "Touchez Démarrer caméra pour reprendre."
    );
}


/* ============================================================
   BOUTONS
============================================================ */

startButton.addEventListener("click", startCamera);
stopButton.addEventListener("click", stopCamera);
recordButton.addEventListener("click", toggleRecord);
autoButton.addEventListener("click", toggleAuto);
exportAllButton.addEventListener("click", exportAll);
window.addEventListener("pagehide", stopCamera);
</script>
