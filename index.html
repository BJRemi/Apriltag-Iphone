<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05070a">

<title>AprilTag iPad V5</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#05070a;
    color:white;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    system-ui,
    sans-serif;
}

body{
    min-height:100svh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:
    env(safe-area-inset-top)
    14px
    env(safe-area-inset-bottom);
}

h1{
    font-size:22px;
    margin:12px 0 4px;
}

.version{
    color:#8f98a5;
    font-size:13px;
    margin-bottom:12px;
}

.viewer{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    border:1px solid #ffffff22;
}

video{
    position:absolute;
    width:100%;
    height:100%;
    inset:0;

    object-fit:cover;

    background:#111;
}

.message{
    position:absolute;
    z-index:2;

    left:12px;
    right:12px;
    bottom:12px;

    padding:14px;

    background:#000c;

    border-radius:14px;
    border:1px solid #ffffff22;

    backdrop-filter:blur(12px);
}

.status{
    font-size:17px;
    font-weight:700;
}

.detail{
    margin-top:5px;
    font-size:13px;
    color:#b6bec8;
    word-break:break-word;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;

    min-height:52px;

    border:0;
    border-radius:14px;

    font-size:16px;
    font-weight:700;
}

.start{
    background:white;
    color:#05070a;
}

.stop{
    background:#20252d;
    color:white;
    border:1px solid #ffffff22;
}

.hidden{
    display:none;
}

.info{
    margin-top:14px;

    padding:12px;

    border-radius:14px;

    background:#11161d;

    font-size:13px;
    line-height:1.5;

    color:#b8c0cb;
}

.ok{
    color:#70e59b;
}

.error{
    color:#ff7777;
}

.warning{
    color:#ffd36b;
}

</style>
</head>


<body>

<main class="app">

<h1>AprilTag iPad</h1>

<div class="version">
V5.0 — Test caméra
</div>


<div class="viewer">

<video
    id="camera"
    autoplay
    muted
    playsinline>
</video>


<div class="message">

<div
    id="status"
    class="status">
    Caméra non démarrée
</div>

<div
    id="detail"
    class="detail">
    Touchez « Démarrer caméra ».
</div>

</div>

</div>


<div class="buttons">

<button
    id="start"
    class="start">
    Démarrer caméra
</button>

<button
    id="stop"
    class="stop hidden">
    Arrêter
</button>

</div>


<div
    id="diagnostic"
    class="info">
    Diagnostic en attente…
</div>


</main>


<script>

const video =
document.getElementById("camera");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const detail =
document.getElementById("detail");

const diagnostic =
document.getElementById("diagnostic");


let stream = null;


/* ------------------------------------------------
   AFFICHAGE DES INFORMATIONS
------------------------------------------------ */

function message(title,text,type=""){

    status.textContent = title;

    detail.textContent = text;

    status.className =
        "status " + type;
}


/* ------------------------------------------------
   DIAGNOSTIC SAFARI
------------------------------------------------ */

function showDiagnostic(){

    let txt = "";

    txt +=
    "HTTPS : " +
    (window.isSecureContext ? "OUI" : "NON");

    txt += "<br>";

    txt +=
    "MediaDevices : " +
    (navigator.mediaDevices ? "OUI" : "NON");

    txt += "<br>";

    txt +=
    "getUserMedia : " +
    (
        navigator.mediaDevices &&
        navigator.mediaDevices.getUserMedia
        ? "OUI"
        : "NON"
    );

    txt += "<br>";

    txt +=
    "Navigateur : " +
    navigator.userAgent;

    diagnostic.innerHTML = txt;
}


showDiagnostic();


/* ------------------------------------------------
   DÉMARRAGE CAMÉRA
------------------------------------------------ */

async function startCamera(){

    startButton.disabled = true;

    message(
        "Demande caméra…",
        "Safari doit demander l’autorisation.",
        "warning"
    );


    try{


        /* Vérification HTTPS */

        if(!window.isSecureContext){

            throw new Error(
                "La page n'est pas ouverte en HTTPS."
            );

        }


        /* Vérification API caméra */

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "Safari ne donne pas accès à l'API caméra."
            );

        }


        /* PREMIER ESSAI :
           caméra arrière
        */

        try{

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        exact:"environment"
                    }

                }

            });

        }

        catch(firstError){

            console.log(
                "Caméra arrière exacte indisponible.",
                firstError
            );


            /* SECOND ESSAI :
               laisser Safari choisir
            */

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"environment"
                    }

                }

            });

        }


        video.srcObject = stream;


        await video.play();


        const track =
        stream.getVideoTracks()[0];


        const settings =
        track.getSettings
        ? track.getSettings()
        : {};


        message(
            "Caméra active",
            "Flux vidéo reçu correctement.",
            "ok"
        );


        diagnostic.innerHTML =

        "CAMÉRA : OK" +

        "<br>" +

        "Résolution : " +
        (settings.width || "?") +
        " × " +
        (settings.height || "?") +

        "<br>" +

        "Facing mode : " +
        (settings.facingMode || "?") +

        "<br>" +

        "HTTPS : OUI";


        startButton.classList.add("hidden");

        stopButton.classList.remove("hidden");

    }

    catch(error){

        console.error(error);


        let explanation =
        error.name +
        " — " +
        error.message;


        if(error.name === "NotAllowedError"){

            explanation =
            "Safari a refusé l'accès à la caméra. Vérifiez l'autorisation caméra du site.";

        }


        if(error.name === "NotFoundError"){

            explanation =
            "Aucune caméra compatible n'a été trouvée.";

        }


        if(error.name === "NotReadableError"){

            explanation =
            "La caméra existe mais Safari ne peut pas l'utiliser actuellement.";

        }


        message(
            "Échec caméra",
            explanation,
            "error"
        );


        diagnostic.innerHTML =
        "ERREUR : " +
        error.name +
        "<br>" +
        error.message;


        startButton.disabled = false;

    }

}


/* ------------------------------------------------
   ARRÊT
------------------------------------------------ */

function stopCamera(){

    if(stream){

        stream
        .getTracks()
        .forEach(
            track => track.stop()
        );

    }


    stream = null;

    video.srcObject = null;


    startButton.disabled = false;

    startButton.classList.remove("hidden");

    stopButton.classList.add("hidden");


    message(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );

}


/* ------------------------------------------------
   BOUTONS
------------------------------------------------ */

startButton.addEventListener(
    "click",
    startCamera
);

stopButton.addEventListener(
    "click",
    stopCamera
);


/* ------------------------------------------------
   SÉCURITÉ LORSQUE SAFARI QUITTE LA PAGE
------------------------------------------------ */

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
