<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070a"><title>AprilTag 40 mm</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05070a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif}body{min-height:100svh}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}.viewer{position:relative;overflow:hidden;border-radius:22px;background:#111;aspect-ratio:3/4;margin-top:10px}video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}canvas{pointer-events:none}.top{position:absolute;z-index:3;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px}.pill{background:#000b;border:1px solid #ffffff22;border-radius:999px;padding:8px 11px;font-size:13px;backdrop-filter:blur(12px)}.hud{position:absolute;z-index:3;left:12px;right:12px;bottom:12px;background:#000c;border:1px solid #ffffff22;border-radius:18px;padding:14px;backdrop-filter:blur(14px)}.status{font-weight:700;font-size:17px}.sub{color:#b8bec8;font-size:13px;margin-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.metric{background:#ffffff0d;border-radius:12px;padding:9px}.metric b{display:block;font-size:18px}.metric span{font-size:11px;color:#aeb5c0}.actions{display:flex;gap:10px;margin:14px 0}.btn{appearance:none;border:0;border-radius:14px;min-height:48px;padding:0 18px;font-size:16px;font-weight:700;flex:1}.primary{background:#fff;color:#05070a}.secondary{background:#1b2028;color:#fff;border:1px solid #ffffff22}.note{font-size:12px;line-height:1.45;color:#929aa6;padding:0 4px 16px}.hidden{display:none}.ok{color:#70e59b}.warn{color:#ffd36b}.err{color:#ff7b7b}
</style>
</head>
<body><main class="app">
<div class="viewer" id="viewer">
<video id="video" playsinline muted></video><canvas id="overlay"></canvas>
<div class="top"><div class="pill">tag36h11 · 40 mm</div><div class="pill" id="fps">—</div></div>
<div class="hud"><div class="status" id="status">Prêt à démarrer</div><div class="sub" id="hint">Autorisez la caméra arrière de l’iPhone.</div>
<div class="grid hidden" id="metrics"><div class="metric"><span>ID</span><b id="tagId">—</b></div><div class="metric"><span>Distance*</span><b id="distance">—</b></div><div class="metric"><span>Qualité</span><b id="quality">—</b></div><div class="metric"><span>X*</span><b id="mx">—</b></div><div class="metric"><span>Y*</span><b id="my">—</b></div><div class="metric"><span>Z*</span><b id="mz">—</b></div></div></div></div>
<div class="actions"><button class="btn primary" id="start">Démarrer la caméra</button><button class="btn secondary hidden" id="stop">Arrêter</button></div>
<div class="note">* Pose métrique estimée avec des intrinsèques caméra approximatifs. Pour une mesure précise, une calibration par modèle d’iPhone est nécessaire. La vidéo reste dans le navigateur.</div>
<canvas id="work" class="hidden"></canvas>
</main>
<script src="https://arenaxr.github.io/apriltag-js-standalone/apriltag_wasm.js"></script>
<script>
const TAG_SIZE=.04, PROC_W=640;
const $=id=>document.getElementById(id), video=$('video'), overlay=$('overlay'), work=$('work');
let stream=null, detector=null, running=false, busy=false, last=0, frames=0, fpsT=performance.now();
class Detector{constructor(){this.ready=AprilTagWasm().then(M=>{this.M=M;this.init=M.cwrap('atagjs_init','number',[]);this.setOpt=M.cwrap('atagjs_set_detector_options','number',['number','number','number','number','number','number','number']);this.setPose=M.cwrap('atagjs_set_pose_info','number',['number','number','number','number']);this.setBuf=M.cwrap('atagjs_set_img_buffer','number',['number','number','number']);this.setSize=M.cwrap('atagjs_set_tag_size',null,['number','number']);this.detectC=M.cwrap('atagjs_detect','number',[]);this.init();this.setOpt(2,0,1,1,1,1,0)});}
cam(fx,fy,cx,cy){this.setPose(fx,fy,cx,cy)} size(id,s){this.setSize(id,s)} detect(gray,w,h){const p=this.setBuf(w,h,w);this.M.HEAPU8.set(gray,p);const q=this.detectC(), n=this.M.getValue(q,'i32');if(!n)return[];const sp=this.M.getValue(q+4,'i32'), v=new Uint8Array(this.M.HEAP8.buffer,sp,n);return JSON.parse(new TextDecoder().decode(v));}}
function setStatus(t,h,cls=''){ $('status').textContent=t;$('status').className='status '+cls;$('hint').textContent=h; }
async function start(){try{$('start').disabled=true;setStatus('Chargement…','Initialisation du détecteur AprilTag.');if(!detector){detector=new Detector();await detector.ready}stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});video.srcObject=stream;await video.play();running=true;$('start').classList.add('hidden');$('stop').classList.remove('hidden');setStatus('Recherche du tag…','Placez le tag de 40 mm bien éclairé dans le cadre.');requestAnimationFrame(loop)}catch(e){$('start').disabled=false;setStatus('Caméra indisponible',e.name==='NotAllowedError'?'Autorisez la caméra dans Safari puis réessayez.':e.message,'err')}}
function stop(){running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('start').disabled=false;$('start').classList.remove('hidden');$('stop').classList.add('hidden');$('metrics').classList.add('hidden');clearOverlay();setStatus('Caméra arrêtée','Touchez Démarrer pour reprendre.');}
function clearOverlay(){const c=overlay.getContext('2d');c.clearRect(0,0,overlay.width,overlay.height)}
function resize(){const r=video.getBoundingClientRect(),d=devicePixelRatio||1;overlay.width=Math.round(r.width*d);overlay.height=Math.round(r.height*d)}
function draw(det,sw,sh){resize();const c=overlay.getContext('2d'), W=overlay.width,H=overlay.height;c.clearRect(0,0,W,H);const vr=video.videoWidth/video.videoHeight,cr=W/H;let dw,dh,ox,oy;if(vr>cr){dh=H;dw=H*vr;ox=(W-dw)/2;oy=0}else{dw=W;dh=W/vr;ox=0;oy=(H-dh)/2}const sx=dw/sw,sy=dh/sh;c.lineWidth=4*(devicePixelRatio||1);c.strokeStyle='#70e59b';c.fillStyle='#70e59b';c.beginPath();det.corners.forEach((p,i)=>{const x=ox+p.x*sx,y=oy+p.y*sy;i?c.lineTo(x,y):c.moveTo(x,y)});c.closePath();c.stroke();const x=ox+det.center.x*sx,y=oy+det.center.y*sy;c.beginPath();c.arc(x,y,6*(devicePixelRatio||1),0,Math.PI*2);c.fill()}
function fmt(v){return Number.isFinite(v)?(v*100).toFixed(1)+' cm':'—'}
async function loop(t){if(!running)return;requestAnimationFrame(loop);if(busy||t-last<90||video.readyState<2)return;busy=true;last=t;try{const vw=video.videoWidth,vh=video.videoHeight,h=Math.round(PROC_W*vh/vw);work.width=PROC_W;work.height=h;const c=work.getContext('2d',{willReadFrequently:true});c.drawImage(video,0,0,PROC_W,h);const d=c.getImageData(0,0,PROC_W,h).data,g=new Uint8Array(PROC_W*h);for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]*77+d[i+1]*150+d[i+2]*29)>>8;
// Approximation initiale: champ horizontal ~65°. À remplacer par une calibration pour métrologie.
const fx=PROC_W/(2*Math.tan(65*Math.PI/360)),fy=fx,cx=PROC_W/2,cy=h/2;detector.cam(fx,fy,cx,cy);for(let id=0;id<100;id++)detector.size(id,TAG_SIZE);const ds=detector.detect(g,PROC_W,h);frames++;if(performance.now()-fpsT>1000){$('fps').textContent=frames+' det/s';frames=0;fpsT=performance.now()}
if(ds.length){const det=ds[0];draw(det,PROC_W,h);$('metrics').classList.remove('hidden');$('tagId').textContent=det.id;let p=det.pose&&det.pose.t;let dist=p?Math.hypot(...p):NaN;$('distance').textContent=fmt(dist);$('mx').textContent=p?fmt(p[0]):'—';$('my').textContent=p?fmt(p[1]):'—';$('mz').textContent=p?fmt(p[2]):'—';const side=det.corners.reduce((s,p,i,a)=>{const q=a[(i+1)%4];return s+Math.hypot(p.x-q.x,p.y-q.y)},0)/4;$('quality').textContent=side>90?'Bonne':side>55?'OK':'Faible';setStatus('Tag détecté','ID '+det.id+(side<55?' · Rapprochez-vous':' · Tracking actif'),'ok')}else{clearOverlay();$('metrics').classList.add('hidden');setStatus('Recherche du tag…','Cadrez le tag et évitez les reflets.')}}catch(e){console.error(e);setStatus('Erreur de détection','Rechargez la page si le problème persiste.','err')}finally{busy=false}}
$('start').addEventListener('click',start);$('stop').addEventListener('click',stop);window.addEventListener('pagehide',stop);
if(!window.isSecureContext)setStatus('HTTPS requis','Ouvrez cette page via HTTPS pour utiliser la caméra.','warn');
</script></body></html>
