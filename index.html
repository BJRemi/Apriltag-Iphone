<!doctype html>
<html lang="fr">

<head>
<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             viewport-fit=cover,
             user-scalable=no"
>

<meta name="theme-color" content="#05070a">

<title>AprilTag iPad V6.1</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #05070a;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        system-ui,
        sans-serif;
}

body {
    min-height: 100svh;
}

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;

    padding:
        env(safe-area-inset-top)
        14px
        env(safe-area-inset-bottom);
}

h1 {
    font-size: 22px;
    margin: 12px 0 4px;
}

.version {
    color: #8f98a5;
    font-size: 13px;
    margin-bottom: 12px;
}

.viewer {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;

    overflow: hidden;

    border-radius: 20px;
    background: #000;

    border: 1px solid #ffffff22;
}

video,
#overlay {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;
}

video {
    object-fit: contain;
    background: black;
}

#overlay {
    z-index: 1;
    pointer-events: none;
}

.message {
    position: absolute;

    z-index: 2;

    left: 12px;
    right: 12px;
    bottom: 12px;

    padding: 14px;

    background: #000c;

    border-radius: 14px;

    border: 1px solid #ffffff22;

    backdrop-filter: blur(12px);
}

.status {
    font-size: 17px;
    font-weight: 700;
}

.detail {
    margin-top: 5px;

    font-size: 13px;

    color: #b6bec8;

    overflow-wrap: anywhere;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 14px;
}

button {
    flex: 1;

    min-height: 52px;

    border: 0;
    border-radius: 14px;

    font-size: 16px;
    font-weight: 700;
}

.start {
    background: white;
    color: #05070a;
}

.stop {
    background: #20252d;
    color: white;
    border: 1px solid #ffffff22;
}

.hidden {
    display: none;
}

.info {
    margin-top: 14px;

    padding: 12px;

    border-radius: 14px;

    background: #11161d;

    font-size: 13px;
    line-height: 1.55;

    color: #b8c0cb;

    overflow-wrap: anywhere;
}

.ok {
    color: #70e59b;
}

.warning {
    color: #ffd36b;
}

.error {
    color: #ff7777;
}

</style>
</head>


<body>

<main class="app">

    <h1>AprilTag iPad</h1>

    <div class="version">
        V6.1 — tag36h11 — test détection
    </div>


    <div
        id="viewer"
        class="viewer"
    >

        <video
            id="camera"
            autoplay
            muted
            playsinline
        ></video>

        <canvas id="overlay"></canvas>


        <div class="message">

            <div
                id="status"
                class="status"
            >
                Prêt
            </div>

            <div
                id="detail"
                class="detail"
            >
                Touchez « Démarrer caméra ».
            </div>

        </div>

    </div>


    <div class="buttons">

        <button
            id="start"
            class="start"
        >
            Démarrer caméra
        </button>

        <button
            id="stop"
            class="stop hidden"
        >
            Arrêter
        </button>

    </div>


    <div
        id="diagnostic"
        class="info"
    >
        V6.1 prête.<br>
        Caméra + moteur AprilTag 36h11.
    </div>

</main>


<canvas
    id="analysis"
    style="display:none"
></canvas>


<script>

"use strict";


/* ============================================================
   ÉLÉMENTS
============================================================ */

const video =
document.getElementById("camera");

const viewer =
document.getElementById("viewer");

const overlay =
document.getElementById("overlay");

const overlayCtx =
overlay.getContext("2d");

const analysis =
document.getElementById("analysis");

const analysisCtx =
analysis.getContext(
    "2d",
    {
        willReadFrequently: true
    }
);

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const detail =
document.getElementById("detail");

const diagnostic =
document.getElementById("diagnostic");


/* ============================================================
   VARIABLES
============================================================ */

let stream = null;

let detector = null;

let animationId = null;

let grayBuffer = null;

let lastDetectionTime = 0;

let detectionRunning = false;


/* ============================================================
   MESSAGES
============================================================ */

function setMessage(
    title,
    text,
    type = ""
) {

    status.textContent =
        title;

    detail.textContent =
        text;

    status.className =
        "status " + type;
}


function errorText(error) {

    if (error === undefined) {
        return "Erreur JavaScript : valeur undefined";
    }

    if (error === null) {
        return "Erreur JavaScript : valeur null";
    }

    if (
        typeof error === "string"
    ) {
        return error;
    }

    if (
        error.message
    ) {
        return error.message;
    }

    try {

        return JSON.stringify(
            error
        );

    }
    catch (_) {

        return String(
            error
        );
    }
}


/* ============================================================
   CHARGEMENT APRILTAG WASM
============================================================ */

async function loadAprilTag() {

    if (detector) {

        return detector;
    }


    setMessage(
        "Chargement AprilTag…",
        "Initialisation du moteur tag36h11.",
        "warning"
    );


    diagnostic.innerHTML =
        "Téléchargement du moteur AprilTag…";


    return new Promise(
        function(resolve, reject) {

            const base =
                "https://arenaxr.github.io/apriltag-js-standalone/";


            window.AprilTagWasmModule = {

                locateFile:
                function(path) {

                    return base + path;
                }

            };


            const script =
                document.createElement(
                    "script"
                );


            script.src =
                base +
                "apriltag_wasm.js";


            script.onload =
            function() {

                try {

                    function getModulePromise() {

                        const wasm =
                            window.AprilTagWasm;


                        if (
                            typeof wasm ===
                            "function"
                        ) {

                            return wasm(
                                window.AprilTagWasmModule
                            );
                        }


                        if (
                            wasm &&
                            typeof wasm.then ===
                            "function"
                        ) {

                            return wasm;
                        }


                        return null;
                    }


                    function initialise(
                        Module
                    ) {

                        try {

                            if (!Module) {

                                throw new Error(
                                    "Module WebAssembly vide."
                                );
                            }


                            if (
                                typeof Module.cwrap !==
                                "function"
                            ) {

                                throw new Error(
                                    "Module.cwrap indisponible."
                                );
                            }


                            const init =
                                Module.cwrap(
                                    "atagjs_init",
                                    "number",
                                    []
                                );


                            const options =
                                Module.cwrap(
                                    "atagjs_set_detector_options",
                                    "number",
                                    [
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number",
                                        "number"
                                    ]
                                );


                            const setImage =
                                Module.cwrap(
                                    "atagjs_set_img_buffer",
                                    "number",
                                    [
                                        "number",
                                        "number",
                                        "number"
                                    ]
                                );


                            const detectWasm =
                                Module.cwrap(
                                    "atagjs_detect",
                                    "number",
                                    []
                                );


                            init();


                            /*
                                quad_decimate
                                quad_sigma
                                nthreads
                                refine_edges
                                max_detections
                                return_pose
                                return_solutions

                                Pour cette phase :
                                uniquement détection 2D.
                            */

                            options(
                                1.5,
                                0,
                                1,
                                1,
                                0,
                                0,
                                0
                            );


                            detector = {

                                async detect(
                                    gray,
                                    width,
                                    height
                                ) {

                                    const buffer =
                                        setImage(
                                            width,
                                            height,
                                            width
                                        );


                                    if (
                                        !Number.isFinite(buffer) ||
                                        buffer <= 0
                                    ) {

                                        throw new Error(
                                            "Impossible de créer le buffer image WASM."
                                        );
                                    }


                                    Module.HEAPU8.set(
                                        gray,
                                        buffer
                                    );


                                    const ptr =
                                        detectWasm();


                                    if (
                                        !Number.isFinite(ptr) ||
                                        ptr <= 0
                                    ) {

                                        return [];
                                    }


                                    const length =
                                        Module.getValue(
                                            ptr,
                                            "i32"
                                        );


                                    if (
                                        !Number.isFinite(length)
                                    ) {

                                        throw new Error(
                                            "Longueur de résultat AprilTag invalide."
                                        );
                                    }


                                    if (
                                        length <= 0
                                    ) {

                                        return [];
                                    }


                                    const stringPtr =
                                        Module.getValue(
                                            ptr + 4,
                                            "i32"
                                        );


                                    if (
                                        !Number.isFinite(stringPtr) ||
                                        stringPtr <= 0
                                    ) {

                                        throw new Error(
                                            "Adresse du résultat AprilTag invalide."
                                        );
                                    }


                                    const bytes =
                                        new Uint8Array(
                                            Module.HEAPU8.buffer,
                                            stringPtr,
                                            length
                                        );


                                    let json = "";


                                    /*
                                       TextDecoder est préférable
                                       mais on garde un secours
                                       compatible Safari.
                                    */

                                    if (
                                        typeof TextDecoder !==
                                        "undefined"
                                    ) {

                                        json =
                                            new TextDecoder(
                                                "utf-8"
                                            )
                                            .decode(
                                                bytes
                                            );

                                    }
                                    else {

                                        for (
                                            let i = 0;
                                            i < length;
                                            i++
                                        ) {

                                            json +=
                                                String.fromCharCode(
                                                    bytes[i]
                                                );
                                        }
                                    }


                                    if (!json) {

                                        return [];
                                    }


                                    const result =
                                        JSON.parse(
                                            json
                                        );


                                    if (
                                        !Array.isArray(result)
                                    ) {

                                        throw new Error(
                                            "Le détecteur n'a pas renvoyé un tableau."
                                        );
                                    }


                                    return result;
                                }

                            };


                            diagnostic.innerHTML =

                                "<span class='ok'>" +
                                "MOTEUR APRILTAG : PRÊT" +
                                "</span>" +

                                "<br>" +

                                "Famille : tag36h11" +

                                "<br>" +

                                "WebAssembly : chargé";


                            resolve(
                                detector
                            );
                        }

                        catch(error) {

                            reject(
                                error
                            );
                        }
                    }


                    const promise =
                        getModulePromise();


                    if (promise) {

                        Promise.resolve(
                            promise
                        )
                        .then(
                            initialise
                        )
                        .catch(
                            reject
                        );

                    }
                    else {

                        setTimeout(
                            function() {

                                const delayed =
                                    getModulePromise();


                                if (delayed) {

                                    Promise.resolve(
                                        delayed
                                    )
                                    .then(
                                        initialise
                                    )
                                    .catch(
                                        reject
                                    );

                                }
                                else {

                                    reject(
                                        new Error(
                                            "Module WASM AprilTag introuvable."
                                        )
                                    );
                                }

                            },
                            300
                        );
                    }

                }

                catch(error) {

                    reject(
                        error
                    );
                }
            };


            script.onerror =
            function() {

                reject(
                    new Error(
                        "Impossible de télécharger apriltag_wasm.js"
                    )
                );
            };


            document.head.appendChild(
                script
            );
        }
    );
}


/* ============================================================
   CAMÉRA
============================================================ */

async function startCamera() {

    startButton.disabled =
        true;


    try {

        if (
            !window.isSecureContext
        ) {

            throw new Error(
                "Cette page doit être ouverte en HTTPS."
            );
        }


        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "API caméra non disponible."
            );
        }


        await loadAprilTag();


        setMessage(
            "Ouverture caméra…",
            "Activation de la caméra arrière.",
            "warning"
        );


        stream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: false,

                video: {

                    facingMode: {
                        ideal: "environment"
                    },

                    width: {
                        ideal: 1280
                    },

                    height: {
                        ideal: 720
                    }

                }

            });


        video.srcObject =
            stream;


        await video.play();


        await waitForVideo();


        configureCanvas();


        startButton
        .classList
        .add(
            "hidden"
        );


        stopButton
        .classList
        .remove(
            "hidden"
        );


        setMessage(
            "Recherche AprilTag…",
            "Présentez un tag36h11 devant la caméra.",
            "warning"
        );


        animationId =
            requestAnimationFrame(
                scanFrame
            );

    }

    catch(error) {

        const message =
            errorText(
                error
            );


        console.error(
            error
        );


        setMessage(
            "Erreur",
            message,
            "error"
        );


        diagnostic.innerHTML =

            "<span class='error'>" +
            "ERREUR : " +
            escapeHtml(message) +
            "</span>";


        startButton.disabled =
            false;
    }
}


/* ============================================================
   ATTENTE VIDÉO
============================================================ */

function waitForVideo() {

    return new Promise(
        function(resolve) {

            if (
                video.videoWidth > 0 &&
                video.videoHeight > 0
            ) {

                resolve();

                return;
            }


            video.addEventListener(
                "loadedmetadata",
                resolve,
                {
                    once: true
                }
            );
        }
    );
}


/* ============================================================
   CANVAS
============================================================ */

function configureCanvas() {

    const width =
        video.videoWidth;

    const height =
        video.videoHeight;


    viewer.style.aspectRatio =
        width + "/" + height;


    /*
       On limite l'analyse pour préserver
       les performances de Safari/iPad.
    */

    const maximum =
        800;


    const factor =
        Math.min(
            1,
            maximum /
            Math.max(
                width,
                height
            )
        );


    analysis.width =
        Math.round(
            width * factor
        );


    analysis.height =
        Math.round(
            height * factor
        );


    overlay.width =
        analysis.width;

    overlay.height =
        analysis.height;


    grayBuffer =
        new Uint8Array(
            analysis.width *
            analysis.height
        );


    diagnostic.innerHTML =

        "<span class='ok'>" +
        "CAMÉRA + APRILTAG : PRÊTS" +
        "</span>" +

        "<br>" +

        "Famille : tag36h11" +

        "<br>" +

        "Caméra : " +
        width +
        " × " +
        height +

        "<br>" +

        "Analyse : " +
        analysis.width +
        " × " +
        analysis.height;
}


/* ============================================================
   CONVERSION NIVEAUX DE GRIS
============================================================ */

function imageToGray(
    imageData
) {

    const data =
        imageData.data;


    let destinationIndex =
        0;


    for (
        let sourceIndex = 0;
        sourceIndex < data.length;
        sourceIndex += 4
    ) {

        const r =
            data[
                sourceIndex
            ];

        const g =
            data[
                sourceIndex + 1
            ];

        const b =
            data[
                sourceIndex + 2
            ];


        /*
           Pondération luminance.
           Plus propre que moyenne R/G/B.
        */

        grayBuffer[
            destinationIndex
        ] =
            Math.round(
                0.299 * r +
                0.587 * g +
                0.114 * b
            );


        destinationIndex++;
    }
}


/* ============================================================
   DÉTECTION
============================================================ */

async function scanFrame(
    timestamp
) {

    animationId =
        requestAnimationFrame(
            scanFrame
        );


    if (
        !stream ||
        !detector ||
        video.readyState < 2
    ) {

        return;
    }


    /*
       Évite deux détections WASM simultanées.
    */

    if (
        detectionRunning
    ) {

        return;
    }


    /*
       ~8 analyses par seconde.
       Suffisant pour le test.
    */

    if (
        timestamp -
        lastDetectionTime <
        125
    ) {

        return;
    }


    lastDetectionTime =
        timestamp;


    detectionRunning =
        true;


    try {

        analysisCtx.drawImage(
            video,

            0,
            0,

            analysis.width,
            analysis.height
        );


        const imageData =
            analysisCtx.getImageData(
                0,
                0,
                analysis.width,
                analysis.height
            );


        imageToGray(
            imageData
        );


        /*
           IMPORTANT :
           on attend maintenant réellement
           la réponse du détecteur.
        */

        const markers =
            await detector.detect(

                grayBuffer,

                analysis.width,

                analysis.height

            );


        drawMarkers(
            markers
        );


        if (
            markers &&
            markers.length > 0
        ) {

            const ids =
                markers
                .map(
                    marker =>
                        marker.id
                )
                .join(", ");


            setMessage(
                "TAG DÉTECTÉ ✓",
                "ID : " + ids,
                "ok"
            );


            diagnostic.innerHTML =

                "<span class='ok'>" +
                "APRILTAG DÉTECTÉ" +
                "</span>" +

                "<br>" +

                "Famille : tag36h11" +

                "<br>" +

                "ID : " +
                ids +

                "<br>" +

                "Nombre : " +
                markers.length;

        }
        else {

            drawMarkers(
                []
            );


            setMessage(
                "Recherche AprilTag…",
                "Aucun tag36h11 détecté.",
                "warning"
            );
        }

    }

    catch(error) {

        const message =
            errorText(
                error
            );


        console.error(
            "Erreur détection :",
            error
        );


        setMessage(
            "Erreur détection",
            message,
            "error"
        );


        diagnostic.innerHTML =

            "<span class='error'>" +
            "ERREUR DÉTECTION" +
            "</span>" +

            "<br>" +

            escapeHtml(
                message
            );
    }

    finally {

        detectionRunning =
            false;
    }
}


/* ============================================================
   DESSIN TAGS
============================================================ */

function drawMarkers(
    markers
) {

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if (
        !markers ||
        markers.length === 0
    ) {

        return;
    }


    markers.forEach(
        function(marker) {

            const corners =
                marker.corners;


            if (
                !corners ||
                corners.length < 4
            ) {

                return;
            }


            /* CONTOUR */

            overlayCtx.beginPath();

            overlayCtx.moveTo(
                corners[0].x,
                corners[0].y
            );


            for (
                let i = 1;
                i < 4;
                i++
            ) {

                overlayCtx.lineTo(
                    corners[i].x,
                    corners[i].y
                );
            }


            overlayCtx.closePath();

            overlayCtx.lineWidth =
                5;

            overlayCtx.strokeStyle =
                "#39ff74";

            overlayCtx.stroke();


            /* COINS */

            corners.forEach(
                function(point) {

                    overlayCtx.beginPath();

                    overlayCtx.arc(
                        point.x,
                        point.y,
                        6,
                        0,
                        Math.PI * 2
                    );

                    overlayCtx.fillStyle =
                        "#00c8ff";

                    overlayCtx.fill();
                }
            );


            /* CENTRE */

            let centerX;
            let centerY;


            if (
                marker.center &&
                Number.isFinite(
                    marker.center.x
                ) &&
                Number.isFinite(
                    marker.center.y
                )
            ) {

                centerX =
                    marker.center.x;

                centerY =
                    marker.center.y;

            }
            else {

                centerX =
                    (
                        corners[0].x +
                        corners[1].x +
                        corners[2].x +
                        corners[3].x
                    ) / 4;


                centerY =
                    (
                        corners[0].y +
                        corners[1].y +
                        corners[2].y +
                        corners[3].y
                    ) / 4;
            }


            overlayCtx.beginPath();

            overlayCtx.arc(
                centerX,
                centerY,
                8,
                0,
                Math.PI * 2
            );

            overlayCtx.fillStyle =
                "#ff3b30";

            overlayCtx.fill();


            /* ID */

            const label =
                "ID " +
                marker.id;


            overlayCtx.font =
                "bold 24px -apple-system";


            const metrics =
                overlayCtx.measureText(
                    label
                );


            overlayCtx.fillStyle =
                "rgba(0,0,0,.78)";


            overlayCtx.fillRect(

                centerX -
                metrics.width / 2 -
                8,

                centerY - 44,

                metrics.width + 16,

                34
            );


            overlayCtx.fillStyle =
                "#39ff74";


            overlayCtx.textAlign =
                "center";


            overlayCtx.fillText(
                label,
                centerX,
                centerY - 18
            );
        }
    );
}


/* ============================================================
   ARRÊT
============================================================ */

function stopCamera() {

    if (
        animationId
    ) {

        cancelAnimationFrame(
            animationId
        );

        animationId =
            null;
    }


    if (
        stream
    ) {

        stream
        .getTracks()
        .forEach(
            function(track) {

                track.stop();
            }
        );
    }


    stream =
        null;

    video.srcObject =
        null;

    detectionRunning =
        false;


    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    startButton.disabled =
        false;


    startButton
    .classList
    .remove(
        "hidden"
    );


    stopButton
    .classList
    .add(
        "hidden"
    );


    setMessage(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );
}


/* ============================================================
   SÉCURITÉ HTML DIAGNOSTIC
============================================================ */

function escapeHtml(
    value
) {

    return String(
        value
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );
}


/* ============================================================
   BOUTONS
============================================================ */

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
