<!doctype html>



<html lang="fr">



<head>



<meta charset="utf-8">



<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">



<meta name="theme-color" content="#05070a">



<title>AprilTag iPad V7.0</title>







<style>



* { box-sizing: border-box; }







html, body {



    margin: 0;



    width: 100%;



    min-height: 100%;



    background: #05070a;



    color: white;



    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;



}







body { min-height: 100svh; }







.app {



    width: 100%;



    max-width: 900px;



    margin: auto;



    padding: env(safe-area-inset-top) 14px env(safe-area-inset-bottom);



}







h1 {



    font-size: 22px;



    margin: 12px 0 4px;



}







.version {



    color: #8f98a5;



    font-size: 13px;



    margin-bottom: 12px;



}







.viewer {



    position: relative;



    width: 100%;



    aspect-ratio: 4 / 3;



    overflow: hidden;



    border-radius: 20px;



    background: #000;



    border: 1px solid #ffffff22;



}







video, #overlay {



    position: absolute;



    inset: 0;



    width: 100%;



    height: 100%;



}







video {



    object-fit: contain;



    background: black;



}







#overlay {



    z-index: 1;



    pointer-events: none;



}







.message {



    position: absolute;



    z-index: 2;



    left: 12px;



    right: 12px;



    bottom: 12px;



    padding: 14px;



    background: #000c;



    border-radius: 14px;



    border: 1px solid #ffffff22;



    backdrop-filter: blur(12px);



}







.status {



    font-size: 17px;



    font-weight: 700;



}







.detail {



    margin-top: 5px;



    font-size: 13px;



    color: #b6bec8;



    overflow-wrap: anywhere;



}







.buttons {



    display: flex;



    gap: 10px;



    margin-top: 14px;



}







button {



    flex: 1;



    min-height: 52px;



    border: 0;



    border-radius: 14px;



    font-size: 16px;



    font-weight: 700;



}







.start {



    background: white;



    color: #05070a;



}







.stop {



    background: #20252d;



    color: white;



    border: 1px solid #ffffff22;



}







.hidden { display: none; }







.info {



    margin-top: 14px;



    padding: 12px;



    border-radius: 14px;



    background: #11161d;



    font-size: 13px;



    line-height: 1.55;



    color: #b8c0cb;



    overflow-wrap: anywhere;



}







.pose-grid {



    margin-top: 10px;



    display: grid;



    grid-template-columns: repeat(3, 1fr);



    gap: 8px;



}







.pose-box {



    padding: 10px;



    border-radius: 12px;



    background: #0b1016;



    border: 1px solid #ffffff14;



    text-align: center;



}







.pose-label {



    font-size: 11px;



    color: #8f98a5;



}







.pose-value {



    margin-top: 3px;



    font-size: 17px;



    font-weight: 750;



}







.ok { color: #70e59b; }



.warning { color: #ffd36b; }



.error { color: #ff7777; }



</style>



</head>







<body>



<main class="app">







    <h1>AprilTag iPad</h1>







    <div class="version">



        V7.0 — suivi AprilTag + STL intégré



    </div>







    <div id="viewer" class="viewer">







        <video



            id="camera"



            autoplay



            muted



            playsinline



        ></video>







        <canvas id="overlay"></canvas>







        <div class="message">



            <div id="status" class="status">Prêt</div>



            <div id="detail" class="detail">



                Touchez « Démarrer caméra ».



            </div>



        </div>



    </div>







    <div class="buttons">







        <button



            id="start"



            class="start"



        >



            Démarrer caméra



        </button>







        <button



            id="stop"



            class="stop hidden"



        >



            Arrêter



        </button>



    </div>







    <div id="diagnostic" class="info">



        V6.4 prête.<br>



        Détection + estimation de pose 3D AprilTag.



    </div>







    <div class="pose-grid">



        <div class="pose-box">



            <div class="pose-label">X cube</div>



            <div id="poseX" class="pose-value">—</div>



        </div>



        <div class="pose-box">



            <div class="pose-label">Y cube</div>



            <div id="poseY" class="pose-value">—</div>



        </div>



        <div class="pose-box">



            <div class="pose-label">Z / distance</div>



            <div id="poseZ" class="pose-value">—</div>



        </div>





        <div class="pose-box">

            <div class="pose-label">Roll</div>

            <div id="poseRoll" class="pose-value">—</div>

        </div>

        <div class="pose-box">

            <div class="pose-label">Pitch</div>

            <div id="posePitch" class="pose-value">—</div>

        </div>

        <div class="pose-box">

            <div class="pose-label">Yaw</div>

            <div id="poseYaw" class="pose-value">—</div>

        </div>

</div>







</main>

    id="analysis"



    style="display:none"



></canvas>

function errorText(error) {

}











function escapeHtml(value) {

        .replaceAll('"', "&quot;")



        .replaceAll("'", "&#039;");



}











/* ============================================================



   PETITS OUTILS 3D



============================================================ */







function vecAdd(a, b) {



    return [



        a[0] + b[0],



        a[1] + b[1],



        a[2] + b[2]



    ];



}











function vecSub(a, b) {



    return [



        a[0] - b[0],



        a[1] - b[1],



        a[2] - b[2]



    ];



}











function vecScale(v, s) {



    return [



        v[0] * s,



        v[1] * s,



        v[2] * s



    ];



}











function vecLength(v) {



    return Math.hypot(



        v[0],



        v[1],



        v[2]



    );



}













function vecDot(a, b) {

    return (

        a[0] * b[0] +

        a[1] * b[1] +

        a[2] * b[2]

    );

}



function vecCross(a, b) {

    return [

        a[1] * b[2] - a[2] * b[1],

        a[2] * b[0] - a[0] * b[2],

        a[0] * b[1] - a[1] * b[0]

    ];

}





function vecNormalize(v) {







    const length =



        vecLength(v);







    if (!Number.isFinite(length) || length < 1e-9) {



        return [0, 0, 1];



    }







    return vecScale(



        v,



        1 / length



    );



}











function lerpVec(a, b, alpha) {







    return [



        a[0] + (b[0] - a[0]) * alpha,



        a[1] + (b[1] - a[1]) * alpha,



        a[2] + (b[2] - a[2]) * alpha



    ];



}











function median(values) {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}
function robustCenter(points) {
    return [
        median(points.map(p => p[0])),
        median(points.map(p => p[1])),
        median(points.map(p => p[2]))
    ];
}

function project3D(point) {







    if (



        !cameraModel ||



        !point ||



        !Number.isFinite(point[2]) ||



        point[2] <= 0.0001



    ) {



        return null;



    }







    return {



        x:



            cameraModel.fx *



            point[0] /



            point[2] +



            cameraModel.cx,







        y:



            cameraModel.fy *



            point[1] /



            point[2] +



            cameraModel.cy



    };



}











/*



  Le JSON du moteur WASM indique R en "column major".



  R[0], R[1], R[2] sont donc traités ici



  comme les axes locaux X, Y, Z du tag exprimés



  dans le repère caméra.



*/



function poseAxes(marker) {







    if (



        !marker ||



        !marker.pose ||



        !Array.isArray(marker.pose.R) ||



        marker.pose.R.length < 3



    ) {



        return null;



    }







    return {



        x: vecNormalize(marker.pose.R[0]),



        y: vecNormalize(marker.pose.R[1]),



        z: vecNormalize(marker.pose.R[2])



    };



}

/* ============================================================



   CALCUL CENTRE CUBE MULTI-TAGS







   Pour chaque face détectée :



   centre_cube ≈ centre_tag +/− normale_tag × demi-arête.







   On choisit le signe qui place le centre du cube



   légèrement PLUS LOIN de la caméra que la face visible.



============================================================ */







function estimateCubeCenter(markers) {
    const candidates = [];

    for (const marker of markers) {
        if (!TRACKED_CUBE_IDS.has(Number(marker.id))) continue;
        if (!marker.pose || !Array.isArray(marker.pose.t) || marker.pose.t.length < 3) continue;

        const t = [
            Number(marker.pose.t[0]),
            Number(marker.pose.t[1]),
            Number(marker.pose.t[2])
        ];
        if (!t.every(Number.isFinite)) continue;

        const axes = poseAxes(marker);
        if (!axes) continue;

        const half = CUBE_EDGE_M / 2;
        const candidateA = vecAdd(t, vecScale(axes.z, half));
        const candidateB = vecSub(t, vecScale(axes.z, half));
        const cubePoint = candidateA[2] >= candidateB[2] ? candidateA : candidateB;

        const error = Number.isFinite(Number(marker.pose.e))
            ? Math.max(Number(marker.pose.e), 1e-7)
            : 1e-4;

        candidates.push({
            marker,
            point: cubePoint,
            weight: Math.min(25000, 1 / error)
        });
    }

    if (!candidates.length) {
        fusionStats = { accepted: 0, rejected: 0 };
        return null;
    }

    const consensus = robustCenter(candidates.map(c => c.point));
    let accepted = [...candidates];

    if (candidates.length >= 3) {
        accepted = candidates.filter(c =>
            vecLength(vecSub(c.point, consensus)) <= CENTER_OUTLIER_THRESHOLD_M
        );
        if (!accepted.length) accepted = [...candidates];
    }

    let sum = [0, 0, 0];
    let sumWeight = 0;

    for (const c of accepted) {
        sum = vecAdd(sum, vecScale(c.point, c.weight));
        sumWeight += c.weight;
    }

    if (!Number.isFinite(sumWeight) || sumWeight <= 0) return null;

    fusionStats = {
        accepted: accepted.length,
        rejected: candidates.length - accepted.length
    };

    return {
        center: vecScale(sum, 1 / sumWeight),
        candidates,
        accepted,
        consensus
    };
}

/* ============================================================

   REPÈRE 3D UNIQUE DU CUBE



   Convention V7.0 :

   ID 2 = face +X (droite)

   ID 4 = face +Y (avant)

   ID 7 = face +Z (dessus)



   Pour chaque face visible, la normale est calculée du centre

   géométrique du cube vers le centre du tag.

============================================================ */



function estimateCubeFrame(markers, cubeCenter) {



    if (!cubeCenter || !markers || markers.length === 0) {

        return null;

    }



    const byId = new Map(

        markers.map(marker => [Number(marker.id), marker])

    );



    function outwardNormalForTag(id) {



        const marker = byId.get(Number(id));



        if (

            !marker ||

            !marker.pose ||

            !Array.isArray(marker.pose.t) ||

            marker.pose.t.length < 3

        ) {

            return null;

        }



        const faceCenter = [

            Number(marker.pose.t[0]),

            Number(marker.pose.t[1]),

            Number(marker.pose.t[2])

        ];



        if (!faceCenter.every(Number.isFinite)) {

            return null;

        }



        const v = vecSub(faceCenter, cubeCenter);



        if (vecLength(v) < 1e-6) {

            return null;

        }



        return vecNormalize(v);

    }



    let x = outwardNormalForTag(CUBE_FACE_IDS.xPlus);

    let y = outwardNormalForTag(CUBE_FACE_IDS.yPlus);

    let zMeasured = outwardNormalForTag(CUBE_FACE_IDS.zPlus);

    let z = zMeasured;



    if (x && y) {



        x = vecNormalize(x);



        y = vecSub(

            y,

            vecScale(x, vecDot(y, x))

        );



        y = vecNormalize(y);

        z = vecNormalize(vecCross(x, y));



        if (zMeasured && vecDot(z, zMeasured) < 0) {

            z = vecScale(z, -1);

            y = vecScale(y, -1);

        }

    }

    else if (x && z) {



        x = vecNormalize(x);



        z = vecSub(

            z,

            vecScale(x, vecDot(z, x))

        );



        z = vecNormalize(z);

        y = vecNormalize(vecCross(z, x));

    }

    else if (y && z) {



        y = vecNormalize(y);



        z = vecSub(

            z,

            vecScale(y, vecDot(z, y))

        );



        z = vecNormalize(z);

        x = vecNormalize(vecCross(y, z));

    }

    else {

        return null;

    }



    return {

        origin: cubeCenter,

        x,

        y,

        z

    };

}





function updateSmoothedFrame(rawFrame) {
    if (!rawFrame) return smoothedCubeFrame;

    if (!smoothedCubeFrame) {
        smoothedCubeFrame = {
            origin: [...rawFrame.origin],
            x: [...rawFrame.x],
            y: [...rawFrame.y],
            z: [...rawFrame.z]
        };
        return smoothedCubeFrame;
    }

    let x = [...rawFrame.x];
    let y = [...rawFrame.y];
    let z = [...rawFrame.z];

    if (vecDot(x, smoothedCubeFrame.x) < 0) x = vecScale(x, -1);
    if (vecDot(y, smoothedCubeFrame.y) < 0) y = vecScale(y, -1);
    if (vecDot(z, smoothedCubeFrame.z) < 0) z = vecScale(z, -1);

    x = vecNormalize(lerpVec(smoothedCubeFrame.x, x, FRAME_SMOOTHING_ALPHA));
    y = lerpVec(smoothedCubeFrame.y, y, FRAME_SMOOTHING_ALPHA);
    y = vecNormalize(vecSub(y, vecScale(x, vecDot(y, x))));
    z = vecNormalize(vecCross(x, y));

    if (vecDot(z, smoothedCubeFrame.z) < 0) {
        z = vecScale(z, -1);
        y = vecScale(y, -1);
    }

    smoothedCubeFrame = { origin: [...rawFrame.origin], x, y, z };
    return smoothedCubeFrame;
}

function cubeEulerDegrees(frame) {



    if (!frame) {

        return null;

    }



    const r00 = frame.x[0];

    const r10 = frame.x[1];

    const r20 = frame.x[2];



    const r21 = frame.y[2];

    const r22 = frame.z[2];



    const r01 = frame.y[0];

    const r11 = frame.y[1];



    const pitch = Math.atan2(

        -r20,

        Math.hypot(r00, r10)

    );



    let roll;

    let yaw;



    if (Math.abs(Math.cos(pitch)) > 1e-6) {

        roll = Math.atan2(r21, r22);

        yaw = Math.atan2(r10, r00);

    }

    else {

        roll = 0;

        yaw = Math.atan2(-r01, r11);

    }



    const toDeg = 180 / Math.PI;



    return {

        roll: roll * toDeg,

        pitch: pitch * toDeg,

        yaw: yaw * toDeg

    };

}





function drawCubeAxes(frame) {



    if (!frame) {

        return;

    }



    const origin2D = project3D(frame.origin);



    if (!origin2D) {

        return;

    }



    const axisLength = 0.040;



    const axes = [

        { name: "X", vector: frame.x, color: "#ff453a" },

        { name: "Y", vector: frame.y, color: "#32d74b" },

        { name: "Z", vector: frame.z, color: "#0a84ff" }

    ];



    for (const axis of axes) {



        const p3 = vecAdd(

            frame.origin,

            vecScale(axis.vector, axisLength)

        );



        const p2 = project3D(p3);



        if (!p2) {

            continue;

        }



        overlayCtx.beginPath();

        overlayCtx.moveTo(origin2D.x, origin2D.y);

        overlayCtx.lineTo(p2.x, p2.y);

        overlayCtx.lineWidth = 6;

        overlayCtx.strokeStyle = axis.color;

        overlayCtx.stroke();

        overlayCtx.fillStyle = axis.color;

        overlayCtx.textAlign = "center";

        overlayCtx.fillText(

            axis.name,

            p2.x,

            p2.y - 6

        );

    }



    overlayCtx.beginPath();

    overlayCtx.arc(

        origin2D.x,

        origin2D.y,

        8,

        0,

        Math.PI * 2

    );

    overlayCtx.fillStyle = "#ffffff";

    overlayCtx.fill();

}

/* ============================================================
   STL INTÉGRÉ + PROJECTION 3D
============================================================ */

function decodeEmbeddedSTL() {
    if (stlTriangles) return stlTriangles;

    const binary = atob(EMBEDDED_STL_BASE64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
    }

    const view = new DataView(bytes.buffer);
    if (view.byteLength < 84) {
        throw new Error("STL intégré invalide.");
    }

    const triangleCount = view.getUint32(80, true);
    const expected = 84 + triangleCount * 50;
    if (expected > view.byteLength) {
        throw new Error("STL intégré tronqué.");
    }

    const triangles = [];
    let offset = 84;

    for (let i = 0; i < triangleCount; i++, offset += 50) {
        // normal at offset + 0..11 ignored; vertices start at +12
        const tri = [];
        for (let v = 0; v < 3; v++) {
            const p = offset + 12 + v * 12;
            tri.push([
                view.getFloat32(p, true) * STL_SCALE_TO_M,
                view.getFloat32(p + 4, true) * STL_SCALE_TO_M,
                view.getFloat32(p + 8, true) * STL_SCALE_TO_M
            ]);
        }
        triangles.push(tri);
    }

    stlTriangles = triangles;
    return triangles;
}

function cubeLocalToCamera(localPoint, frame) {
    let p = [...frame.origin];
    p = vecAdd(p, vecScale(frame.x, STL_OFFSET_M[0] + localPoint[0]));
    p = vecAdd(p, vecScale(frame.y, STL_OFFSET_M[1] + localPoint[1]));
    p = vecAdd(p, vecScale(frame.z, STL_OFFSET_M[2] + localPoint[2]));
    return p;
}

function stlOriginCamera(frame) {
    let p = [...frame.origin];
    p = vecAdd(p, vecScale(frame.x, STL_OFFSET_M[0]));
    p = vecAdd(p, vecScale(frame.y, STL_OFFSET_M[1]));
    p = vecAdd(p, vecScale(frame.z, STL_OFFSET_M[2]));
    return p;
}

function drawTrackedSTL(frame) {
    if (!frame) return;

    let triangles;
    try {
        triangles = decodeEmbeddedSTL();
    } catch (error) {
        console.error(error);
        return;
    }

    const drawList = [];

    for (const tri of triangles) {
        const c0 = cubeLocalToCamera(tri[0], frame);
        const c1 = cubeLocalToCamera(tri[1], frame);
        const c2 = cubeLocalToCamera(tri[2], frame);

        if (c0[2] <= 0.001 || c1[2] <= 0.001 || c2[2] <= 0.001) continue;

        const p0 = project3D(c0);
        const p1 = project3D(c1);
        const p2 = project3D(c2);
        if (!p0 || !p1 || !p2) continue;

        const depth = (c0[2] + c1[2] + c2[2]) / 3;
        drawList.push({ p0, p1, p2, depth });
    }

    // peintre : faces lointaines d'abord
    drawList.sort((a, b) => b.depth - a.depth);

    overlayCtx.save();
    overlayCtx.lineJoin = "round";
    overlayCtx.lineCap = "round";

    for (const item of drawList) {
        overlayCtx.beginPath();
        overlayCtx.moveTo(item.p0.x, item.p0.y);
        overlayCtx.lineTo(item.p1.x, item.p1.y);
        overlayCtx.lineTo(item.p2.x, item.p2.y);
        overlayCtx.closePath();
        overlayCtx.fillStyle = `rgba(88, 215, 255, ${STL_FILL_ALPHA})`;
        overlayCtx.strokeStyle = `rgba(88, 215, 255, ${STL_STROKE_ALPHA})`;
        overlayCtx.lineWidth = 0.8;
        overlayCtx.fill();
        overlayCtx.stroke();
    }

    const origin3D = stlOriginCamera(frame);
    const origin2D = project3D(origin3D);
    const cube2D = project3D(frame.origin);

    if (origin2D && cube2D) {
        overlayCtx.beginPath();
        overlayCtx.moveTo(cube2D.x, cube2D.y);
        overlayCtx.lineTo(origin2D.x, origin2D.y);
        overlayCtx.strokeStyle = "rgba(255, 214, 10, .9)";
        overlayCtx.lineWidth = 3;
        overlayCtx.setLineDash([8, 6]);
        overlayCtx.stroke();
        overlayCtx.setLineDash([]);

        drawCross(origin2D.x, origin2D.y, 11, "#58d7ff", 4);
        overlayCtx.font = "bold 15px -apple-system";
        overlayCtx.textAlign = "center";
        overlayCtx.fillStyle = "rgba(0,0,0,.82)";
        overlayCtx.fillRect(origin2D.x - 72, origin2D.y + 15, 144, 24);
        overlayCtx.fillStyle = "#58d7ff";
        overlayCtx.fillText("ORIGINE STL -50 mm", origin2D.x, origin2D.y + 33);
    }

    overlayCtx.restore();
}

async function scanFrame(



    timestamp



) {







    animationId =



        requestAnimationFrame(



            scanFrame



        );







    if (



        !stream ||



        !detector ||



        video.readyState < 2



    ) {



        return;



    }







    if (detectionRunning) {



        return;



    }







    /*



      Environ 8 analyses / seconde.



    */



    if (



        timestamp -



        lastDetectionTime <



        125



    ) {



        return;



    }







    lastDetectionTime =



        timestamp;







    detectionRunning =



        true;







    try {







        analysisCtx.drawImage(



            video,



            0,



            0,



            analysis.width,



            analysis.height



        );







        const imageData =



            analysisCtx.getImageData(



                0,



                0,



                analysis.width,



                analysis.height



            );







        imageToGray(



            imageData



        );







        const markers =



            await detector.detect(



                grayBuffer,



                analysis.width,



                analysis.height



            );







        const cubeEstimate = estimateCubeCenter(markers);

        let cubeCenter = null;
        let cubeFrame = null;
        let poseHeld = false;

        if (cubeEstimate) {
            cubeCenter = updateSmoothedCenter(cubeEstimate.center);
            const rawFrame = estimateCubeFrame(markers, cubeCenter);
            cubeFrame = updateSmoothedFrame(rawFrame);

            if (cubeFrame) {
                cubeFrame.origin = [...cubeCenter];
                lastGoodCubeCenter = [...cubeCenter];
                lastGoodCubeFrame = {
                    origin: [...cubeCenter],
                    x: [...cubeFrame.x],
                    y: [...cubeFrame.y],
                    z: [...cubeFrame.z]
                };
                lastGoodPoseTime = performance.now();
            }
        }

        if (
            (!cubeCenter || !cubeFrame) &&
            lastGoodCubeCenter &&
            lastGoodCubeFrame &&
            performance.now() - lastGoodPoseTime <= POSE_HOLD_MS
        ) {
            cubeCenter = [...lastGoodCubeCenter];
            cubeFrame = {
                origin: [...lastGoodCubeCenter],
                x: [...lastGoodCubeFrame.x],
                y: [...lastGoodCubeFrame.y],
                z: [...lastGoodCubeFrame.z]
            };
            poseHeld = true;
        }

        drawScene(markers, cubeEstimate, cubeCenter, cubeFrame);







        if (



            markers &&



            markers.length > 0



        ) {







            const ids =



                markers



                    .map(



                        marker =>



                            marker.id



                    )



                    .join(", ");







            const poseCount =



                markers.filter(



                    marker =>



                        marker.pose &&



                        marker.pose.t



                ).length;







            setMessage(



                "POSE 3D ACTIVE ✓",



                "ID : " +



                ids +



                " • poses : " +



                poseCount +



                "/" +



                markers.length,



                "ok"



            );







            if (cubeCenter) {







                const xMm =



                    cubeCenter[0] * 1000;







                const yMm =



                    cubeCenter[1] * 1000;







                const zMm =



                    cubeCenter[2] * 1000;







                poseX.textContent =



                    xMm.toFixed(1) +



                    " mm";







                poseY.textContent =



                    yMm.toFixed(1) +



                    " mm";







                poseZ.textContent =



                    zMm.toFixed(1) +



                    " mm";









                const euler =

                    cubeEulerDegrees(

                        cubeFrame

                    );



                if (euler) {

                    poseRoll.textContent =

                        euler.roll.toFixed(1) + "°";



                    posePitch.textContent =

                        euler.pitch.toFixed(1) + "°";



                    poseYaw.textContent =

                        euler.yaw.toFixed(1) + "°";

                }

                else {

                    poseRoll.textContent = "—";

                    posePitch.textContent = "—";

                    poseYaw.textContent = "—";

                }



diagnostic.innerHTML =



                    "<span class='ok'>" +



                    "CENTRE + REPÈRE CUBE + STL ACTIFS" +



                    "</span>" +



                    "<br>" +



                    "Tags visibles : " +



                    markers.length +



                    " • ID : " +



                    ids +



                    "<br>" +



                    "X : " +



                    xMm.toFixed(1) +



                    " mm" +



                    " • Y : " +



                    yMm.toFixed(1) +



                    " mm" +



                    " • Z : " +



                    zMm.toFixed(1) +



                    " mm" +



                    "<br>" +



                    "Variation : " +



                    (



                        stabilityMm !== null



                            ? stabilityMm.toFixed(2)



                            : "—"



                    ) +



                    " mm/frame" +



                    " • " +



                    stabilityLabel() +



                    "<br>" +



                    "<span class='warning'>" +



                    "Calibration métrique encore provisoire (HFOV " +



                    CAMERA_HFOV_DEG +



                    "°)." +



                    "</span>";



            }



        }



        else {
            if (poseHeld && cubeCenter && cubeFrame) {
                const xMm = cubeCenter[0] * 1000;
                const yMm = cubeCenter[1] * 1000;
                const zMm = cubeCenter[2] * 1000;
                const euler = cubeEulerDegrees(cubeFrame);

                poseX.textContent = xMm.toFixed(1) + " mm";
                poseY.textContent = yMm.toFixed(1) + " mm";
                poseZ.textContent = zMm.toFixed(1) + " mm";

                if (euler) {
                    poseRoll.textContent = euler.roll.toFixed(1) + "°";
                    posePitch.textContent = euler.pitch.toFixed(1) + "°";
                    poseYaw.textContent = euler.yaw.toFixed(1) + "°";
                }

                setMessage(
                    "POSE MAINTENUE",
                    "Tag perdu brièvement — dernière pose conservée.",
                    "warning"
                );
            }
            else {
                drawScene([], null, null, null);
                poseX.textContent = "—";
                poseY.textContent = "—";
                poseZ.textContent = "—";
                poseRoll.textContent = "—";
                posePitch.textContent = "—";
                poseYaw.textContent = "—";

                setMessage(
                    "Recherche AprilTag…",
                    "Aucun tag36h11 détecté.",
                    "warning"
                );
            }
        }



    }







    catch(error) {







        const message =



            errorText(error);







        console.error(



            "Erreur détection :",



            error



        );







        setMessage(



            "Erreur détection",



            message,



            "error"



        );







        diagnostic.innerHTML =



            "<span class='error'>" +



            "ERREUR DÉTECTION" +



            "</span>" +



            "<br>" +



            escapeHtml(



                message



            );



    }







    finally {







        detectionRunning =



            false;



    }



}











/* ============================================================

============================================================ */







function drawScene(

    markers,

    cubeEstimate,

    cubeCenter,

    cubeFrame = null

) {







    overlayCtx.clearRect(



        0,



        0,



        overlay.width,



        overlay.height



    );







    if (markers && markers.length > 0) {

        markers.forEach(

            function(marker) {

                drawMarker(marker);
                drawTagAxes(marker);

            }

        );

    }



    if (



        cubeEstimate &&



        cubeEstimate.candidates



    ) {







        for (



            const candidate



            of cubeEstimate.candidates



        ) {







            const p =



                project3D(



                    candidate.point



                );







            if (p) {







                overlayCtx.beginPath();







                overlayCtx.arc(



                    p.x,



                    p.y,



                    5,



                    0,



                    Math.PI * 2



                );







                overlayCtx.fillStyle =



                    "#ffd60a";







                overlayCtx.fill();



            }



        }



    }







    if (cubeCenter) {







        const center2D =



            project3D(



                cubeCenter



            );







        if (center2D) {







            drawCross(



                center2D.x,



                center2D.y,



                14,



                "#ff2d55",



                5



            );







            overlayCtx.font =



                "bold 18px -apple-system";







            overlayCtx.textAlign =



                "center";







            overlayCtx.fillStyle =



                "rgba(0,0,0,.82)";







            overlayCtx.fillRect(



                center2D.x - 66,



                center2D.y + 17,



                132,



                28



            );







            overlayCtx.fillStyle =



                "#ff5b79";







            overlayCtx.fillText(



                "CENTRE CUBE",



                center2D.x,



                center2D.y + 38



            );



        }



    }





    if (cubeFrame) {

        drawTrackedSTL(cubeFrame);
        drawCubeAxes(cubeFrame);

    }



}











function drawMarker(



    marker



) {







    const corners =



        marker.corners;







    if (



        !corners ||



        corners.length < 4



    ) {



        return;



    }







    /* CONTOUR */



    overlayCtx.beginPath();







    overlayCtx.moveTo(



        corners[0].x,



        corners[0].y



    );







    for (



        let i = 1;



        i < 4;



        i++



    ) {



        overlayCtx.lineTo(



            corners[i].x,



            corners[i].y



        );



    }







    overlayCtx.closePath();







    overlayCtx.lineWidth =



        5;







    overlayCtx.strokeStyle =



        "#39ff74";







    overlayCtx.stroke();







    /* COINS NUMÉROTÉS */



    corners.forEach(



        function(point, index) {







            overlayCtx.beginPath();







            overlayCtx.arc(



                point.x,



                point.y,



                6,



                0,



                Math.PI * 2



            );







            overlayCtx.fillStyle =



                "#00c8ff";







            overlayCtx.fill();







            overlayCtx.font =



                "bold 13px -apple-system";







            overlayCtx.textAlign =



                "center";







            overlayCtx.fillStyle =



                "white";







            overlayCtx.fillText(



                String(index),



                point.x,



                point.y - 10



            );



        }



    );







    /* CENTRE */



    let centerX;



    let centerY;







    if (



        marker.center &&



        Number.isFinite(



            marker.center.x



        ) &&



        Number.isFinite(



            marker.center.y



        )



    ) {



        centerX =



            marker.center.x;







        centerY =



            marker.center.y;



    }



    else {







        centerX =



            (



                corners[0].x +



                corners[1].x +



                corners[2].x +



                corners[3].x



            ) / 4;







        centerY =



            (



                corners[0].y +



                corners[1].y +



                corners[2].y +



                corners[3].y



            ) / 4;



    }







    overlayCtx.beginPath();







    overlayCtx.arc(



        centerX,



        centerY,



        8,



        0,



        Math.PI * 2



    );







    overlayCtx.fillStyle =



        "#ff3b30";







    overlayCtx.fill();







    /* ID */



    const label =



        "ID " +



        marker.id;







    overlayCtx.font =



        "bold 24px -apple-system";







    const metrics =



        overlayCtx.measureText(



            label



        );







    overlayCtx.fillStyle =



        "rgba(0,0,0,.78)";







    overlayCtx.fillRect(



        centerX -



        metrics.width / 2 -



        8,



        centerY - 44,



        metrics.width + 16,



        34



    );







    overlayCtx.fillStyle =



        "#39ff74";







    overlayCtx.textAlign =



        "center";







    overlayCtx.fillText(



        label,



        centerX,



        centerY - 18



    );



}











function drawTagAxes(



    marker



) {







    if (



        !marker.pose ||



        !Array.isArray(marker.pose.t)



    ) {



        return;



    }







    const axes =



        poseAxes(marker);







    if (!axes) {



        return;



    }







    const origin3D = [



        Number(marker.pose.t[0]),



        Number(marker.pose.t[1]),



        Number(marker.pose.t[2])



    ];







    if (



        !origin3D.every(



            Number.isFinite



        )



    ) {



        return;



    }







    /*



      Axe physique de 20 mm.



    */



    const axisLength =



        0.020;







    const origin2D =



        project3D(



            origin3D



        );







    if (!origin2D) {



        return;



    }







    const endpoints = [



        {



            axis: "X",



            color: "#ff453a",



            point:



                vecAdd(



                    origin3D,



                    vecScale(



                        axes.x,



                        axisLength



                    )



                )



        },



        {



            axis: "Y",



            color: "#32d74b",



            point:



                vecAdd(



                    origin3D,



                    vecScale(



                        axes.y,



                        axisLength



                    )



                )



        },



        {



            axis: "Z",



            color: "#0a84ff",



            point:



                vecAdd(



                    origin3D,



                    vecScale(



                        axes.z,



                        axisLength



                    )



                )



        }



    ];







    for (



        const item



        of endpoints



    ) {







        const p =



            project3D(



                item.point



            );







        if (!p) {



            continue;



        }







        overlayCtx.beginPath();







        overlayCtx.moveTo(



            origin2D.x,



            origin2D.y



        );







        overlayCtx.lineTo(



            p.x,



            p.y



        );







        overlayCtx.lineWidth =



            4;







        overlayCtx.strokeStyle =



            item.color;







        overlayCtx.stroke();







        overlayCtx.font =



            "bold 16px -apple-system";







        overlayCtx.fillStyle =



            item.color;







        overlayCtx.textAlign =



            "center";







        overlayCtx.fillText(



            item.axis,



            p.x,



            p.y - 4



        );



    }



}











function drawCross(



    x,



    y,



    size,



    color,



    width



) {







    overlayCtx.beginPath();







    overlayCtx.moveTo(



        x - size,



        y



    );







    overlayCtx.lineTo(



        x + size,



        y



    );







    overlayCtx.moveTo(



        x,



        y - size



    );







    overlayCtx.lineTo(



        x,



        y + size



    );







    overlayCtx.lineWidth =



        width;







    overlayCtx.strokeStyle =



        color;







    overlayCtx.stroke();



}

function stopCamera() {







    if (animationId) {







        cancelAnimationFrame(



            animationId



        );







        animationId =



            null;



    }







    if (stream) {







        stream



            .getTracks()



            .forEach(



                function(track) {



                    track.stop();



                }



            );



    }







    stream =



        null;







    video.srcObject =



        null;







    detectionRunning =



        false;







    smoothedCubeCenter =



        null;







    previousCubeCenter =



        null;







    stabilityMm =



        null;







    overlayCtx.clearRect(



        0,



        0,



        overlay.width,



        overlay.height



    );







    poseX.textContent = "—";



    poseY.textContent = "—";



    poseZ.textContent = "—";



            poseRoll.textContent = "—";

            posePitch.textContent = "—";

            poseYaw.textContent = "—";







    startButton.disabled =



        false;







    startButton



        .classList



        .remove(



            "hidden"



        );







    stopButton



        .classList



        .add(



            "hidden"



        );







    setMessage(



        "Caméra arrêtée",



        "Touchez Démarrer caméra pour reprendre."



    );



}
