<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0a0c">
<title>AprilTag iPad V9.0</title>

<style>
* { box-sizing: border-box; }

:root {
    --bg: #0a0a0c;
    --panel: #151518;
    --line: rgba(255, 255, 255, .09);
    --text: #f4f4f5;
    --muted: #8b8b93;
    --a: #7dd3fc;
    --b: #fdba74;
    --good: #86efac;
    --warn: #fcd34d;
    --bad: #fca5a5;
}

html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
}

body { min-height: 100svh; }

.app {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px);
}

header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin: 14px 2px 12px;
}

h1 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
.version { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.viewer {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    border-radius: 22px;
    background: #000;
    border: 1px solid var(--line);
}

video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; }
video { object-fit: contain; background: #000; }
#overlay { z-index: 1; pointer-events: none; }

/* Bandeau d'état posé sur la vidéo */
.hud {
    position: absolute;
    z-index: 2;
    top: 12px;
    left: 12px;
    right: 12px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    pointer-events: none;
}

.status, .detail {
    max-width: 100%;
    background: rgba(10, 10, 12, .58);
    border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px) saturate(1.4);
    backdrop-filter: blur(16px) saturate(1.4);
    overflow-wrap: anywhere;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 13px 7px 11px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
}

.status::before {
    content: "";
    flex: none;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
}

.status.ok, .status.warning, .status.error { color: var(--text); }

.status.ok::before { background: var(--good); box-shadow: 0 0 10px var(--good); }
.status.warning::before { background: var(--warn); }
.status.error::before { background: var(--bad); }

.detail {
    padding: 6px 11px;
    border-radius: 12px;
    font-size: 12px;
    color: rgba(255, 255, 255, .78);
}

.detail:empty { display: none; }

.buttons { display: flex; gap: 10px; margin-top: 10px; }

button {
    flex: 1;
    min-height: 50px;
    border: 1px solid var(--line);
    border-radius: 15px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    transition: opacity .15s, transform .1s;
}

button:active { transform: scale(.98); }
button:disabled { opacity: .32; }

.start { background: var(--text); color: var(--bg); border-color: transparent; }
.record.locked { background: var(--good); color: var(--bg); border-color: transparent; }

.auto.on { color: var(--good); }
.export.main { flex: 2; }
.export.main:not(:disabled) { background: var(--text); color: var(--bg); border-color: transparent; }

.grid-caption { margin: 14px 4px 0; font-size: 12px; color: var(--muted); }

.hidden { display: none; }

.pose-grid {
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    border-radius: 16px;
    overflow: hidden;
    background: var(--line);
    border: 1px solid var(--line);
}

.pose-box { padding: 11px 8px; background: var(--panel); text-align: center; }
.pose-label { font-size: 11px; color: var(--muted); }
.pose-value {
    margin-top: 3px;
    font-size: 16px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.info {
    margin-top: 12px;
    padding: 13px 14px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 12.5px;
    line-height: 1.6;
    color: #b4b4bd;
    overflow-wrap: anywhere;
}

.ok { color: var(--good); }
.warning { color: var(--warn); }
.error { color: var(--bad); }
.cubeA { color: var(--a); font-weight: 650; }
.cubeB { color: var(--b); font-weight: 650; }
</style>
</head>

<body>
<main class="app">

    <header>
        <h1>AprilTag iPad</h1>
        <div id="version" class="version"></div>
    </header>

    <div id="viewer" class="viewer">
        <video id="camera" autoplay muted playsinline></video>
        <canvas id="overlay"></canvas>
        <div class="hud">
            <div id="status" class="status">Prêt</div>
            <div id="detail" class="detail">Touchez « Démarrer caméra ».</div>
        </div>
    </div>

    <div class="buttons">
        <button id="start" class="start">Démarrer caméra</button>
        <button id="stop" class="stop hidden">Arrêter</button>
    </div>

    <div class="buttons">
        <button id="record" class="record" disabled>Enregistrer la position</button>
        <button id="auto" class="auto on">Validation auto : oui</button>
    </div>

    <div class="buttons">
        <button id="exportAll" class="export main" disabled>Exporter les STL (1 par cube)</button>
    </div>

    <div id="gridCaption" class="grid-caption"></div>
    <div class="pose-grid">
        <div class="pose-box"><div class="pose-label">ΔX</div><div id="relX" class="pose-value">—</div></div>
        <div class="pose-box"><div class="pose-label">ΔY</div><div id="relY" class="pose-value">—</div></div>
        <div class="pose-box"><div class="pose-label">ΔZ</div><div id="relZ" class="pose-value">—</div></div>
        <div class="pose-box"><div class="pose-label">Roll</div><div id="relRoll" class="pose-value">—</div></div>
        <div class="pose-box"><div class="pose-label">Pitch</div><div id="relPitch" class="pose-value">—</div></div>
        <div class="pose-box"><div class="pose-label">Yaw</div><div id="relYaw" class="pose-value">—</div></div>
    </div>

    <div id="diagnostic" class="info"></div>

</main>

<canvas id="analysis" style="display:none"></canvas>

<script>
"use strict";

/* ============================================================
   CONFIGURATION V8.0

   Valeurs provisoires à confirmer physiquement :
   - Tag : 8 mm de carré noir + 1 mm de marge blanche
   - Cube : 10 mm d'arête
   - HFOV caméra : 65°
============================================================ */

const VERSION = "V9.0";

const TAG_SIZE_M = 0.008;             // côté du carré noir du tag (sans la marge blanche)
const CAMERA_HFOV_DEG = 65;

/* Résolution d'analyse limitée pour préserver Safari/iPad. */
const ANALYSIS_MAX_SIZE = 1280;        // tags de 8 mm : il faut une image fine
const CAMERA_IDEAL_WIDTH = 1920;
const CAMERA_IDEAL_HEIGHT = 1080;
const QUAD_DECIMATE = 1.0;             // 1 = pleine résolution (plus lent, plus précis)
const DETECTION_INTERVAL_MS = 125;   // environ 8 analyses / seconde

/* tag36h11 possède 587 IDs (0 à 586), tous supposés de même taille. */
const MAX_TAG_ID_TO_CONFIGURE = 586;

const CENTER_SMOOTHING_ALPHA = 0.22;
const FRAME_SMOOTHING_ALPHA = 0.18;
const CENTER_OUTLIER_RATIO = 0.20;       // écart toléré entre faces, en fraction de l'arête
const POSE_HOLD_MS = 500;

/*
  VALIDATION AUTOMATIQUE
  La position de B par rapport à A est observée sur une fenêtre glissante.
  Quand elle ne bouge presque plus, la fenêtre la plus stable est retenue
  et sa moyenne est enregistrée.
*/
const AUTO_WINDOW = 12;              // nombre de mesures dans la fenêtre
const AUTO_MAX_SPREAD_MM = 0.4;      // dispersion maximale en position
const AUTO_MAX_SPREAD_DEG = 2.0;     // dispersion maximale en orientation
const AUTO_PATIENCE = 4;             // mesures sans amélioration avant de valider
const AUTO_MAX_WAIT = 24;            // mesures stables au plus avant de valider

/* Au-delà de ce nombre de triangles, l'affichage utilise une version
   allégée du STL. L'export garde toujours le fichier complet. */
const STL_DISPLAY_MAX_TRIANGLES = 6000;

const STL_SCALE_TO_M = 0.001;        // coordonnées STL en mm -> mètres

/* Rendu du STL */
const STL_ALPHA = 0.9;               // 1 = opaque, plus bas = plus transparent
const STL_TINT = 0.30;               // part de la couleur du cube dans la teinte
const STL_SHADE_LEVELS = 24;
/* Direction vers la lumière, repère caméra (x à droite, y vers le bas, z devant). */
const STL_LIGHT_DIR = (function() {
    const v = [-0.35, -0.60, -0.72];
    const n = Math.hypot(v[0], v[1], v[2]);
    return [v[0] / n, v[1] / n, v[2] / n];
})();

const AXIS_LENGTH_RATIO = 1.5;        // longueur des axes dessinés, en fraction de l'arête

/* Netteté du dessin : pixels de dessin par pixel d'analyse (calculé au démarrage). */
const OVERLAY_MAX_SCALE = 2;

/*
  CUBES

  Tous les cubes sont identiques : mêmes tags, même face à points,
  même STL. L'application les distingue par leur position dans l'espace
  et les numérote 1, 2, 3… (jusqu'à MAX_CUBES). Le cube 1 sert de
  référence pour l'enregistrement et l'export.

  Modèle de cube :
  - faces      : ID du tag sur la face +X, +Y et +Z du repère du cube
                 (une face sans tag est simplement omise) ;
  - dots       : face portant la grille de 3 × 3 points ;
  - edgeM      : arête du cube en mètres ;
  - stlName    : fichier STL (binaire, en mm) placé à côté de index.html ;
  - stlOffsetM : origine du STL dans le repère du cube (axes alignés).
*/
/* Face à points : 3 × 3 points Ø 1,2 mm, pas 10/3 mm, centrés sur la face −Y. */
const DOT_FACE = { normal: [0, -1, 0], pitchM: 0.010 / 3, diameterM: 0.0012 };

/* Affinage de la pose */
const FIT_MAX_RMS_PX = 2.5;          // au-delà, l'affinage est jugé faux et ignoré
const DOT_MIN_CONTRAST = 25;         // écart de gris minimal entre point et fond
const DOT_PIXEL_OFFSET = 0.5;        // centre du pixel (i, j) = (i + 0,5 ; j + 0,5)
const DOT_WEIGHT = 9;                // un centre de point est ~3 fois plus précis qu'un coin de tag

const CUBE_TEMPLATES = [
    {
        faces: { xPlus: 2, zPlus: 7 },       // +X vers ID 2 (droite), +Z vers ID 7 (dessus)
        dots: DOT_FACE,                      // −Y : face à points
        edgeM: 0.010,
        stlName: "IOC-A.stl",
        stlOffsetM: [0, 0, -0.010]
    }
    /* Ancien cube à 3 tags (à utiliser à la place, pas en même temps) :
       { faces: { xPlus: 2, yPlus: 4, zPlus: 7 }, ySign: -1, edgeM: 0.010,
         stlName: "IOC-A.stl", stlOffsetM: [0, 0, -0.010] } */
];

const MAX_CUBES = 6;
const CLUSTER_RADIUS_RATIO = 0.6;    // tags d'un même cube : centres estimés à moins de 0,6 arête
const TRACK_RADIUS_RATIO = 2.5;      // suivi d'une image à l'autre : déplacement maximal en arêtes
const CUBE_FORGET_MS = 2000;         // cube oublié après 2 s sans être vu
const CUBE_COLORS = [
    [125, 211, 252], [253, 186, 116], [134, 239, 172],
    [249, 168, 212], [196, 181, 253], [253, 224, 71]
];


/* ============================================================
   ÉLÉMENTS
============================================================ */

const video = document.getElementById("camera");
const viewer = document.getElementById("viewer");
const overlay = document.getElementById("overlay");
const overlayCtx = overlay.getContext("2d");
const analysis = document.getElementById("analysis");
const analysisCtx = analysis.getContext("2d", { willReadFrequently: true });

const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const recordButton = document.getElementById("record");
const autoButton = document.getElementById("auto");
const exportAllButton = document.getElementById("exportAll");
const gridCaption = document.getElementById("gridCaption");

const statusEl = document.getElementById("status");
const detailEl = document.getElementById("detail");
const diagnostic = document.getElementById("diagnostic");

const relEls = {
    x: document.getElementById("relX"),
    y: document.getElementById("relY"),
    z: document.getElementById("relZ"),
    roll: document.getElementById("relRoll"),
    pitch: document.getElementById("relPitch"),
    yaw: document.getElementById("relYaw")
};

document.getElementById("version").textContent =
    VERSION;

diagnostic.innerHTML =
    VERSION + " prête.<br>Suivi de cubes identiques (jusqu'à " + MAX_CUBES + "), un STL par cube.";


/* ============================================================
   VARIABLES
============================================================ */

let stream = null;
let detector = null;
let animationId = null;
let grayBuffer = null;
let lastDetectionTime = 0;
let detectionRunning = false;
let cameraModel = null;
let overlayScale = 1;

/*
  Position enregistrée, ou null :
  { ref: cube de référence, members: cubes concernés,
    rels: Map(cube -> position par rapport à la référence), ... }
*/
let recorded = null;

/* Positions relatives en direct : { ref, rels: Map(cube -> position relative) }, ou null. */
let liveSet = null;

/* Validation automatique */
let autoEnabled = true;
let autoArmed = true;        // désarmée après une libération, jusqu'au prochain mouvement
let relBuffer = [];
let bufferKey = "";          // liste des cubes présents dans la fenêtre de mesure
let stability = null;        // statistiques de la fenêtre courante
let bestWindow = null;
let stableCount = 0;
let sinceBest = 0;

/* Base (a, b) du plan d'une face de normale n (axe du cube). */
function faceBasis(n) {
    const a = Math.abs(n[0]) > 0.5 ? [0, 1, 0] : [1, 0, 0];
    return { a, b: vecCross(n, a) };
}

/* Coins du carré noir de chaque tag, en mètres dans le repère du cube, dans l'ordre du tour. */
function buildTagCorners(config) {
    const h = config.edgeM / 2;
    const s = TAG_SIZE_M / 2;
    const normals = {
        xPlus: [1, 0, 0],
        yPlus: [0, config.ySign || 1, 0],
        zPlus: [0, 0, 1]
    };
    const result = {};
    for (const key of ["xPlus", "yPlus", "zPlus"]) {
        const id = config.faces[key];
        if (id === undefined) continue;
        const n = normals[key];
        const { a, b } = faceBasis(n);
        const c = vecScale(n, h);
        result[id] = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([i, j]) =>
            vecAdd(c, vecAdd(vecScale(a, i * s), vecScale(b, j * s)))
        );
    }
    return result;
}

/* Centres des 9 points, en mètres dans le repère du cube. */
function buildDotPoints(dots, edgeM) {
    const { a, b } = faceBasis(dots.normal);
    const c = vecScale(dots.normal, edgeM / 2);
    const points = [];
    for (const i of [-1, 0, 1]) {
        for (const j of [-1, 0, 1]) {
            points.push(vecAdd(c, vecAdd(vecScale(a, i * dots.pitchM), vecScale(b, j * dots.pitchM))));
        }
    }
    return points;
}

/* Modèles de cubes (géométrie, tags, STL), partagés par tous les cubes identiques. */
const templates = CUBE_TEMPLATES.map(config => ({
    ...config,
    ids: new Set(
        [config.faces.xPlus, config.faces.yPlus, config.faces.zPlus]
            .filter(id => id !== undefined)
    ),
    tagCorners: buildTagCorners(config),
    dotPoints: config.dots ? buildDotPoints(config.dots, config.edgeM) : null,
    tagRot: {},                 // orientation de chaque tag dans le cube, apprise en cours de suivi
    mesh: null,
    stlState: "non chargé"
}));

const templateByTagId = new Map();
for (const template of templates) {
    for (const id of template.ids) templateByTagId.set(id, template);
}

/* Cubes physiques actuellement suivis, numérotés 1, 2, 3… */
let cubes = [];

function makeCube(template) {
    const used = new Set(cubes.map(c => c.number));
    if (recorded) for (const c of recorded.members) used.add(c.number);
    let number = 1;
    while (used.has(number)) number++;

    return {
        ...template,
        template,
        number,
        key: String(number),
        color: CUBE_COLORS[(number - 1) % CUBE_COLORS.length],
        palette: null,
        ySign: template.ySign || 1,
        lastSeen: 0,
        lastCenter: null,
        smoothedCenter: null,
        lastRawCenter: null,
        stabilityMm: null,
        smoothedFrame: null,
        lastGood: null,
        estimate: null,
        center: null,
        frame: null,
        held: false,
        fit: null,
        visibleIds: []
    };
}

function resetCubeTracking(cube) {
    cube.smoothedCenter = null;
    cube.lastRawCenter = null;
    cube.stabilityMm = null;
    cube.smoothedFrame = null;
    cube.lastGood = null;
    cube.estimate = null;
    cube.center = null;
    cube.frame = null;
    cube.held = false;
    cube.visibleIds = [];
    cube.fit = null;
}


/* ============================================================
   OUTILS UI
============================================================ */

function setMessage(title, text, type = "") {
    statusEl.textContent = title;
    detailEl.textContent = text;
    statusEl.className = "status " + type;
}

function errorText(error) {
    if (error === undefined) return "Erreur JavaScript : valeur undefined";
    if (error === null) return "Erreur JavaScript : valeur null";
    if (typeof error === "string") return error;
    if (error.message) return error.message;
    try { return JSON.stringify(error); }
    catch (_) { return String(error); }
}

function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* ============================================================
   PETITS OUTILS 3D
============================================================ */

function vecAdd(a, b) { return [a[0] + b[0], a[1] + b[1], a[2] + b[2]]; }
function vecSub(a, b) { return [a[0] - b[0], a[1] - b[1], a[2] - b[2]]; }
function vecScale(v, s) { return [v[0] * s, v[1] * s, v[2] * s]; }
function vecLength(v) { return Math.hypot(v[0], v[1], v[2]); }
function vecDot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }

function vecCross(a, b) {
    return [
        a[1] * b[2] - a[2] * b[1],
        a[2] * b[0] - a[0] * b[2],
        a[0] * b[1] - a[1] * b[0]
    ];
}

function vecNormalize(v) {
    const length = vecLength(v);
    if (!Number.isFinite(length) || length < 1e-9) return [0, 0, 1];
    return vecScale(v, 1 / length);
}

function lerpVec(a, b, alpha) {
    return [
        a[0] + (b[0] - a[0]) * alpha,
        a[1] + (b[1] - a[1]) * alpha,
        a[2] + (b[2] - a[2]) * alpha
    ];
}

/* Retire de v sa composante le long de "against", puis normalise.
   Renvoie null si les deux vecteurs sont presque parallèles. */
function orthoNormalize(v, against) {
    const r = vecSub(v, vecScale(against, vecDot(v, against)));
    const length = vecLength(r);
    if (!Number.isFinite(length) || length < 0.2) return null;
    return vecScale(r, 1 / length);
}

function median(values) {
    if (!values.length) return 0;
    const sorted = [...values].sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
}

function robustCenter(points) {
    return [
        median(points.map(p => p[0])),
        median(points.map(p => p[1])),
        median(points.map(p => p[2]))
    ];
}

function project3D(point) {
    if (!cameraModel || !point || !Number.isFinite(point[2]) || point[2] <= 0.0001) {
        return null;
    }
    return {
        x: cameraModel.fx * point[0] / point[2] + cameraModel.cx,
        y: cameraModel.fy * point[1] / point[2] + cameraModel.cy
    };
}

/* Point exprimé dans un repère (origine + axes) -> repère caméra. */
function frameDirToCamera(frame, v) {
    return vecAdd(
        vecAdd(vecScale(frame.x, v[0]), vecScale(frame.y, v[1])),
        vecScale(frame.z, v[2])
    );
}

function framePointToCamera(frame, v) {
    return vecAdd(frame.origin, frameDirToCamera(frame, v));
}

/*
  Le JSON du moteur WASM indique R en "column major".
  R[0], R[1], R[2] sont traités comme les axes locaux X, Y, Z
  du tag exprimés dans le repère caméra.
*/
function poseAxes(marker) {
    if (!marker || !marker.pose || !Array.isArray(marker.pose.R) || marker.pose.R.length < 3) {
        return null;
    }
    return {
        x: vecNormalize(marker.pose.R[0]),
        y: vecNormalize(marker.pose.R[1]),
        z: vecNormalize(marker.pose.R[2])
    };
}

function markerPosition(marker) {
    if (!marker || !marker.pose || !Array.isArray(marker.pose.t) || marker.pose.t.length < 3) {
        return null;
    }
    const t = [Number(marker.pose.t[0]), Number(marker.pose.t[1]), Number(marker.pose.t[2])];
    return t.every(Number.isFinite) ? t : null;
}


/* ============================================================
   CHARGEMENT APRILTAG WASM
============================================================ */

async function loadAprilTag() {
    if (detector) return detector;

    setMessage("Chargement AprilTag…", "Initialisation du moteur tag36h11.", "warning");
    diagnostic.innerHTML = "Téléchargement du moteur AprilTag…";

    return new Promise(function(resolve, reject) {
        const base = "https://arenaxr.github.io/apriltag-js-standalone/";

        window.AprilTagWasmModule = {
            locateFile: function(path) { return base + path; }
        };

        const script = document.createElement("script");
        script.src = base + "apriltag_wasm.js";

        script.onload = function() {
            try {
                function getModulePromise() {
                    const wasm = window.AprilTagWasm;
                    if (typeof wasm === "function") return wasm(window.AprilTagWasmModule);
                    if (wasm && typeof wasm.then === "function") return wasm;
                    return null;
                }

                function initialise(Module) {
                    try {
                        if (!Module) throw new Error("Module WebAssembly vide.");
                        if (typeof Module.cwrap !== "function") {
                            throw new Error("Module.cwrap indisponible.");
                        }

                        const init = Module.cwrap("atagjs_init", "number", []);
                        const options = Module.cwrap(
                            "atagjs_set_detector_options", "number",
                            ["number", "number", "number", "number", "number", "number", "number"]
                        );
                        const setImage = Module.cwrap(
                            "atagjs_set_img_buffer", "number", ["number", "number", "number"]
                        );
                        const setPoseInfo = Module.cwrap(
                            "atagjs_set_pose_info", "number", ["number", "number", "number", "number"]
                        );
                        const setTagSize = Module.cwrap(
                            "atagjs_set_tag_size", "number", ["number", "number"]
                        );
                        const detectWasm = Module.cwrap("atagjs_detect", "number", []);

                        if (init() !== 0) {
                            throw new Error("Échec initialisation moteur AprilTag.");
                        }

                        /* quad_decimate, quad_sigma, nthreads, refine_edges,
                           max_detections, return_pose = 1, return_solutions = 0 */
                        options(QUAD_DECIMATE, 0, 1, 1, 0, 1, 0);

                        for (let id = 0; id <= MAX_TAG_ID_TO_CONFIGURE; id++) {
                            setTagSize(id, TAG_SIZE_M);
                        }

                        detector = {
                            setCameraInfo(fx, fy, cx, cy) {
                                if (setPoseInfo(fx, fy, cx, cy) !== 0) {
                                    throw new Error("Impossible de configurer les paramètres caméra.");
                                }
                            },

                            async detect(gray, width, height) {
                                const buffer = setImage(width, height, width);
                                if (!Number.isFinite(buffer) || buffer <= 0) {
                                    throw new Error("Impossible de créer le buffer image WASM.");
                                }

                                Module.HEAPU8.set(gray, buffer);

                                const ptr = detectWasm();
                                if (!Number.isFinite(ptr) || ptr <= 0) return [];

                                const length = Module.getValue(ptr, "i32");
                                if (!Number.isFinite(length)) {
                                    throw new Error("Longueur de résultat AprilTag invalide.");
                                }
                                if (length <= 0) return [];

                                const stringPtr = Module.getValue(ptr + 4, "i32");
                                if (!Number.isFinite(stringPtr) || stringPtr <= 0) {
                                    throw new Error("Adresse du résultat AprilTag invalide.");
                                }

                                const bytes = new Uint8Array(Module.HEAPU8.buffer, stringPtr, length);

                                let json = "";
                                if (typeof TextDecoder !== "undefined") {
                                    json = new TextDecoder("utf-8").decode(bytes);
                                }
                                else {
                                    for (let i = 0; i < length; i++) {
                                        json += String.fromCharCode(bytes[i]);
                                    }
                                }

                                if (!json) return [];

                                const result = JSON.parse(json);
                                if (!Array.isArray(result)) {
                                    throw new Error("Le détecteur n'a pas renvoyé un tableau.");
                                }
                                return result;
                            }
                        };

                        resolve(detector);
                    }
                    catch (error) {
                        reject(error);
                    }
                }

                const promise = getModulePromise();

                if (promise) {
                    Promise.resolve(promise).then(initialise).catch(reject);
                }
                else {
                    setTimeout(function() {
                        const delayed = getModulePromise();
                        if (delayed) {
                            Promise.resolve(delayed).then(initialise).catch(reject);
                        }
                        else {
                            reject(new Error("Module WASM AprilTag introuvable."));
                        }
                    }, 300);
                }
            }
            catch (error) {
                reject(error);
            }
        };

        script.onerror = function() {
            reject(new Error("Impossible de télécharger apriltag_wasm.js"));
        };

        document.head.appendChild(script);
    });
}


/* ============================================================
   CAMÉRA
============================================================ */

async function startCamera() {
    startButton.disabled = true;

    try {
        if (!window.isSecureContext) {
            throw new Error("Cette page doit être ouverte en HTTPS.");
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("API caméra non disponible.");
        }

        await loadAprilTag();

        /* Les STL se chargent en parallèle : la caméra n'en dépend pas. */
        for (const template of templates) loadTemplateSTL(template);

        setMessage("Ouverture caméra…", "Activation de la caméra arrière.", "warning");

        stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: { ideal: "environment" },
                width: { ideal: CAMERA_IDEAL_WIDTH },
                height: { ideal: CAMERA_IDEAL_HEIGHT }
            }
        });

        video.srcObject = stream;
        await video.play();
        await waitForVideo();
        configureCanvas();

        startButton.classList.add("hidden");
        stopButton.classList.remove("hidden");

        setMessage("Recherche AprilTag…", "Présentez les deux cubes devant la caméra.", "warning");

        animationId = requestAnimationFrame(scanFrame);
    }
    catch (error) {
        const message = errorText(error);
        console.error(error);
        setMessage("Erreur", message, "error");
        diagnostic.innerHTML =
            "<span class='error'>ERREUR : " + escapeHtml(message) + "</span>";
        startButton.disabled = false;
    }
}

function waitForVideo() {
    return new Promise(function(resolve) {
        if (video.videoWidth > 0 && video.videoHeight > 0) {
            resolve();
            return;
        }
        video.addEventListener("loadedmetadata", resolve, { once: true });
    });
}


/* ============================================================
   CANVAS + MODÈLE CAMÉRA
============================================================ */

function configureCanvas() {
    const width = video.videoWidth;
    const height = video.videoHeight;

    viewer.style.aspectRatio = width + "/" + height;

    const factor = Math.min(1, ANALYSIS_MAX_SIZE / Math.max(width, height));

    analysis.width = Math.round(width * factor);
    analysis.height = Math.round(height * factor);

    /* Le dessin est plus fin que l'analyse, pour des traits et textes nets. */
    const dpr = window.devicePixelRatio || 1;
    overlayScale = Math.max(
        1,
        Math.min(OVERLAY_MAX_SCALE, viewer.clientWidth * dpr / analysis.width)
    );
    overlay.width = Math.round(analysis.width * overlayScale);
    overlay.height = Math.round(analysis.height * overlayScale);

    grayBuffer = new Uint8Array(analysis.width * analysis.height);

    /*
      Intrinsèques PROVISOIRES : Safari ne donne pas la calibration native.
      On convertit un HFOV approximatif en focale pixels (pixels carrés).
    */
    const hfovRad = CAMERA_HFOV_DEG * Math.PI / 180;
    const fx = (analysis.width / 2) / Math.tan(hfovRad / 2);
    const fy = fx;
    const cx = analysis.width / 2;
    const cy = analysis.height / 2;

    cameraModel = { fx, fy, cx, cy, videoWidth: width, videoHeight: height };
    detector.setCameraInfo(fx, fy, cx, cy);

    cubes = [];
}


/* ============================================================
   CONVERSION NIVEAUX DE GRIS
============================================================ */

function imageToGray(imageData) {
    const data = imageData.data;
    let destinationIndex = 0;
    for (let sourceIndex = 0; sourceIndex < data.length; sourceIndex += 4) {
        grayBuffer[destinationIndex++] = Math.round(
            0.299 * data[sourceIndex] +
            0.587 * data[sourceIndex + 1] +
            0.114 * data[sourceIndex + 2]
        );
    }
}


/* ============================================================
   CENTRE D'UN CUBE (MULTI-TAGS)

   Pour chaque face détectée :
   centre_cube ≈ centre_tag +/− normale_tag × demi-arête.
   On garde le signe qui place le centre PLUS LOIN de la caméra
   que la face visible.
============================================================ */

function estimateCubeCenter(cube, markers) {
    const candidates = [];
    const half = cube.edgeM / 2;

    for (const marker of markers) {
        if (!cube.ids.has(Number(marker.id))) continue;

        const t = markerPosition(marker);
        if (!t) continue;

        const axes = poseAxes(marker);
        if (!axes) continue;

        const candidateA = vecAdd(t, vecScale(axes.z, half));
        const candidateB = vecSub(t, vecScale(axes.z, half));
        const cubePoint = candidateA[2] >= candidateB[2] ? candidateA : candidateB;

        const error = Number.isFinite(Number(marker.pose.e))
            ? Math.max(Number(marker.pose.e), 1e-7)
            : 1e-4;

        candidates.push({
            marker,
            point: cubePoint,
            weight: Math.min(25000, 1 / error)
        });
    }

    if (!candidates.length) return null;

    const consensus = robustCenter(candidates.map(c => c.point));
    let accepted = candidates;

    if (candidates.length >= 3) {
        accepted = candidates.filter(c =>
            vecLength(vecSub(c.point, consensus)) <= cube.edgeM * CENTER_OUTLIER_RATIO
        );
        if (!accepted.length) accepted = candidates;
    }

    let sum = [0, 0, 0];
    let sumWeight = 0;
    for (const c of accepted) {
        sum = vecAdd(sum, vecScale(c.point, c.weight));
        sumWeight += c.weight;
    }
    if (!Number.isFinite(sumWeight) || sumWeight <= 0) return null;

    return {
        center: vecScale(sum, 1 / sumWeight),
        candidates,
        accepted
    };
}


/* ============================================================
   REPÈRE 3D D'UN CUBE

   Le repère est toujours direct (main droite), avec :
   - X = normale sortante de la face xPlus ;
   - Z = normale sortante de la face zPlus ;
   - Y = Z × X.

   La face yPlus pointe vers +Y ou −Y selon la façon dont les tags
   sont collés. Ce sens (ySign) est appris automatiquement dès que
   les trois faces sont visibles ensemble, pour que le repère reste
   le même quelle que soit la paire de faces visible.

   Il faut au moins deux faces visibles pour obtenir le repère.
============================================================ */

function estimateCubeFrame(cube, markers, rawCenter) {
    if (!rawCenter) return null;

    const byId = new Map(markers.map(marker => [Number(marker.id), marker]));

    function outwardNormal(id) {
        const t = markerPosition(byId.get(Number(id)));
        if (!t) return null;
        const v = vecSub(t, rawCenter);
        const length = vecLength(v);
        if (length < 1e-6) return null;
        return vecScale(v, 1 / length);
    }

    const nx = outwardNormal(cube.faces.xPlus);
    const ny = outwardNormal(cube.faces.yPlus);
    const nz = outwardNormal(cube.faces.zPlus);

    if (nx && ny && nz) {
        const triple = vecDot(ny, vecCross(nz, nx));
        if (Math.abs(triple) > 0.5) cube.ySign = triple > 0 ? 1 : -1;
    }

    let x, y, z;

    if (nx && nz) {
        x = nx;
        z = orthoNormalize(nz, x);
        if (!z) return null;
        y = vecCross(z, x);
    }
    else if (nx && ny) {
        x = nx;
        y = orthoNormalize(vecScale(ny, cube.ySign), x);
        if (!y) return null;
        z = vecCross(x, y);
    }
    else if (ny && nz) {
        z = nz;
        y = orthoNormalize(vecScale(ny, cube.ySign), z);
        if (!y) return null;
        x = vecCross(y, z);
    }
    else {
        return null;
    }

    return { x, y, z };
}

function updateSmoothedFrame(cube, raw) {
    const previous = cube.smoothedFrame;

    /* Premier repère, ou saut important : on repart du repère mesuré. */
    if (!previous || vecDot(raw.x, previous.x) < 0 || vecDot(raw.z, previous.z) < 0) {
        cube.smoothedFrame = { x: [...raw.x], y: [...raw.y], z: [...raw.z] };
        return cube.smoothedFrame;
    }

    const x = vecNormalize(lerpVec(previous.x, raw.x, FRAME_SMOOTHING_ALPHA));
    const z = orthoNormalize(lerpVec(previous.z, raw.z, FRAME_SMOOTHING_ALPHA), x);

    if (!z) {
        cube.smoothedFrame = { x: [...raw.x], y: [...raw.y], z: [...raw.z] };
        return cube.smoothedFrame;
    }

    cube.smoothedFrame = { x, y: vecCross(z, x), z };
    return cube.smoothedFrame;
}

function updateSmoothedCenter(cube, rawCenter) {
    if (!cube.smoothedCenter) {
        cube.smoothedCenter = [...rawCenter];
        cube.lastRawCenter = [...rawCenter];
        cube.stabilityMm = 0;
        return cube.smoothedCenter;
    }

    const rawJumpMm = vecLength(vecSub(rawCenter, cube.lastRawCenter)) * 1000;
    cube.stabilityMm = cube.stabilityMm === null
        ? rawJumpMm
        : cube.stabilityMm * 0.70 + rawJumpMm * 0.30;

    cube.smoothedCenter = lerpVec(cube.smoothedCenter, rawCenter, CENTER_SMOOTHING_ALPHA);
    cube.lastRawCenter = [...rawCenter];
    return cube.smoothedCenter;
}

function stabilityLabel(stabilityMm) {
    if (stabilityMm === null || !Number.isFinite(stabilityMm)) return "—";
    if (stabilityMm < 0.3) return "très stable";
    if (stabilityMm < 0.8) return "stable";
    if (stabilityMm < 2) return "moyen";
    return "instable";
}

/* Met à jour un cube pour l'image courante : centre, repère, maintien. */
function updateCube(cube, markers, now) {
    cube.visibleIds = markers
        .map(marker => Number(marker.id))
        .filter(id => cube.ids.has(id));

    cube.center = null;
    cube.frame = null;
    cube.held = false;

    const estimate = estimateCubeCenter(cube, markers);
    cube.estimate = estimate;

    cube.fit = null;

    if (estimate) {
        let origin = estimate.center;
        let rawFrame =
            estimateCubeFrame(cube, markers, estimate.center) ||
            frameFromSingleTag(cube, markers);

        /* Affinage sur tous les points connus : coins des tags + centres des points. */
        let fit = null;
        if (rawFrame) {
            fit = refinePose(cube, markers, { origin, ...rawFrame });
        }
        else {
            /* Un seul tag, orientation encore inconnue : les points lèvent l'ambiguïté. */
            fit = solveSingleTagWithDots(cube, markers, origin);
        }
        if (fit && fit.rms <= FIT_MAX_RMS_PX) {
            cube.fit = fit;
            origin = fit.origin;
            rawFrame = { x: fit.x, y: fit.y, z: fit.z };
            learnTagRotations(cube, markers, fit);
        }

        cube.center = [...updateSmoothedCenter(cube, origin)];

        if (rawFrame) {
            const smooth = updateSmoothedFrame(cube, rawFrame);
            cube.frame = {
                origin: [...cube.center],
                x: [...smooth.x],
                y: [...smooth.y],
                z: [...smooth.z]
            };
            cube.lastGood = { frame: cube.frame, time: now };
            return;
        }
    }

    if (cube.lastGood && now - cube.lastGood.time <= POSE_HOLD_MS) {
        cube.frame = cube.lastGood.frame;
        cube.center = [...cube.frame.origin];
        cube.held = true;
        return;
    }

    cube.smoothedFrame = null;
    if (!estimate) {
        cube.smoothedCenter = null;
        cube.lastRawCenter = null;
        cube.stabilityMm = null;
    }
}


/* ============================================================
   AFFINAGE DE LA POSE (TAGS + POINTS)

   La pose de départ (centre + axes) vient des tags. On cherche ensuite
   la pose du cube qui fait coïncider au mieux, dans l'image :
   - les 4 coins de chaque tag visible ;
   - les centres des points de la face à points, mesurés finement
     autour de leur position prévue.
   Méthode : moindres carrés (Levenberg-Marquardt) sur les 6 degrés
   de liberté de la pose, à partir des écarts en pixels.
============================================================ */

function poseToCamera(pose, P) {
    return vecAdd(pose.t, vecAdd(vecAdd(vecScale(pose.R[0], P[0]), vecScale(pose.R[1], P[1])), vecScale(pose.R[2], P[2])));
}

function projectUV(c) {
    if (c[2] <= 1e-4) return null;
    return [cameraModel.fx * c[0] / c[2] + cameraModel.cx, cameraModel.fy * c[1] / c[2] + cameraModel.cy];
}

/* Rotation d'un vecteur v autour de l'axe w (vecteur rotation, en radians). */
function rotateVec(v, w) {
    const angle = vecLength(w);
    if (angle < 1e-12) return v;
    const k = vecScale(w, 1 / angle);
    const cos = Math.cos(angle), sin = Math.sin(angle);
    return vecAdd(
        vecAdd(vecScale(v, cos), vecScale(vecCross(k, v), sin)),
        vecScale(k, vecDot(k, v) * (1 - cos))
    );
}

function applyDelta(pose, d) {
    const w = [d[0], d[1], d[2]];
    let x = vecNormalize(rotateVec(pose.R[0], w));
    let z = orthoNormalize(rotateVec(pose.R[2], w), x) || pose.R[2];
    return { R: [x, vecCross(z, x), z], t: vecAdd(pose.t, [d[3], d[4], d[5]]) };
}

function reprojection(obs, pose) {
    const r = new Float64Array(obs.length * 2);
    for (let i = 0; i < obs.length; i++) {
        const p = projectUV(poseToCamera(pose, obs[i].P));
        if (!p) return null;
        const s = obs[i].s || 1;                 // racine du poids de la mesure
        r[2 * i] = (p[0] - obs[i].u) * s;
        r[2 * i + 1] = (p[1] - obs[i].v) * s;
    }
    return r;
}

function sumSquares(r) {
    let s = 0;
    for (let i = 0; i < r.length; i++) s += r[i] * r[i];
    return s;
}

/* Résolution d'un petit système linéaire (élimination de Gauss). */
function solveLinear(A, b) {
    const n = b.length;
    const M = A.map((row, i) => [...row, b[i]]);
    for (let c = 0; c < n; c++) {
        let p = c;
        for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
        if (Math.abs(M[p][c]) < 1e-18) return null;
        [M[c], M[p]] = [M[p], M[c]];
        for (let r = 0; r < n; r++) {
            if (r === c) continue;
            const f = M[r][c] / M[c][c];
            for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
        }
    }
    return M.map((row, i) => row[n] / row[i]);
}

function optimizePose(obs, pose, iterations = 12) {
    let r = reprojection(obs, pose);
    if (!r) return pose;
    let cost = sumSquares(r);
    let lambda = 1e-3;
    const steps = [1e-5, 1e-5, 1e-5, 1e-6, 1e-6, 1e-6];

    for (let it = 0; it < iterations; it++) {
        const J = [];
        for (let k = 0; k < 6; k++) {
            const d = [0, 0, 0, 0, 0, 0];
            d[k] = steps[k];
            const rk = reprojection(obs, applyDelta(pose, d));
            if (!rk) return pose;
            const col = new Float64Array(r.length);
            for (let i = 0; i < r.length; i++) col[i] = (rk[i] - r[i]) / steps[k];
            J.push(col);
        }

        const A = [], g = [];
        for (let a = 0; a < 6; a++) {
            A.push([]);
            let s = 0;
            for (let i = 0; i < r.length; i++) s += J[a][i] * r[i];
            g.push(-s);
            for (let b = 0; b < 6; b++) {
                let t = 0;
                for (let i = 0; i < r.length; i++) t += J[a][i] * J[b][i];
                A[a].push(t);
            }
        }

        let improved = false;
        for (let attempt = 0; attempt < 6 && !improved; attempt++) {
            const Ad = A.map((row, i) => row.map((v, j) => (i === j ? v * (1 + lambda) + 1e-12 : v)));
            const d = solveLinear(Ad, g);
            if (!d) break;
            const candidate = applyDelta(pose, d);
            const rc = reprojection(obs, candidate);
            if (rc && sumSquares(rc) < cost) {
                pose = candidate;
                r = rc;
                const previous = cost;
                cost = sumSquares(rc);
                lambda = Math.max(lambda / 3, 1e-7);
                improved = true;
                if (previous - cost < 1e-6 * previous) it = iterations;
            }
            else {
                lambda *= 8;
            }
        }
        if (!improved) break;
    }
    return pose;
}

/* Associe les 4 coins détectés d'un tag à ses 4 coins connus (8 ordres possibles testés). */
function matchTagCorners(known, detected, pose) {
    const projected = known.map(P => projectUV(poseToCamera(pose, P)));
    if (projected.some(p => !p)) return null;
    let best = null;
    for (const dir of [1, -1]) {
        for (let shift = 0; shift < 4; shift++) {
            let err = 0;
            const order = [];
            for (let k = 0; k < 4; k++) {
                const idx = ((shift + dir * k) % 4 + 4) % 4;
                order.push(idx);
                err += Math.hypot(projected[idx][0] - detected[k].x, projected[idx][1] - detected[k].y);
            }
            if (!best || err < best.err) best = { err, order };
        }
    }
    return best;
}

/*
  Centre d'un point noir mesuré dans l'image d'analyse, autour d'une position prévue.
  Chaque pixel pèse selon sa « noirceur » (0 = fond blanc, 1 = noir plein), dans un
  disque recentré à chaque passe : les pixels de bord partiellement noirs comptent
  pour leur juste part, ce qui donne un centre à une fraction de pixel près.
*/
function measureDot(u0, v0, halfWindow, radiusPx) {
    const w = analysis.width, h = analysis.height;
    const x0 = Math.max(0, Math.floor(u0 - halfWindow)), x1 = Math.min(w - 1, Math.ceil(u0 + halfWindow));
    const y0 = Math.max(0, Math.floor(v0 - halfWindow)), y1 = Math.min(h - 1, Math.ceil(v0 + halfWindow));
    if (x1 - x0 < 4 || y1 - y0 < 4) return null;

    /* Fenêtre circulaire : elle évite d'attraper le noir d'un tag voisin dans les coins. */
    const inWindow = (x, y) => {
        const du = x + DOT_PIXEL_OFFSET - u0, dv = y + DOT_PIXEL_OFFSET - v0;
        return du * du + dv * dv <= halfWindow * halfWindow;
    };

    /* Niveaux du noir et du fond dans la fenêtre. */
    const values = [];
    for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) if (inWindow(x, y)) values.push(grayBuffer[y * w + x]);
    }
    values.sort((a, b) => a - b);
    const black = values[Math.floor(values.length * 0.03)];
    const white = values[Math.floor(values.length * 0.6)];
    if (white - black < DOT_MIN_CONTRAST) return null;

    /* Premier centre : pixels nettement sombres. */
    let cu = u0, cv = v0;
    const darkLimit = (black + white) / 2;
    let sx = 0, sy = 0, n = 0;
    for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
            if (inWindow(x, y) && grayBuffer[y * w + x] < darkLimit) {
                sx += x + DOT_PIXEL_OFFSET;
                sy += y + DOT_PIXEL_OFFSET;
                n++;
            }
        }
    }
    const expectedArea = Math.PI * radiusPx * radiusPx;
    if (n < expectedArea * 0.3 || n > expectedArea * 3) return null;
    cu = sx / n;
    cv = sy / n;

    /* Affinage : centroïde de la noirceur dans un disque recentré. */
    const R = radiusPx * 1.7 + 1;
    for (let pass = 0; pass < 3; pass++) {
        let sw = 0, su = 0, sv = 0;
        const ya = Math.max(0, Math.floor(cv - R)), yb = Math.min(h - 1, Math.ceil(cv + R));
        const xa = Math.max(0, Math.floor(cu - R)), xb = Math.min(w - 1, Math.ceil(cu + R));
        for (let y = ya; y <= yb; y++) {
            for (let x = xa; x <= xb; x++) {
                const px = x + DOT_PIXEL_OFFSET, py = y + DOT_PIXEL_OFFSET;
                if ((px - cu) * (px - cu) + (py - cv) * (py - cv) > R * R) continue;
                const darkness = Math.min(1, Math.max(0, (white - grayBuffer[y * w + x]) / (white - black)));
                sw += darkness;
                su += darkness * px;
                sv += darkness * py;
            }
        }
        if (sw <= 0) return null;
        cu = su / sw;
        cv = sv / sw;
    }

    return [cu, cv];
}

/* Mesure des points de la face à points, à partir d'une pose approchée. */
function detectDots(cube, pose) {
    if (!cube.dotPoints || !grayBuffer || !analysis.width) return [];

    const faceCenter = poseToCamera(pose, vecScale(cube.dots.normal, cube.edgeM / 2));
    const normalCam = vecAdd(
        vecAdd(vecScale(pose.R[0], cube.dots.normal[0]), vecScale(pose.R[1], cube.dots.normal[1])),
        vecScale(pose.R[2], cube.dots.normal[2])
    );
    /* Face trop de biais ou tournée vers l'arrière : on ne la lit pas. */
    if (vecDot(normalCam, vecNormalize(faceCenter)) > -0.25) return [];

    const projected = cube.dotPoints.map(P => projectUV(poseToCamera(pose, P)));
    if (projected.some(p => !p)) return [];

    /* Pas des points en pixels, d'après les points voisins du centre. */
    const c = projected[4];
    const pitchPx = Math.min(
        Math.hypot(projected[1][0] - c[0], projected[1][1] - c[1]),
        Math.hypot(projected[3][0] - c[0], projected[3][1] - c[1])
    );
    if (pitchPx < 6) return [];

    const radiusPx = pitchPx * (cube.dots.diameterM / 2) / cube.dots.pitchM;
    const found = [];

    for (let i = 0; i < projected.length; i++) {
        const [u, v] = projected[i];
        const m = measureDot(u, v, pitchPx * 0.42, radiusPx);
        if (!m) continue;
        if (Math.hypot(m[0] - u, m[1] - v) > pitchPx * 0.3) continue;
        found.push({ P: cube.dotPoints[i], u: m[0], v: m[1], s: Math.sqrt(DOT_WEIGHT) });
    }
    return found;
}

/* Pose affinée du cube, ou null si les données sont insuffisantes. */
function refinePose(cube, markers, init) {
    if (!cameraModel) return null;
    let pose = { R: [init.x, init.y, init.z], t: init.origin };

    const tagObs = [];
    for (const marker of markers) {
        const known = cube.tagCorners[Number(marker.id)];
        if (!known || !marker.corners || marker.corners.length < 4) continue;
        const match = matchTagCorners(known, marker.corners, pose);
        if (!match) continue;
        for (let k = 0; k < 4; k++) {
            tagObs.push({ P: known[match.order[k]], u: marker.corners[k].x, v: marker.corners[k].y });
        }
    }
    if (tagObs.length < 4) return null;

    pose = optimizePose(tagObs, pose);

    /* Deux passes : la seconde mesure les points avec la pose déjà améliorée. */
    let dots = [];
    for (let pass = 0; pass < 2; pass++) {
        dots = detectDots(cube, pose);
        if (dots.length < 3) {
            dots = [];
            break;
        }
        pose = optimizePose(tagObs.concat(dots), pose);
    }

    /* Points aberrants (reflet, poussière) : retirés puis nouveau calcul. */
    if (dots.length) {
        const kept = dots.filter(o => {
            const p = projectUV(poseToCamera(pose, o.P));
            return p && Math.hypot(p[0] - o.u, p[1] - o.v) < 2;
        });
        if (kept.length !== dots.length && kept.length >= 3) {
            dots = kept;
            pose = optimizePose(tagObs.concat(dots), pose);
        }
    }

    /* Écart moyen en pixels, sans pondération, pour juger de la qualité. */
    const r = reprojection(tagObs.concat(dots).map(o => ({ ...o, s: 1 })), pose);
    if (!r) return null;

    return {
        origin: pose.t,
        x: pose.R[0],
        y: pose.R[1],
        z: pose.R[2],
        rms: Math.sqrt(sumSquares(r) / (r.length / 2)),
        nTagPoints: tagObs.length,
        dots: dots.map(o => ({ u: o.u, v: o.v }))
    };
}

/*
  Un seul tag visible et orientation pas encore apprise : la normale de la face
  est connue, mais le tag peut être tourné de 0, 90, 180 ou 270° sur sa face.
  On essaie les quatre ; la bonne est celle où les points apparaissent là où
  le calcul les attend. Sans points lisibles, on ne tranche pas.
*/
function solveSingleTagWithDots(cube, markers, center) {
    if (!cube.dotPoints) return null;
    let best = null;

    for (const marker of markers) {
        const id = Number(marker.id);
        const known = cube.tagCorners[id];
        const axes = poseAxes(marker);
        const t = markerPosition(marker);
        if (!known || !axes || !t) continue;

        /* Normale de la face dans le repère du cube, et dans l'image (tournée vers la caméra). */
        const faceCenter = vecScale(vecAdd(vecAdd(known[0], known[1]), vecAdd(known[2], known[3])), 0.25);
        const n = vecNormalize(faceCenter);
        let N = axes.z;
        if (vecDot(N, t) > 0) N = vecScale(N, -1);
        const { a, b } = faceBasis(n);

        for (let k = 0; k < 4; k++) {
            const angle = k * Math.PI / 2;
            const aCam = vecAdd(vecScale(axes.x, Math.cos(angle)), vecScale(vecCross(N, axes.x), Math.sin(angle)));
            const bCam = vecCross(N, aCam);
            const axis = j => vecAdd(vecAdd(vecScale(N, n[j]), vecScale(aCam, a[j])), vecScale(bCam, b[j]));
            const x = vecNormalize(axis(0));
            const z = orthoNormalize(axis(2), x);
            if (!z) continue;

            const fit = refinePose(cube, [marker], { origin: center, x, y: vecCross(z, x), z });
            if (!fit || fit.dots.length < 5) continue;
            if (!best || fit.dots.length > best.dots.length ||
                (fit.dots.length === best.dots.length && fit.rms < best.rms)) {
                best = fit;
            }
        }
    }
    return best;
}

/* Orientation de chaque tag dans le repère du cube, mémorisée quand la pose est sûre,
   pour pouvoir suivre le cube avec un seul tag visible. */
function learnTagRotations(cube, markers, fit) {
    if (fit.nTagPoints < 8 && fit.dots.length < 5) return;
    for (const marker of markers) {
        const id = Number(marker.id);
        if (!cube.tagCorners[id]) continue;
        const axes = poseAxes(marker);
        if (!axes) continue;
        const inCube = v => [vecDot(v, fit.x), vecDot(v, fit.y), vecDot(v, fit.z)];
        cube.tagRot[id] = { x: inCube(axes.x), y: inCube(axes.y), z: inCube(axes.z) };
    }
}

function frameFromSingleTag(cube, markers) {
    for (const marker of markers) {
        const q = cube.tagRot[Number(marker.id)];
        const axes = poseAxes(marker);
        if (!q || !axes) continue;
        /* Axe j du cube = somme sur les axes du tag de (composante j) × axe du tag. */
        const axis = j => vecAdd(
            vecAdd(vecScale(axes.x, q.x[j]), vecScale(axes.y, q.y[j])),
            vecScale(axes.z, q.z[j])
        );
        const x = vecNormalize(axis(0));
        const z = orthoNormalize(axis(2), x);
        if (!z) continue;
        return { x, y: vecCross(z, x), z };
    }
    return null;
}


/* ============================================================
   REGROUPEMENT DES TAGS PAR CUBE

   Tous les cubes peuvent porter les mêmes tags : on ne peut donc pas
   les distinguer par leurs ID. Chaque tag donne une estimation du
   centre de son cube ; les tags dont les centres se rejoignent
   (à moins de 0,6 arête) appartiennent au même cube. Un même ID ne
   peut apparaître qu'une fois par cube.

   D'une image à l'autre, chaque groupe est rattaché au cube suivi le
   plus proche ; un groupe sans cube proche crée un nouveau cube.
============================================================ */

function groupMarkers(markers) {
    const groups = [];

    for (const marker of markers) {
        const template = templateByTagId.get(Number(marker.id));
        if (!template) continue;

        const t = markerPosition(marker);
        const axes = poseAxes(marker);
        if (!t || !axes) continue;

        const half = template.edgeM / 2;
        const a = vecAdd(t, vecScale(axes.z, half));
        const b = vecSub(t, vecScale(axes.z, half));
        const center = a[2] >= b[2] ? a : b;

        let best = null;
        let bestDistance = Infinity;
        for (const group of groups) {
            if (group.template !== template) continue;
            if (group.markers.some(m => Number(m.id) === Number(marker.id))) continue;
            const d = vecLength(vecSub(group.center, center));
            if (d < bestDistance) {
                bestDistance = d;
                best = group;
            }
        }

        if (best && bestDistance <= template.edgeM * CLUSTER_RADIUS_RATIO) {
            best.markers.push(marker);
            best.points.push(center);
            best.center = vecScale(best.points.reduce(vecAdd, [0, 0, 0]), 1 / best.points.length);
        }
        else {
            groups.push({ template, markers: [marker], points: [center], center });
        }
    }

    return groups;
}

function updateCubes(markers, now) {
    const groups = groupMarkers(markers);

    /* Rattachement groupe -> cube suivi, du plus proche au plus éloigné. */
    const pairs = [];
    groups.forEach((group, gi) => {
        cubes.forEach((cube, ci) => {
            if (cube.template !== group.template || !cube.lastCenter) return;
            const d = vecLength(vecSub(cube.lastCenter, group.center));
            if (d <= group.template.edgeM * TRACK_RADIUS_RATIO) pairs.push({ gi, ci, d });
        });
    });
    pairs.sort((p, q) => p.d - q.d);

    const usedGroups = new Set();
    const usedCubes = new Set();
    const assignment = new Map();

    for (const p of pairs) {
        if (usedGroups.has(p.gi) || usedCubes.has(p.ci)) continue;
        usedGroups.add(p.gi);
        usedCubes.add(p.ci);
        assignment.set(cubes[p.ci], groups[p.gi]);
    }

    groups.forEach((group, gi) => {
        if (usedGroups.has(gi) || cubes.length >= MAX_CUBES) return;
        const cube = makeCube(group.template);
        cubes.push(cube);
        assignment.set(cube, group);
    });

    cubes.sort((p, q) => p.number - q.number);

    for (const cube of cubes) {
        const group = assignment.get(cube);
        const own = group ? group.markers : [];
        for (const marker of own) marker._cube = cube;

        updateCube(cube, own, now);

        if (group) {
            cube.lastSeen = now;
            if (cube.center) cube.lastCenter = [...cube.center];
        }
    }

    /* Cubes disparus depuis un moment : oubliés, sauf s'ils font partie d'une position enregistrée. */
    const keep = new Set(recorded ? recorded.members : []);
    cubes = cubes.filter(cube => keep.has(cube) || now - cube.lastSeen <= CUBE_FORGET_MS);
}

/* Positions relatives en direct, par rapport au cube de plus petit numéro. */
function computeLiveSet() {
    const tracked = cubes.filter(cube => cube.frame && !cube.held);
    if (tracked.length < 2) return null;

    const ref = tracked[0];
    const rels = new Map();
    for (const cube of tracked.slice(1)) rels.set(cube, relativePose(ref.frame, cube.frame));
    return { ref, rels };
}


/* ============================================================
   POSITION RELATIVE ENTRE CUBES

   rel.x, rel.y, rel.z : axes d'un cube exprimés dans le repère du cube de référence
   rel.t               : centre du cube dans le repère du cube de référence (mètres)
============================================================ */

function relativePose(frameA, frameB) {
    const inA = v => [vecDot(v, frameA.x), vecDot(v, frameA.y), vecDot(v, frameA.z)];
    return {
        x: inA(frameB.x),
        y: inA(frameB.y),
        z: inA(frameB.z),
        t: inA(vecSub(frameB.origin, frameA.origin))
    };
}

/* Repère caméra du cube B reconstruit depuis le cube A et la relation figée. */
function frameFromRelative(frameA, rel) {
    return {
        origin: framePointToCamera(frameA, rel.t),
        x: frameDirToCamera(frameA, rel.x),
        y: frameDirToCamera(frameA, rel.y),
        z: frameDirToCamera(frameA, rel.z)
    };
}

function eulerDegrees(axes) {
    if (!axes) return null;

    const r00 = axes.x[0];
    const r10 = axes.x[1];
    const r20 = axes.x[2];
    const r21 = axes.y[2];
    const r22 = axes.z[2];
    const r01 = axes.y[0];
    const r11 = axes.y[1];

    const pitch = Math.atan2(-r20, Math.hypot(r00, r10));
    let roll;
    let yaw;

    if (Math.abs(Math.cos(pitch)) > 1e-6) {
        roll = Math.atan2(r21, r22);
        yaw = Math.atan2(r10, r00);
    }
    else {
        roll = 0;
        yaw = Math.atan2(-r01, r11);
    }

    const toDeg = 180 / Math.PI;
    return { roll: roll * toDeg, pitch: pitch * toDeg, yaw: yaw * toDeg };
}

/* Angle (en degrés) entre deux orientations données par leurs axes. */
function rotationAngleDeg(a, b) {
    const trace = vecDot(a.x, b.x) + vecDot(a.y, b.y) + vecDot(a.z, b.z);
    const cos = Math.max(-1, Math.min(1, (trace - 1) / 2));
    return Math.acos(cos) * 180 / Math.PI;
}


/* ============================================================
   STL : CHARGEMENT
============================================================ */

function parseBinarySTL(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    if (view.byteLength < 84) throw new Error("fichier trop court ou invalide");

    const count = view.getUint32(80, true);
    const expected = 84 + count * 50;

    if (view.byteLength < expected) {
        const head = new TextDecoder("utf-8").decode(new Uint8Array(arrayBuffer, 0, 5));
        if (head.toLowerCase() === "solid") {
            throw new Error("STL ASCII non pris en charge (enregistrez-le en binaire)");
        }
        throw new Error("fichier tronqué");
    }

    /* Sommets en mm, 9 valeurs par triangle. */
    const vertsMm = new Float32Array(count * 9);
    let offset = 84;
    let k = 0;

    for (let i = 0; i < count; i++) {
        offset += 12;                          // normale ignorée
        for (let j = 0; j < 9; j++) {
            vertsMm[k++] = view.getFloat32(offset, true);
            offset += 4;
        }
        offset += 2;                           // attribut ignoré
    }

    return {
        count,
        vertsMm,                                   // maillage complet, pour l'export
        view: makeViewMesh(simplifyForDisplay(vertsMm, count))
    };
}

/* Tableaux de travail pour dessiner un maillage. */
function makeViewMesh(vertsMm) {
    const count = vertsMm.length / 9;

    /* Normale de chaque triangle, pour l'éclairage. */
    const normals = new Float32Array(count * 3);
    for (let i = 0; i < count; i++) {
        const p = i * 9;
        const e1 = [vertsMm[p + 3] - vertsMm[p], vertsMm[p + 4] - vertsMm[p + 1], vertsMm[p + 5] - vertsMm[p + 2]];
        const e2 = [vertsMm[p + 6] - vertsMm[p], vertsMm[p + 7] - vertsMm[p + 1], vertsMm[p + 8] - vertsMm[p + 2]];
        const c = vecCross(e1, e2);
        const length = vecLength(c);
        if (length > 1e-12) {
            normals[i * 3] = c[0] / length;
            normals[i * 3 + 1] = c[1] / length;
            normals[i * 3 + 2] = c[2] / length;
        }
    }

    return {
        count,
        vertsMm,
        normals,
        proj: new Float32Array(count * 6),
        depth: new Float32Array(count),
        order: new Uint32Array(count),
        shade: new Uint8Array(count)
    };
}

/*
  Allège un maillage trop dense pour l'affichage : les sommets voisins
  sont regroupés sur une grille, les triangles devenus plats sont retirés.
  La grille est agrandie jusqu'à passer sous STL_DISPLAY_MAX_TRIANGLES.
*/
function simplifyForDisplay(vertsMm, count) {
    if (count <= STL_DISPLAY_MAX_TRIANGLES) return vertsMm;

    const min = [Infinity, Infinity, Infinity];
    const max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < vertsMm.length; i++) {
        const a = i % 3;
        if (vertsMm[i] < min[a]) min[a] = vertsMm[i];
        if (vertsMm[i] > max[a]) max[a] = vertsMm[i];
    }

    const size = Math.max(max[0] - min[0], max[1] - min[1], max[2] - min[2]) || 1;
    let cell = size / 96;
    let result = vertsMm;

    for (let attempt = 0; attempt < 12; attempt++) {
        const cells = new Map();          // cellule -> [somme x, somme y, somme z, nombre, indice]
        const ids = new Uint32Array(count * 3);
        let next = 0;

        for (let v = 0; v < count * 3; v++) {
            const p = v * 3;
            const key =
                Math.floor((vertsMm[p] - min[0]) / cell) + "," +
                Math.floor((vertsMm[p + 1] - min[1]) / cell) + "," +
                Math.floor((vertsMm[p + 2] - min[2]) / cell);
            let entry = cells.get(key);
            if (!entry) {
                entry = [0, 0, 0, 0, next++];
                cells.set(key, entry);
            }
            entry[0] += vertsMm[p];
            entry[1] += vertsMm[p + 1];
            entry[2] += vertsMm[p + 2];
            entry[3]++;
            ids[v] = entry[4];
        }

        const points = new Float32Array(next * 3);
        for (const entry of cells.values()) {
            points[entry[4] * 3] = entry[0] / entry[3];
            points[entry[4] * 3 + 1] = entry[1] / entry[3];
            points[entry[4] * 3 + 2] = entry[2] / entry[3];
        }

        const out = [];
        const seen = new Set();
        for (let i = 0; i < count; i++) {
            const a = ids[i * 3], b = ids[i * 3 + 1], c = ids[i * 3 + 2];
            if (a === b || b === c || a === c) continue;

            /* Même triangle déjà gardé (même sens de rotation) ? */
            const m = Math.min(a, b, c);
            const key = m === a ? a + "," + b + "," + c
                      : m === b ? b + "," + c + "," + a
                      : c + "," + a + "," + b;
            if (seen.has(key)) continue;
            seen.add(key);

            out.push(a, b, c);
        }

        result = new Float32Array(out.length * 3);
        for (let i = 0; i < out.length; i++) {
            result[i * 3] = points[out[i] * 3];
            result[i * 3 + 1] = points[out[i] * 3 + 1];
            result[i * 3 + 2] = points[out[i] * 3 + 2];
        }

        if (result.length / 9 <= STL_DISPLAY_MAX_TRIANGLES) break;
        cell *= 1.3;
    }

    return result;
}

const meshCache = new Map();    // nom de fichier -> Promise<mesh>

function loadMesh(name) {
    if (meshCache.has(name)) return meshCache.get(name);

    const promise = fetch(name, { cache: "no-store" })
        .then(response => {
            if (!response.ok) throw new Error("fichier introuvable");
            return response.arrayBuffer();
        })
        .then(parseBinarySTL);

    promise.catch(() => meshCache.delete(name));   // permet un nouvel essai
    meshCache.set(name, promise);
    return promise;
}

async function loadTemplateSTL(template) {
    if (template.mesh) return;
    template.stlState = "chargement…";
    try {
        template.mesh = await loadMesh(template.stlName);
        template.stlState =
            template.mesh.count + " triangles" +
            (template.mesh.view.count < template.mesh.count
                ? " (" + template.mesh.view.count + " affichés)"
                : "");
    }
    catch (error) {
        console.error("Chargement STL :", error);
        template.mesh = null;
        template.stlState = "ERREUR — " + errorText(error);
    }
    updateButtonsAndGrid();
}


/* ============================================================
   STL : DESSIN

   Rendu en volume ombré : chaque triangle est éclairé selon son
   orientation, les faces arrière sont ignorées. Le modèle est
   dessiné sur un calque séparé puis posé sur la vidéo avec une
   légère transparence, pour garder l'objet réel visible dessous.
============================================================ */

let stlLayer = null;
let stlLayerCtx = null;

function stlPalette(cube) {
    if (cube.palette) return cube.palette;

    const base = cube.color.map(c => c * STL_TINT + 244 * (1 - STL_TINT));
    cube.palette = [];

    for (let i = 0; i < STL_SHADE_LEVELS; i++) {
        const k = 0.28 + 0.72 * i / (STL_SHADE_LEVELS - 1);
        cube.palette.push("rgb(" + base.map(c => Math.round(c * k)).join(",") + ")");
    }
    return cube.palette;
}

function drawSTL(cube, frame) {
    if (!cube.template.mesh || !frame || !cameraModel || !overlay.width) return;
    const mesh = cube.template.mesh.view;

    if (!stlLayer) {
        stlLayer = document.createElement("canvas");
        stlLayerCtx = stlLayer.getContext("2d");
    }
    if (stlLayer.width !== overlay.width || stlLayer.height !== overlay.height) {
        stlLayer.width = overlay.width;
        stlLayer.height = overlay.height;
    }

    const ctx = stlLayerCtx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, stlLayer.width, stlLayer.height);
    ctx.setTransform(overlayScale, 0, 0, overlayScale, 0, 0);

    const s = STL_SCALE_TO_M;
    const o = framePointToCamera(frame, cube.stlOffsetM);

    const ax = frame.x, ay = frame.y, az = frame.z;
    const fx = cameraModel.fx, fy = cameraModel.fy;
    const cx = cameraModel.cx, cy = cameraModel.cy;
    const L = STL_LIGHT_DIR;

    const v = mesh.vertsMm;
    const nrm = mesh.normals;
    const proj = mesh.proj;
    const depth = mesh.depth;
    const order = mesh.order;
    const shade = mesh.shade;
    const maxLevel = STL_SHADE_LEVELS - 1;
    let visible = 0;

    for (let i = 0; i < mesh.count; i++) {
        /* Normale du triangle dans le repère caméra. */
        const n = i * 3;
        const nX = ax[0] * nrm[n] + ay[0] * nrm[n + 1] + az[0] * nrm[n + 2];
        const nY = ax[1] * nrm[n] + ay[1] * nrm[n + 1] + az[1] * nrm[n + 2];
        const nZ = ax[2] * nrm[n] + ay[2] * nrm[n + 1] + az[2] * nrm[n + 2];

        let k = i * 9;
        let p = i * 6;
        let depthSum = 0;
        let ok = true;

        for (let j = 0; j < 3; j++) {
            const vx = v[k] * s, vy = v[k + 1] * s, vz = v[k + 2] * s;
            const X = o[0] + ax[0] * vx + ay[0] * vy + az[0] * vz;
            const Y = o[1] + ax[1] * vx + ay[1] * vy + az[1] * vz;
            const Z = o[2] + ax[2] * vx + ay[2] * vy + az[2] * vz;

            if (Z <= 0.001) { ok = false; break; }

            /* Face arrière : la normale ne regarde pas la caméra. */
            if (j === 0 && nX * X + nY * Y + nZ * Z >= 0) { ok = false; break; }

            proj[p] = fx * X / Z + cx;
            proj[p + 1] = fy * Y / Z + cy;
            depthSum += Z;
            k += 3;
            p += 2;
        }

        if (!ok) continue;

        const diffuse = Math.max(0, nX * L[0] + nY * L[1] + nZ * L[2]);
        shade[i] = Math.round(diffuse * maxLevel);
        depth[i] = depthSum;
        order[visible++] = i;
    }

    /* Algorithme du peintre : faces lointaines d'abord. */
    const sorted = order.subarray(0, visible);
    sorted.sort((a, b) => depth[b] - depth[a]);

    const palette = stlPalette(cube);
    let current = -1;

    ctx.lineJoin = "round";
    ctx.lineWidth = 0.6;          // comble les jours entre triangles voisins

    for (let m = 0; m < visible; m++) {
        const i = sorted[m];
        const p = i * 6;

        if (shade[i] !== current) {
            current = shade[i];
            ctx.fillStyle = palette[current];
            ctx.strokeStyle = palette[current];
        }

        ctx.beginPath();
        ctx.moveTo(proj[p], proj[p + 1]);
        ctx.lineTo(proj[p + 2], proj[p + 3]);
        ctx.lineTo(proj[p + 4], proj[p + 5]);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
    }

    overlayCtx.save();
    overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
    overlayCtx.globalAlpha = STL_ALPHA;
    overlayCtx.drawImage(stlLayer, 0, 0);
    overlayCtx.restore();

    /* Origine du STL : simple pastille. */
    const origin2D = project3D(o);
    if (origin2D) {
        overlayCtx.beginPath();
        overlayCtx.arc(origin2D.x, origin2D.y, 3.5, 0, Math.PI * 2);
        overlayCtx.fillStyle = cubeColor(cube);
        overlayCtx.fill();
        overlayCtx.lineWidth = 1.5;
        overlayCtx.strokeStyle = "rgba(255,255,255,.95)";
        overlayCtx.stroke();
    }
}


/* ============================================================
   STL : EXPORT

   Tous les fichiers exportés partagent le système de coordonnées
   du STL du cube de référence :
   - cube de référence : STL inchangé ;
   - autres cubes : sommets déplacés selon la position enregistrée.
============================================================ */

/* parts : liste de [mesh, transform ou null] réunis dans un seul fichier. */
function buildBinarySTL(parts, headerText) {
    const total = parts.reduce((sum, part) => sum + part[0].count, 0);
    const buffer = new ArrayBuffer(84 + total * 50);
    const view = new DataView(buffer);

    for (let i = 0; i < Math.min(80, headerText.length); i++) {
        view.setUint8(i, headerText.charCodeAt(i) & 0x7f);
    }
    view.setUint32(80, total, true);

    let offset = 84;

    for (const [mesh, transform] of parts) {
    const v = mesh.vertsMm;
    for (let i = 0; i < mesh.count; i++) {
        const k = i * 9;
        let a = [v[k], v[k + 1], v[k + 2]];
        let b = [v[k + 3], v[k + 4], v[k + 5]];
        let c = [v[k + 6], v[k + 7], v[k + 8]];

        if (transform) {
            a = transform(a);
            b = transform(b);
            c = transform(c);
        }

        const cross = vecCross(vecSub(b, a), vecSub(c, a));
        const length = vecLength(cross);
        const normal = length > 1e-12 ? vecScale(cross, 1 / length) : [0, 0, 0];

        for (const vec of [normal, a, b, c]) {
            view.setFloat32(offset, vec[0], true);
            view.setFloat32(offset + 4, vec[1], true);
            view.setFloat32(offset + 8, vec[2], true);
            offset += 12;
        }
        view.setUint16(offset, 0, true);
        offset += 2;
    }
    }

    return buffer;
}

/* Sommet du STL d'un cube (mm) -> coordonnées du STL du cube de référence (mm). */
function makeToRefTransform(rel, offsetSelfM, offsetRefM) {
    const tMm = vecScale(rel.t, 1000);
    const offsetRef = vecScale(offsetRefM, 1000);
    const offsetSelf = vecScale(offsetSelfM, 1000);

    return function(vertex) {
        const q = vecAdd(offsetSelf, vertex);              // repère du cube
        const inRef = vecAdd(
            tMm,
            vecAdd(
                vecAdd(vecScale(rel.x, q[0]), vecScale(rel.y, q[1])),
                vecScale(rel.z, q[2])
            )
        );
        return vecSub(inRef, offsetRef);                   // repère du STL de référence
    };
}

function downloadBuffer(buffer, fileName) {
    const blob = new Blob([buffer], { type: "application/octet-stream" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = fileName;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
}

/*
  EXPORT « UN CUBE = UN STL »

  Chaque cube enregistré donne son propre fichier STL, tous dans le
  système de coordonnées du STL du cube de référence (cube 1) :
  importés ensemble, ils arrivent déjà placés, en objets séparés.
*/
function cubeExportFiles() {
    const ref = recorded.ref;
    return recorded.members.map(cube => {
        const base = cube.template.stlName.replace(/\.stl$/i, "");
        const transform = cube === ref
            ? null
            : makeToRefTransform(recorded.rels.get(cube), cube.stlOffsetM, ref.stlOffsetM);
        return {
            name: base + "_cube_" + cube.number + ".stl",
            data: new Uint8Array(buildBinarySTL(
                [[cube.template.mesh, transform]],
                "AprilTag " + VERSION + " cube " + cube.number
            ))
        };
    });
}

const CRC_TABLE = (function() {
    const table = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
        let c = n;
        for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
        table[n] = c >>> 0;
    }
    return table;
})();

function crc32(bytes) {
    let c = 0xffffffff;
    for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
}

/* Archive ZIP simple, sans compression. */
function makeZip(files) {
    const encoder = new TextEncoder();
    const entries = files.map(file => ({
        name: encoder.encode(file.name),
        data: file.data,
        crc: crc32(file.data)
    }));

    let size = 22;
    for (const e of entries) size += 30 + e.name.length + e.data.length + 46 + e.name.length;

    const buffer = new ArrayBuffer(size);
    const view = new DataView(buffer);
    const bytes = new Uint8Array(buffer);
    let offset = 0;

    for (const e of entries) {
        e.offset = offset;
        view.setUint32(offset, 0x04034b50, true);
        view.setUint16(offset + 4, 20, true);
        view.setUint16(offset + 6, 0x0800, true);           // noms en UTF-8
        view.setUint16(offset + 8, 0, true);                 // stocké, sans compression
        view.setUint16(offset + 10, 0, true);
        view.setUint16(offset + 12, 0x21, true);             // 1er janvier 1980
        view.setUint32(offset + 14, e.crc, true);
        view.setUint32(offset + 18, e.data.length, true);
        view.setUint32(offset + 22, e.data.length, true);
        view.setUint16(offset + 26, e.name.length, true);
        view.setUint16(offset + 28, 0, true);
        bytes.set(e.name, offset + 30);
        bytes.set(e.data, offset + 30 + e.name.length);
        offset += 30 + e.name.length + e.data.length;
    }

    const centralStart = offset;

    for (const e of entries) {
        view.setUint32(offset, 0x02014b50, true);
        view.setUint16(offset + 4, 20, true);
        view.setUint16(offset + 6, 20, true);
        view.setUint16(offset + 8, 0x0800, true);
        view.setUint16(offset + 10, 0, true);
        view.setUint16(offset + 12, 0, true);
        view.setUint16(offset + 14, 0x21, true);
        view.setUint32(offset + 16, e.crc, true);
        view.setUint32(offset + 20, e.data.length, true);
        view.setUint32(offset + 24, e.data.length, true);
        view.setUint16(offset + 28, e.name.length, true);
        view.setUint32(offset + 42, e.offset, true);
        bytes.set(e.name, offset + 46);
        offset += 46 + e.name.length;
    }

    view.setUint32(offset, 0x06054b50, true);
    view.setUint16(offset + 8, entries.length, true);
    view.setUint16(offset + 10, entries.length, true);
    view.setUint32(offset + 12, offset - centralStart, true);
    view.setUint32(offset + 16, centralStart, true);

    return buffer;
}

function exportAll() {
    if (!recorded || recorded.members.some(cube => !cube.template.mesh)) {
        setMessage("Export impossible", "Il faut une position enregistrée et tous les STL chargés.", "warning");
        return;
    }

    const files = cubeExportFiles();
    const names = files.map(f => f.name).join(", ");

    /* iPad / iPhone : feuille de partage avec un fichier par cube. */
    let shareFiles = null;
    try {
        shareFiles = files.map(f => new File([f.data], f.name, { type: "model/stl" }));
        if (!navigator.canShare || !navigator.canShare({ files: shareFiles })) shareFiles = null;
    }
    catch (_) {
        shareFiles = null;
    }

    if (shareFiles && !shareFailed) {
        navigator.share({ files: shareFiles, title: "STL positionnés" })
            .then(() => setMessage("Export des STL ✓", names, "ok"))
            .catch(error => {
                if (error && error.name === "AbortError") return;
                setMessage("Partage impossible", "Touchez de nouveau pour recevoir une archive ZIP.", "warning");
                shareFailed = true;
            });
        return;
    }

    const zipName = "STL_positionnes_" + files.length + "_cubes.zip";
    downloadBuffer(makeZip(files), zipName);
    setMessage("Export des STL ✓", zipName + " : " + names, "ok");
}

let shareFailed = false;


/* ============================================================
   VALIDATION AUTOMATIQUE DE LA POSITION
============================================================ */

function averageRel(samples) {
    let t = [0, 0, 0];
    let x = [0, 0, 0];
    let z = [0, 0, 0];

    for (const sample of samples) {
        t = vecAdd(t, sample.t);
        x = vecAdd(x, sample.x);
        z = vecAdd(z, sample.z);
    }

    x = vecNormalize(x);
    z = orthoNormalize(z, x);
    if (!z) return null;

    return { x, y: vecCross(z, x), z, t: vecScale(t, 1 / samples.length) };
}

/* Moyenne et dispersion d'une série de positions relatives. */
function windowStats(samples) {
    const mean = averageRel(samples);
    if (!mean) return null;

    let squares = 0;
    let spreadDeg = 0;

    for (const sample of samples) {
        const d = vecLength(vecSub(sample.t, mean.t)) * 1000;
