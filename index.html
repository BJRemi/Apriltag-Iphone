<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
viewport-fit=cover,
user-scalable=no">

<meta name="theme-color" content="#05070a">

<title>AprilTag iPad V5.2</title>

<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#05070a;
    color:white;
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    system-ui,
    sans-serif;
}

body{
    min-height:100svh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:
    env(safe-area-inset-top)
    14px
    env(safe-area-inset-bottom);
}

h1{
    font-size:22px;
    margin:12px 0 4px;
}

.version{
    color:#8f98a5;
    font-size:13px;
    margin-bottom:12px;
}

.viewer{
    position:relative;
    width:100%;
    aspect-ratio:4/3;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    border:1px solid #ffffff22;
}

video,
canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
}

video{
    object-fit:contain;
    background:#000;
}

canvas{
    z-index:1;
    pointer-events:none;
}

.message{
    position:absolute;
    z-index:2;

    left:12px;
    right:12px;
    bottom:12px;

    padding:14px;

    background:#000c;

    border-radius:14px;
    border:1px solid #ffffff22;

    backdrop-filter:blur(12px);
}

.status{
    font-size:17px;
    font-weight:700;
}

.detail{
    margin-top:5px;
    font-size:13px;
    color:#b6bec8;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:14px;
}

button{
    flex:1;
    min-height:52px;

    border:0;
    border-radius:14px;

    font-size:16px;
    font-weight:700;
}

.start{
    background:white;
    color:#05070a;
}

.stop{
    background:#20252d;
    color:white;
    border:1px solid #ffffff22;
}

.hidden{
    display:none;
}

.info{
    margin-top:14px;

    padding:12px;

    border-radius:14px;

    background:#11161d;

    font-size:13px;
    line-height:1.55;

    color:#b8c0cb;
}

.ok{
    color:#70e59b;
}

.error{
    color:#ff7777;
}

.warning{
    color:#ffd36b;
}

</style>
</head>

<body>

<main class="app">

<h1>AprilTag iPad</h1>

<div class="version">
V5.2 — Détection tag36h11
</div>

<div
    id="viewer"
    class="viewer">

    <video
        id="camera"
        autoplay
        muted
        playsinline>
    </video>

    <canvas id="overlay"></canvas>

    <div class="message">

        <div
            id="status"
            class="status">
            Caméra non démarrée
        </div>

        <div
            id="detail"
            class="detail">
            Initialisation du moteur AprilTag…
        </div>

    </div>

</div>

<div class="buttons">

<button
    id="start"
    class="start">
    Démarrer caméra
</button>

<button
    id="stop"
    class="stop hidden">
    Arrêter
</button>

</div>

<div
    id="diagnostic"
    class="info">
    Chargement du moteur AprilTag…
</div>

</main>


<!-- IMPORTANT :
     apriltag.js doit être dans le même dossier
     que index.html
-->
<script src="apriltag.js"></script>


<script>

const video =
document.getElementById("camera");

const viewer =
document.getElementById("viewer");

const overlay =
document.getElementById("overlay");

const overlayCtx =
overlay.getContext("2d");

const startButton =
document.getElementById("start");

const stopButton =
document.getElementById("stop");

const status =
document.getElementById("status");

const detail =
document.getElementById("detail");

const diagnostic =
document.getElementById("diagnostic");


let stream = null;

let detector = null;

let detectionRunning = false;

let detectionTimer = null;

let totalFrames = 0;

let detectedFrames = 0;


/* ================================================
   MESSAGE
================================================ */

function message(title,text,type=""){

    status.textContent = title;

    detail.textContent = text;

    status.className =
        "status " + type;
}


/* ================================================
   APRILTAG
================================================ */

function createAprilTagDetector(){

    const detections = [];


    if(
        typeof Module === "undefined" ||
        !Module.cwrap
    ){
        throw new Error(
            "Module AprilTag indisponible."
        );
    }


    if(
        typeof Runtime === "undefined" ||
        !Runtime.addFunction
    ){
        throw new Error(
            "Runtime AprilTag indisponible."
        );
    }


    const detect =
    Module.cwrap(
        "detect",
        "number",
        [
            "number",
            "number",
            "number",
            "number"
        ]
    );


    const detected =
    Runtime.addFunction(function(

        id,

        x1,y1,
        x2,y2,
        x3,y3,
        x4,y4,

        m00,m01,m02,
        m10,m11,m12,
        m20,m21,m22

    ){

        detections.push({

            id:id,

            x1:x1,
            y1:y1,

            x2:x2,
            y2:y2,

            x3:x3,
            y3:y3,

            x4:x4,
            y4:y4,

            matrix:[
                m00,m01,m02,
                m10,m11,m12,
                m20,m21,m22
            ]

        });

    });


    return function(source){

        let sourceWidth =
        source.videoWidth ||
        source.width;

        let sourceHeight =
        source.videoHeight ||
        source.height;


        if(
            !sourceWidth ||
            !sourceHeight
        ){
            return [];
        }


        /*
        Limite volontaire à 800 px,
        comme dans l'exemple d'origine
        du moteur Emscripten.
        */

        let downscale = 1;


        if(sourceWidth > 800){

            downscale =
            sourceWidth / 800;

        }


        if(sourceHeight > 800){

            downscale =
            Math.max(
                sourceHeight / 800,
                downscale
            );

        }


        const width =
        Math.floor(
            sourceWidth / downscale
        );


        const height =
        Math.floor(
            sourceHeight / downscale
        );


        detectionCanvas.width =
        width;

        detectionCanvas.height =
        height;


        detectionCtx.drawImage(

            source,

            0,
            0,

            width,
            height

        );


        const imageData =
        detectionCtx.getImageData(

            0,
            0,

            width,
            height

        );


        const buffer =
        Module._malloc(
            imageData.data.length *
            imageData.data.BYTES_PER_ELEMENT
        );


        Module.HEAPU8.set(
            imageData.data,
            buffer
        );


        detections.length = 0;


        detect(
            detected,
            width,
            height,
            buffer
        );


        Module._free(buffer);


        return {
            detections:
            detections.slice(),

            width:
            width,

            height:
            height
        };

    };

}


/* ================================================
   CANVAS DE CALCUL
================================================ */

const detectionCanvas =
document.createElement("canvas");

const detectionCtx =
detectionCanvas.getContext(
    "2d",
    {
        willReadFrequently:true
    }
);


/* ================================================
   INITIALISATION APRILTAG
================================================ */

function initialiseDetector(){

    try{

        detector =
        createAprilTagDetector();


        diagnostic.innerHTML =

        "<span class='ok'>" +
        "MOTEUR APRILTAG : PRÊT" +
        "</span>" +

        "<br>" +

        "Famille : tag36h11" +

        "<br>" +

        "apriltag.js : chargé localement";


        message(
            "Moteur prêt",
            "Vous pouvez démarrer la caméra.",
            "ok"
        );

    }

    catch(error){

        console.error(error);


        detector = null;


        diagnostic.innerHTML =

        "<span class='error'>" +
        "MOTEUR APRILTAG : ERREUR" +
        "</span>" +

        "<br>" +

        error.message;


        message(
            "Erreur AprilTag",
            error.message,
            "error"
        );

    }

}


/*
L'ancien moteur Emscripten peut demander
un court délai avant d'être complètement
initialisé.
*/

function waitForAprilTag(attempt=0){

    if(
        typeof Module !== "undefined" &&
        Module.cwrap &&
        typeof Runtime !== "undefined" &&
        Runtime.addFunction
    ){

        initialiseDetector();

        return;
    }


    if(attempt > 40){

        diagnostic.innerHTML =

        "<span class='error'>" +
        "MOTEUR APRILTAG : NON CHARGÉ" +
        "</span>" +

        "<br>" +

        "Vérifiez que apriltag.js se trouve " +
        "dans le même dossier que index.html.";


        message(
            "AprilTag indisponible",
            "apriltag.js n'a pas pu être chargé.",
            "error"
        );

        return;
    }


    setTimeout(
        function(){

            waitForAprilTag(
                attempt + 1
            );

        },
        250
    );

}


waitForAprilTag();


/* ================================================
   DÉMARRAGE CAMÉRA
================================================ */

async function startCamera(){

    startButton.disabled =
    true;


    message(
        "Demande caméra…",
        "Ouverture de la caméra arrière.",
        "warning"
    );


    try{

        if(!window.isSecureContext){

            throw new Error(
                "La page doit être ouverte en HTTPS."
            );

        }


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            throw new Error(
                "API caméra indisponible."
            );

        }


        try{

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        exact:"environment"
                    },

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    }

                }

            });

        }

        catch(error){

            stream =
            await navigator.mediaDevices.getUserMedia({

                audio:false,

                video:{

                    facingMode:{
                        ideal:"environment"
                    }

                }

            });

        }


        video.srcObject =
        stream;


        await video.play();


        if(!video.videoWidth){

            await new Promise(resolve=>{

                video.addEventListener(
                    "loadedmetadata",
                    resolve,
                    {
                        once:true
                    }
                );

            });

        }


        configureViewer();


        startButton.classList.add(
            "hidden"
        );

        stopButton.classList.remove(
            "hidden"
        );


        detectionRunning =
        true;


        totalFrames =
        0;


        detectedFrames =
        0;


        message(
            "Recherche AprilTag…",
            "Présentez un tag36h11 devant la caméra.",
            "warning"
        );


        if(!detector){

            initialiseDetector();

        }


        detectionTimer =
        setInterval(
            processFrame,
            180
        );

    }

    catch(error){

        console.error(error);


        message(
            "Échec caméra",
            error.name +
            " — " +
            error.message,
            "error"
        );


        startButton.disabled =
        false;

    }

}


/* ================================================
   DIMENSIONS
================================================ */

function configureViewer(){

    const width =
    video.videoWidth;

    const height =
    video.videoHeight;


    if(
        !width ||
        !height
    ){
        return;
    }


    viewer.style.aspectRatio =
    width + "/" + height;


    overlay.width =
    width;


    overlay.height =
    height;

}


/* ================================================
   ANALYSE
================================================ */

function processFrame(){

    if(
        !detectionRunning ||
        !detector ||
        video.readyState < 2
    ){
        return;
    }


    try{

        totalFrames++;


        const result =
        detector(video);


        const tags =
        result.detections;


        drawDetections(
            tags,
            result.width,
            result.height
        );


        if(tags.length > 0){

            detectedFrames++;


            const ids =
            tags
            .map(
                tag => tag.id
            )
            .join(", ");


            message(
                "TAG DÉTECTÉ ✓",
                "ID : " + ids,
                "ok"
            );


            diagnostic.innerHTML =

            "<span class='ok'>" +
            "APRILTAG DÉTECTÉ" +
            "</span>" +

            "<br>" +

            "Famille : tag36h11" +

            "<br>" +

            "ID : " +
            ids +

            "<br>" +

            "Résolution analyse : " +
            result.width +
            " × " +
            result.height +

            "<br>" +

            "Images analysées : " +
            totalFrames +

            "<br>" +

            "Images avec détection : " +
            detectedFrames;

        }

        else{

            message(
                "Recherche AprilTag…",
                "Aucun tag36h11 détecté.",
                "warning"
            );


            diagnostic.innerHTML =

            "<span class='ok'>" +
            "MOTEUR APRILTAG : ACTIF" +
            "</span>" +

            "<br>" +

            "Famille : tag36h11" +

            "<br>" +

            "Résolution analyse : " +
            result.width +
            " × " +
            result.height +

            "<br>" +

            "Images analysées : " +
            totalFrames;

        }

    }

    catch(error){

        console.error(
            "Erreur détection",
            error
        );


        message(
            "Erreur détection",
            error.message,
            "error"
        );


        diagnostic.innerHTML =

        "<span class='error'>" +
        "ERREUR DÉTECTION" +
        "</span>" +

        "<br>" +

        error.message;


        detectionRunning =
        false;

    }

}


/* ================================================
   DESSIN
================================================ */

function drawDetections(
    tags,
    detectionWidth,
    detectionHeight
){

    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if(
        !tags ||
        tags.length === 0
    ){
        return;
    }


    const scaleX =
    overlay.width /
    detectionWidth;


    const scaleY =
    overlay.height /
    detectionHeight;


    tags.forEach(tag=>{


        const points = [

            {
                x:tag.x1 * scaleX,
                y:tag.y1 * scaleY
            },

            {
                x:tag.x2 * scaleX,
                y:tag.y2 * scaleY
            },

            {
                x:tag.x3 * scaleX,
                y:tag.y3 * scaleY
            },

            {
                x:tag.x4 * scaleX,
                y:tag.y4 * scaleY
            }

        ];


        overlayCtx.beginPath();


        overlayCtx.moveTo(
            points[0].x,
            points[0].y
        );


        for(
            let i=1;
            i<4;
            i++
        ){

            overlayCtx.lineTo(
                points[i].x,
                points[i].y
            );

        }


        overlayCtx.closePath();


        overlayCtx.lineWidth =
        6;


        overlayCtx.strokeStyle =
        "#39ff74";


        overlayCtx.stroke();


        const centerX =
        (
            points[0].x +
            points[1].x +
            points[2].x +
            points[3].x
        ) / 4;


        const centerY =
        (
            points[0].y +
            points[1].y +
            points[2].y +
            points[3].y
        ) / 4;


        overlayCtx.beginPath();


        overlayCtx.arc(
            centerX,
            centerY,
            8,
            0,
            Math.PI * 2
        );


        overlayCtx.fillStyle =
        "#ff3b30";


        overlayCtx.fill();


        overlayCtx.font =
        "bold 34px -apple-system";


        overlayCtx.lineWidth =
        7;


        overlayCtx.strokeStyle =
        "#000";


        overlayCtx.strokeText(

            "ID " + tag.id,

            points[0].x,

            Math.max(
                40,
                points[0].y - 15
            )

        );


        overlayCtx.fillStyle =
        "#39ff74";


        overlayCtx.fillText(

            "ID " + tag.id,

            points[0].x,

            Math.max(
                40,
                points[0].y - 15
            )

        );

    });

}


/* ================================================
   ARRÊT
================================================ */

function stopCamera(){

    detectionRunning =
    false;


    if(detectionTimer){

        clearInterval(
            detectionTimer
        );


        detectionTimer =
        null;

    }


    overlayCtx.clearRect(
        0,
        0,
        overlay.width,
        overlay.height
    );


    if(stream){

        stream
        .getTracks()
        .forEach(
            track => track.stop()
        );

    }


    stream =
    null;


    video.srcObject =
    null;


    startButton.disabled =
    false;


    startButton.classList.remove(
        "hidden"
    );


    stopButton.classList.add(
        "hidden"
    );


    message(
        "Caméra arrêtée",
        "Touchez Démarrer caméra pour reprendre."
    );

}


/* ================================================
   BOUTONS
================================================ */

startButton.addEventListener(
    "click",
    startCamera
);


stopButton.addEventListener(
    "click",
    stopCamera
);


/* ================================================
   SAFARI QUITTE LA PAGE
================================================ */

window.addEventListener(
    "pagehide",
    stopCamera
);

</script>

</body>
</html>
